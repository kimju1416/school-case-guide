정 기간 규정은 심사와 같다(60일, 1회 1개월 연장). 이 기간 안에 재심사청구나 소송을 하지 않거나 취하하면, 공제회와 청구인 사이에 심사 결정과 같은 합의가 성립한 것으로 본다.","basis":"학교안전법 제60조, 제61조, 제62조, 제63조"},{"stage":"불복·구제","when":"재결서 정본을 송달받은 날부터 60일 이내","who":"재결에 불복하는 자","what":"공제급여 관련 소송","detail":"이 기간 안에 소송을 내지 않거나 취하하면 재결 내용과 같은 합의가 성립한 것으로 본다. 법은 ‘공제급여와 관련된 소송’이라고만 쓰고 있다. 심사·재심사 단계에서 집행정지 같은 제도는 법에 규정돼 있지 않다.","basis":"학교안전법 제64조"},{"stage":"불복·구제","when":"공제와 별도로","who":"피해 학생 보호자","what":"손해배상 청구(민원·소송)가 올 때","detail":"공제급여를 받은 금액 범위 안에서는 국가·지자체·학교장·피공제자(교직원 포함)의 배상 책임이 면제된다. 판결로 공제가입자·피공제자가 줄 배상액이 확정되면 그 금액은 공제급여로 보아 공제회가 부담한다. 개인 교사에게 직접 청구가 오면 혼자 대응하지 말고 학교장·교육청(법률지원)에 알리고 교원보호공제(소송비용·배상금 지원)를 신청한다.","basis":"학교안전법 제35조 제2항, 제45조 제1항; 교원지위법 제22조"},{"stage":"종결·사후","when":"치료 종결 후","who":"보호자·공제회","what":"장해·간병 등 추가 급여, 종결","detail":"요양을 마친 뒤에도 장해가 남으면 장해급여, 상시·수시 간병이 필요하면 간병급여를 청구한다. 학교안전사고로 인한 치료가 끝나면 그 사고의 치료비 보상도 종결된다. 사고와 인과관계 없는 치료는 제외된다.","basis":"학교안전법 제37조·제38조; 경북학교안전공제회 공제급여 안내"},{"stage":"종결·사후","when":"사고 후 3년","who":"보호자(수급권자)","what":"청구권 소멸시효","detail":"공제급여를 받을 권리는 3년간 행사하지 않으면 시효로 소멸한다. 졸업·전학 등 신분이 바뀌어도 권리는 사라지지 않는다. 늦게 나타난 후유증이 있으면 이 기간 안에 청구하도록 안내한다.","basis":"학교안전법 제65조, 제47조 제1항"},{"stage":"종결·사후","when":"사고 수습 후","who":"학교장·교감·보건교사","what":"재발 방지와 심리 지원","detail":"시설 하자 점검·개선, 응급상황 관리체계 점검, 교직원 심폐소생술 교육(매년, 실습 2시간 포함 최소 3시간). 피해 학생·가족의 상담·심리치료는 교육감이 지원하며 지정기관 이용 비용을 1년 범위에서 부담(연장 가능).","basis":"학교보건법 제9조의2 제2항; 같은 법 시행규칙 제10조; 학교안전법 제10조의3; 같은 법 시행령 제10조의4"}],"deadlines":[{"what":"교육청 보고(학교장·인솔교사)","limit":"안전조치 후 즉시","basis":"학교안전법 제10조 제4항"},{"what":"학교안전공제회 사고발생 통지(학교장)","limit":"지체 없이","basis":"학교안전법 제44조 제2항"},{"what":"공제급여 지급 여부 결정","limit":"청구받은 날부터 14일(1회 14일 연장 가능)","basis":"학교안전법 제41조 제2항"},{"what":"공제급여 청구권 소멸시효","limit":"3년","basis":"학교안전법 제65조 제1항"},{"what":"심사청구","limit":"결정이 있음을 안 날부터 90일","basis":"학교안전법 제57조 제2항"},{"what":"심사 결정","limit":"청구받은 날부터 60일(1회 1개월 연장)","basis":"학교안전법 제59조 제1항"},{"what":"재심사청구","limit":"심사 결정서 정본 송달된 날부터 90일","basis":"학교안전법 제61조 제2항"},{"what":"재결 후 소송","limit":"재결서 정본 송달받은 날부터 60일(넘기면 합의 성립 간주)","basis":"학교안전법 제64조"}],"dont":["쓰러진 학생을 ‘괜찮아지겠지’ 하고 팔다리만 주무르며 시간을 끌지 않는다 — 체육교사가 5분가량 지체한 과실로 배상 책임이 인정된 대법원 판례(2008다5417)가 있다","머리·목을 다친 학생을 억지로 일으키거나 부축해 보건실로 걸려 보내지 않는다","변형된 팔다리를 맞추려 하지 않는다(변형된 상태 그대로 고정)","사고 기록·목격자 확인을 미루지 않는다 — 공제 통지와 이후 분쟁의 근거가 된다","보호자에게 ‘학교가 다 책임진다’, ‘선생님이 물어주겠다’처럼 책임·배상을 먼저 약속하지 않는다 — 공제 절차를 안내한다","사고통지를 보호자 요청이 있을 때까지 미루지 않는다 — 통지는 학교장의 의무다"],"contacts":[{"name":"구급·화재","tel":"119","note":"심장정지·응급증상이면 먼저 신고, 전화 도움 심폐소생술 지시 따르기"},{"name":"경상북도학교안전공제회","tel":"1899-7752","note":"대표전화, 팩스 054-854-0192, 경북 안동시 풍천면 도청대로 511"},{"name":"학교안전사고보상지원시스템","tel":"","note":"www.schoolsafe.or.kr — 학교는 사고통지, 보호자는 휴대폰 인증으로 청구"}],"forms":["사고발생통지 신고서(학교안전법 시행규칙 별지 제2호서식) — 시스템에서 작성","공제급여청구서(같은 시행규칙 별지 제1호서식) + 청구이유 증명자료(진료비 영수증 등)","간병료 청구 시: 입원확인서 등 의무기록 + 의료인 소견서(시행규칙 제3조 제2항)","보전비용청구서(별지 제1호서식, 공제가입자 거쳐 제출 — 시행규칙 제7조)","경북학교안전공제회 서식: 사고경위서, 목격자확인서, 사고확인서, 배상여부 사실 확인서","보건교사 기록: 응급환자 기록지/보건일지, 응급환자 이송 및 사고 기록지"],"law":[{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제2조 제4호·제6호","point":"교육활동(수업·특별활동·수학여행 등 체험활동·등하교 등) 중 학생·교직원·교육활동참여자의 생명·신체에 피해를 준 사고가 학교안전사고"},{"name":"학교안전사고 예방 및 보상에 관한 법률 시행령","article":"제2조, 제3조","point":"등하교, 휴식시간, 교육활동 전후 통상 체류, 기숙사 생활 시간 등도 포함. 급식·가스 중독, 일사병, 이물질 섭취 질병 등도 포함"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조 제4항·제5항","point":"학교장·인솔교사는 즉시 안전조치 후 즉시 보고. 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사상·형사상 책임을 지지 않음(민사 면책은 2025.12.2. 이후 사고부터 적용, 부칙 제2조)"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제34조~제40조의2","point":"공제급여: 요양·장해·간병·유족급여, 장례비(평균임금 100일분), 원인 모를 사망 위로금"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제41조, 제41조의2, 제44조 제2항","point":"청구·14일 결정, 학교장의 공제 안내 의무, 학교장의 지체 없는 사고 통지 의무"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제43조, 제44조 제1항, 제45조","point":"급여 제한(자해·자살, 요양지시 불이행, 자동차보험 배상 수령), 피공제자 고의·중과실 사고 시 공제회 구상, 공제급여 범위 안 배상책임 면제"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제57조~제64조, 제65조","point":"심사청구 90일, 재심사청구 90일, 재결 후 60일 소송, 청구권 시효 3년"},{"name":"국가배상법","article":"제2조 제2항","point":"공무원(국공립 교원)에게 고의 또는 중대한 과실이 있으면 국가·지자체가 그 공무원에게 구상할 수 있음"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제22조","point":"교원보호공제: 교육활동으로 생긴 손해배상금·구상권 행사 지원(고의·중과실 제외), 민·형사 소송비용 지원. 학교안전공제회에 위탁 가능"},{"name":"응급의료에 관한 법률","article":"제5조의2","point":"생명이 위급한 응급환자에게 한 응급처치로 생긴 손해·사상에 고의·중과실이 없으면 민사책임과 상해 형사책임을 지지 않고 사망 형사책임은 감면"}],"faq":[{"q":"공제 청구는 학교가 하나요, 보호자가 하나요?","a":"사고 통지는 학교장(공제가입자)의 의무이고, 요양급여 등 공제급여는 피공제자 또는 보호자가 청구한다(제36조 제1항, 제41조). 학교는 청구 방법을 안내할 의무가 있고(제41조의2), 청구서를 학교가 받았으면 지체 없이 공제회로 보낸다(시행규칙 제3조 제3항)."},{"q":"언제까지 청구할 수 있나요?","a":"공제급여를 받을 권리는 3년간 행사하지 않으면 소멸시효가 완성된다(제65조). 졸업·전학해도 권리는 없어지지 않는다(제47조)."},{"q":"비급여 치료비도 다 나오나요?","a":"요양급여는 국민건강보험법에 따라 본인이 부담한 금액이 원칙이다(제36조 제2항). 경북학교안전공제회 안내에 따르면 비급여는 원칙적으로 지급하지 않고, MRI(의사 소견에 따라 1회 등), 화상치료제, 치아보철(항목별 한도) 등 시행규칙 별표에 정한 경우만 예외로 지급한다."},{"q":"학생 본인 잘못으로 다쳤으면 못 받나요?","a":"요양급여는 과실과 관계없이 지급 대상이다. 장해·간병·유족급여를 산정할 때만 피공제자 과실을 상계할 수 있고 한도는 각 급여의 50%이며, 유치원생·미성년 초등학생, 심신상실·미약으로 인한 사고는 상계하지 않는다(제43조 제3항, 시행령 제20조의4). 자해·자살은 지급하지 않을 수 있으나 학교안전사고가 원인이면 전부 지급한다."},{"q":"교사가 개인적으로 배상 책임을 지나요?","a":"안전사고관리 지침에 따라 안전조치의무를 다했다면 민사·형사 책임을 지지 않는다(제10조 제5항, 민사 면책은 2025.12.2. 이후 사고부터). 공제급여가 지급되면 그 범위에서 교직원의 배상 책임도 면제된다(제45조). 다만 교직원 포함 피공제자의 고의·중대한 과실로 사고가 났다면 공제회가 그 사람에게 구상할 수 있고(제44조 제1항), 국공립 교원은 국가배상법 제2조 제2항에 따라 고의·중과실 시 구상될 수 있다."},{"q":"보호자가 공제회 결정이 너무 적다고 합니다.","a":"결정을 안 날부터 90일 안에 공제회 학교안전공제보상심사위원회에 심사청구, 그 결정서 송달일부터 90일 안에 공제중앙회 재심사위원회에 재심사청구, 재결서 송달일부터 60일 안에 소송을 낼 수 있다(제57조·제61조·제64조). 기간을 넘기면 결정 내용대로 합의가 성립한 것으로 본다."},{"q":"보건교사가 없는데 교사가 응급처치를 해도 되나요?","a":"교육부 가이드라인은 자격·면허와 관계없이 생명이 위급한 환자에게 한 응급처치는 응급의료법 제5조의2(선의의 응급처치 면책) 적용을 받을 수 있다고 안내한다. 판례는 오히려 즉시 응급조치를 하지 않고 지체한 교사의 책임을 인정했다(대법원 2008다5417)."}],"deep":[{"title":"119를 부를지 말지, 이렇게 가른다","body":["교육부 가이드라인의 3C(Check-Call-Care)를 따른다. 반응이 없거나 헐떡이는 호흡이면 망설이지 말고 119와 가슴압박이다.","의식이 흐리거나 횡설수설, 혼자 서거나 걷지 못할 정도의 어지러움, 머리 손상과 구토·심한 통증, 경련, 개방성·다발성 골절, 절단, 지혈 안 되는 출혈은 119 대상이다. 여기에 해당하지 않으면 보건교사 처치 후 보호자 연락·병원 진료를 안내한다.","대법원은 체육 시간 팔굽혀펴기 중 쓰러진 학생을 5분가량 주무르기만 하다 늦게 보건실로 옮긴 사안에서 체육교사의 과실을 인정했다(2008다5417). 즉각적인 판단과 신고가 교사를 지킨다."],"basis":"학교 응급상황 대응 가이드라인(2025) 제1장·제2장, 부록 판례"},{"title":"사고 통지 — 학교가 먼저 해야 보호자가 청구할 수 있다","body":["공제 절차의 출발점은 학교장의 사고발생 통지다. 학교안전사고보상지원시스템에 학교 ID로 들어가 사고 내용을 6하원칙으로 입력하고 학교장 결재 후 통보한다.","공제회에서 ‘접수’ 상태가 되어야 보호자가 공제급여를 청구할 수 있다. ‘보완’·‘대상아님’이면 사유 버튼을 눌러 확인하고 조치한다.","통지를 하지 않거나 거짓으로 하면 50만원 이하 과태료 대상이다(제72조 제2항 제2호). 경미해 보여도 병원 진료가 있으면 통지해 두는 것이 안전하다."],"basis":"학교안전법 제44조 제2항·제72조; 시행규칙 제5조의2; 경북학교안전공제회 보상절차"},{"title":"공제급여 종류와 받는 사람","body":["요양급여: 치료비 중 건강보험 본인부담금(진찰·검사·약제·처치·수술·재활·입원·간호·호송). 인공팔다리·안경·보청기 등 보조기구, 의학적으로 필요한 간병료도 요양급여로 본다.","장해급여: 요양 종료 후 장해가 남으면 국가배상법 기준 금액과 위자료. 간병급여: 치료 후에도 상시·수시 간병이 필요할 때. 유족급여: 사망 시 상속인(사실혼 배우자 포함)에게 국가배상법 기준 금액과 위자료. 장례비: 평균임금 100일분을 장례를 치른 사람에게.","위로금: 학생이 교육활동 중 학교안전사고 외의 원인을 알 수 없는 사유로 사망하면 상속인에게 4천만원(시행령). 비용보전: 교직원 등이 사고와 관련해 쓴 긴급조치 비용, 민·형사 소송비용 등을 보전받을 수 있다(보전비용청구서를 학교를 거쳐 제출)."],"basis":"학교안전법 제34조~제40조의2, 제48조; 시행령 제20조의2 관련 조항; 시행규칙 제7조; 경북학교안전공제회 기타 보상 안내"},{"title":"결정에 불복하는 길 — 90일, 90일, 60일","body":["1단계 심사청구: 결정이 있음을 안 날부터 90일 안에 해당 시·도 공제회의 학교안전공제보상심사위원회(9~15명, 변호사·전문의·교원 등)에 낸다. 60일 안에 결정하고 한 번 1개월 연장할 수 있다.","2단계 재심사청구: 심사 결정서 정본이 송달된 날부터 90일 안에 학교안전공제중앙회의 재심사위원회에 낸다. 이 기간을 넘기면 심사 결정 내용대로 합의가 성립한 것으로 본다.","3단계 소송: 재결서 정본을 송달받은 날부터 60일 안에 공제급여 관련 소송을 내지 않으면 재결 내용대로 합의가 성립한 것으로 본다. 불복은 청구인(보호자 등)이 하는 것이고, 학교는 절차 안내와 자료 협조를 한다."],"basis":"학교안전법 제57조~제64조"},{"title":"교사 개인 책임은 어디까지인가","body":["현행 학교안전법 제10조 제5항은 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사·형사 책임을 지지 않는다고 정한다. 민사 면책은 2025.12.2. 개정법 시행 이후 사고부터 적용된다.","공제급여가 지급되면 그 금액 범위 안에서 교직원의 배상 책임은 면한다(제45조). 다만 피공제자(교직원도 피공제자)의 고의·중대한 과실로 사고가 나면 공제회가 지급액을 그 사람에게 청구할 수 있고(제44조 제1항), 국공립 교원은 고의·중과실 시 국가·지자체의 구상 대상이 될 수 있다(국가배상법 제2조 제2항).","교육부는 2026.5.28. ‘고의·중과실이 아니면 면책’으로 넓히는 개정(제10조의5 신설안)을 국회와 협의해 추진한다고 발표했으나, 2026.9.24. 현재 법령정보센터의 현행법은 위 제10조 제5항이다.","보호자가 민원·소송을 걸어오면 학교장에게 보고하고 교육청 법률지원·교원보호공제(손해배상금·구상권 행사 지원, 민·형사 소송비용 지원; 고의·중과실 제외)를 이용한다. 경북은 학교안전공제회가 교원보호공제를 위탁 운영한다(2024.3.1.부터)."],"basis":"학교안전법 제10조 제5항·부칙(법률 제21149호) 제2조, 제44조, 제45조; 국가배상법 제2조; 교원지위법 제22조; 교육부 보도자료(2026.5.28.); 경북학교안전공제회 연혁"}],"tables":[{"title":"공제급여 종류 한눈에","head":["급여","언제","얼마·무엇","누구에게","근거"],"rows":[["요양급여","부상·질병 치료","건강보험 본인부담금(진찰~호송), 보조기구, 간병료","피공제자 또는 보호자","제36조"],["장해급여","요양 종료 후 장해","국가배상법 제3조 제2항 제3호 금액 + 위자료","피공제자 또는 보호자","제37조"],["간병급여","치료 후에도 상시·수시 간병 필요","대통령령 기준","실제 간병받는 피공제자 또는 보호자","제38조"],["유족급여","사고로 사망","국가배상법 제3조 제1항 제1호 금액 + 위자료","상속인(사실혼 포함)","제39조"],["장례비","사고로 사망","평균임금 100일분","장례를 행하는 자","제40조"],["위로금","원인 모를 사유로 교육활동 중 학생 사망","4천만원","상속인","제40조의2, 시행령"]],"note":"학교안전사고 예방 및 보상에 관한 법률(시행 2025.12.2.)·시행령(시행 2026.9.15.) 원문 확인. 과실상계는 장해·간병·유족급여만, 50% 한도."},{"title":"불복 절차","head":["단계","청구처","기간","결정 기간","기간 넘기면"],"rows":[["심사청구","시·도 학교안전공제회 학교안전공제보상심사위원회","결정 있음을 안 날부터 90일","60일(+1개월 1회)","—"],["재심사청구","학교안전공제중앙회 학교안전공제보상재심사위원회","심사 결정서 송달일부터 90일","60일(+1개월 1회)","심사 결정대로 합의 성립 간주"],["소송","법원(공제급여 관련 소송)","재결서 송달일부터 60일","—","재결대로 합의 성립 간주"]],"note":"학교안전법 제57조~제64조. 청구인은 공제급여 결정에 불복하는 자. 집행정지 규정 없음."},{"title":"경북학교안전공제회 요양급여 비급여 예외(안내 기준)","head":["항목","지급 기준"],"rows":[["MRI","의사 소견에 따라 1회(장해 확인·진료방향 결정·수술 후 확인 시 추가 가능)"],["치아보철","캐스트코아·포스트·레진 각 15만원 1회, 보철 50만원 2회, 임플란트 200만원 1회"],["진단서","진료비 50만원 초과 시 제출 진단서 실비"],["안경·보청기","사고 전 미착용자가 사고로 착용 시 1회"],["원칙적 부지급","상급병실료, 비급여 물리치료(도수치료 등), 비급여 주사, 한방 첩약, 식대·교통비, 비의료기관 치료"]],"note":"경상북도학교안전공제회 누리집 ‘공제급여’ 안내(2026.9.24. 확인). 세부는 시행규칙 제2조의2 별표."}],"record":"보건교사는 응급환자 기록지·보건일지와 이송·사고 기록지를 남긴다. 학교장은 교육청에 즉시 보고(제10조 제4항)하고 학교안전사고보상지원시스템으로 공제회에 사고발생 통지(시행규칙 별지 제2호서식)를 한다. 생활기록부 기재 사항은 없다.","sources":[{"title":"학교안전사고 예방 및 보상에 관한 법률(법률 제21149호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행령(대통령령 제36672호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률시행령"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행규칙(교육부령 제363호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률시행규칙"},{"title":"학교 응급상황 대응 가이드라인","publisher":"교육부","year":2025,"url":"https://www.gne.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1464&q_bbsDocNo=20250428094553090"},{"title":"경상북도학교안전공제회 보상절차·공제급여 안내","publisher":"경상북도학교안전공제회","year":2026,"url":"https://www.gbe.kr/kbssia/main.do"},{"title":"국가배상법","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/국가배상법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"현장체험학습 지원 방안(보도자료)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=106303&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=020402&opType=N"}],"verified":"2026-09-24","uncertain":["2024.12.20. 개정(2025.6.21. 시행)으로 들어온 제10조 제5항의 최초 문구(형사 면책만이었는지)는 현행 조문과 부칙으로만 추정 — 현행은 민사·형사 모두, 민사는 2025.12.2. 이후 사고부터","교육부 2026.5.28. 발표 ‘고의·중과실 아니면 면책(제10조의5)’ 개정안은 국회 통과·시행 여부 미확인","경북교육청의 안전사고 교육청 보고 기준(즉시 보고 대상, 양식)과 담당 부서는 학교급·연도별 공문 확인 필요","‘공제급여와 관련된 소송’이 민사소송인지 행정소송인지, 심사청구를 거치지 않고 바로 소송할 수 있는지는 법문에 명시 없음","보호자 청구 시 경북공제회가 요구하는 급여 종류별 제출서류 목록(시스템 ‘제출서류’ 탭)은 직접 확인 못 함","학교안전사고 사고통지의 구체 기한(일수)은 법에 ‘지체 없이’로만 되어 있음"],"related":["emergency-medical","field-trip-accident"]},{"id":"teacher-rights","title":"교육활동 침해(교권 침해) 대응","aka":["교권침해","교육활동 침해","학생이 욕했어요","학생이 때렸어요","학부모 폭언","수업 방해","몰래 촬영","교권보호위원회","지역교권보호위원회","특별휴가","1395","분리조치","학부모 협박","명예훼손","성희롱 발언"],"category":"교원 보호","urgency":"당일","roles":["피해교원","목격한 교직원","교장","교감","교육활동 보호 업무 담당자","담임","교육지원청 교육활동보호 담당(지역교권보호위원회)","교육장"],"summary":"학생이나 보호자 등이 교육활동 중인 교원에게 폭행·폭언·모욕·협박·성적 언동·무단 촬영 배포·반복 부당 민원 등을 하면 교원지위법상 교육활동 침해행위다. 학교장은 알게 된 즉시 피해교원 보호조치와 분리조치를 하고, 사안은 교육지원청 지역교권보호위원회가 심의해 교육장이 학생·보호자 조치를 한다. 조치에 불복하면 학생·보호자는 물론 '침해 아님' 결정을 받은 교원도 행정심판·행정소송을 낼 수 있다.","first":["침해행위를 멈추라고 말하고, 안 되면 주변에 도움을 청하거나 그 자리를 벗어난다","다쳤으면 응급처치·병원부터. 폭행 등 긴급하면 112에 신고해도 된다","교감·교장 또는 업무 담당자에게 알린다(구두·전화 가능). 학교 밖에서는 지역번호+1395(경북 054-1395)","가해자와 떨어져 있고 싶은지(분리 의사) 학교에 말한다","증거(녹음·문자·사진·목격자 이름)를 챙기고 경위를 적는다"],"steps":[{"stage":"알게 됨·신고","when":"발생 즉시","who":"피해교원","what":"현장 대응","detail":"침해 중단 요청 → 동료 등 주변에 도움 요청 또는 현장 이탈 → 부상 시 응급처치·병원. 범죄(폭행 등)면 112 신고 가능.","basis":"교육활동 보호 매뉴얼(2026) 37쪽"},{"stage":"알게 됨·신고","when":"발생 즉시","who":"피해교원·목격자","what":"학교(관리자·담당자)나 교육활동보호센터에 신고","detail":"보거나 알게 된 사람은 누구나 즉시 신고해야 한다. 신고는 구두·메일·전화 모두 가능. 학교 밖 창구는 시도 교육활동보호센터, 지역번호+1395, 교육(지원)청 담당자. 1395로 접수되면 교육지원청이 소속 학교에 알리고 학교장이 이후 절차를 진행한다.","basis":"교원지위법 제28조; 매뉴얼 31·55쪽"},{"stage":"초기 대응","when":"알게 된 즉시","who":"학교장","what":"피해교원 보호조치","detail":"심리상담·조언, 치료·요양, 그 밖에 치유·교권 회복 조치. 조퇴·병가·특별휴가, 심리·법률상담, 공무상 병가 신청을 안내한다. 특별휴가는 위원회 개최 전이라도 학교장 판단으로 허가할 수 있고 진단서 등 증빙은 나중에 갖춰도 된다.","basis":"교원지위법 제20조제1항·제23조; 매뉴얼 37~38쪽"},{"stage":"초기 대응","when":"알게 된 즉시","who":"학교장","what":"가해자와 피해교원 분리","detail":"먼저 피해교원 의사를 확인(즉시 분리 의사 확인서, 서식3). 교원이 반대하거나 이미 특별휴가 등으로 떨어져 있으면 안 해도 된다. 심각성·지속성·고의성을 보고 기간을 정하되 휴일 포함 최대 7일을 넘지 않게 권장. 학교 안에 별도 공간을 마련하고, 분리된 학생에게는 별도 교육방법을 운영한다. 필요하면 피해교원 업무대행자를 정한다.","basis":"교원지위법 제20조제2항; 시행령 제17조; 매뉴얼 38·40쪽"},{"stage":"초기 대응","when":"즉시(폭행·성폭력 사안)","who":"학교장","what":"필요하면 긴급조치","detail":"학생이 상해·폭행죄나 성폭력범죄에 해당하는 침해를 했고 피해교원 보호가 급하면 학교장이 먼저 1호(학교 봉사), 3호(특별교육·심리치료), 4호(출석정지), 5호(학급교체)를 따로 또는 함께 부과할 수 있다. 4·5호 전에는 학생·보호자에게 의견 진술 기회를 준다. 4호 기간은 위원회 조치 결정 때까지로 정할 수 있다. 학생·보호자에게 통지하고, 거부·회피하면 초·중등교육법 제18조에 따라 징계할 수 있다.","basis":"교원지위법 제25조제9항~제12항(2026.2.19. 신설); 매뉴얼 39쪽"},{"stage":"초기 대응","when":"긴급조치 직후","who":"학교장","what":"지역교권보호위원회에 즉시 보고·추인 요청","detail":"긴급조치 보고서(서식2)를 낸다. 위원회는 추인, 일부추인, 추인하지 않음을 결정할 수 있다. 추인하지 않아도 이미 한 조치가 소급해 무효가 되지는 않는다. 추인받지 못한 출석정지 기간이나 위원회 전에 사안이 끝난 경우의 출석정지 기간은 출석으로 인정할 수 있다.","basis":"교원지위법 제25조제9항 후단; 매뉴얼 39~40쪽"},{"stage":"초기 대응","when":"당일","who":"학교(담임·담당자)","what":"관련 학생 보호자에게 연락","detail":"사안 개요·경위·정도를 객관적으로 짧게 알리고 절차·일정·제출 서류를 안내한다. 피해교원 전화번호 등 개인정보는 알려주지 않는다. 언론 대응 창구는 하나로 모은다.","basis":"매뉴얼 38쪽"},{"stage":"초기 대응","when":"사안 접수부터 24시간 이내","who":"학교장","what":"교육지원청에 사안 신고 보고","detail":"유선·구두 보고 또는 사안신고서(서식1) 제출. 사안신고서는 피해교원이 위원회 개최를 원하면 반드시 내며, 24시간 안에 어려우면 사안 발생보고서와 함께 낼 수 있다.","basis":"교원지위법 제20조제3항; 매뉴얼 32·38쪽"},{"stage":"조사·확인","when":"보고 후 5일 이내","who":"학교 업무담당자","what":"사안 파악","detail":"피해교원 면담(필요한 보호조치, 위원회 개최·분쟁조정 희망 여부), 관련 학생·보호자 면담과 의견서(서식4), 목격자 진술(서식5)·현장사진 등 증거 수집. 학생 면담은 학습권을 지키는 범위에서 하고 필요하면 녹음한다. 의견서를 내지 않으면 '의견 없음'으로 보고 심의가 진행될 수 있음을 미리 알린다.","basis":"매뉴얼 41~43쪽"},{"stage":"조사·확인","when":"사안 보고 후 5일 이내(주말·공휴일 제외)","who":"학교장","what":"사안 발생보고서 제출","detail":"사안 발생보고서(서식7)에 의견서(서식4)·참고인 진술서(서식5)를 붙여 공문으로 교육지원청에 낸다. 분쟁조정을 원하면 분쟁조정 신청서(서식6)도 함께.","basis":"매뉴얼 41쪽"},{"stage":"조사·확인","when":"보고서 접수 후","who":"교육지원청","what":"사안 조사와 조사보고서 작성","detail":"보고서 검토, 필요하면 추가 면담·현장 방문 조사, 쟁점 확인, 증거 추가 수집 후 사안 조사보고서(서식14) 작성. 장애학생은 특수교육 전문가를 참여시키고, 다문화 학생·보호자는 통역·번역 조사지를 쓸 수 있다. 중대 사안(4주 이상 진단 폭행, 성폭력 등)은 중대사안보고서(서식13)로 시도교육청→교육부까지 보고.","basis":"교원지위법 시행령 제18조; 매뉴얼 44~45쪽"},{"stage":"심의·결정","when":"희망 시(위원회 전)","who":"당사자·지역교권보호위원회","what":"분쟁조정(선택)","detail":"양쪽 모두 원할 때만 진행. 성립하면 합의서 3부 작성(민사상 화해계약 효력). 한쪽이 거부·고소·소송하면 개시 거부·중지, 개시 후 30일이 지나도 합의가 안 되면 종료하고 조치 심의로 넘어간다. 재조정을 원하면 시·도교권보호위원회에 2차 분쟁조정을 신청할 수 있다.","basis":"교원지위법 제18조제1항제2호·제2항제4호; 매뉴얼 62~65쪽"},{"stage":"심의·결정","when":"사안 발생보고서 접수 후 21일 이내(주말·공휴일 포함)","who":"교육장·위원장","what":"위원회 소집과 출석통지","detail":"교육장 요청, 재적위원 4분의 1 이상 요청, 피해교원 요청 등으로 위원장이 소집. 회의 10일 전까지 당사자에게 서면 출석통지(사안 요지 구체적으로). 출석이 어려우면 서면 의견서(서식15-1)를 낼 수 있다. 21일은 훈시규정이라 정당한 사유가 있으면 넘겨도 위법은 아니다.","basis":"시행령 제15조제4항; 매뉴얼 46쪽"},{"stage":"심의·결정","when":"위원회 당일","who":"지역교권보호위원회","what":"심의(진술 청취)","detail":"재적 과반 출석으로 열고 출석 과반 찬성으로 의결. 제척·기피·회피 확인 → 사안조사 보고 → 피해교원 진술·질의응답 → 관련 학생·보호자 진술(조치결정·불복절차 고지) → 필요시 전문가 의견. 학생·교사 모두 변호사를 대리인으로 선임해 출석시킬 수 있다. 회의는 비공개.","basis":"교원지위법 제30조제3항; 시행령 제15조제5항·제16조; 매뉴얼 47~49쪽"},{"stage":"심의·결정","when":"위원회 당일","who":"지역교권보호위원회","what":"침해 여부 판단과 조치 의결","detail":"통상인이 의심하지 않을 정도의 고도의 개연성이 있어야 침해 사실을 인정하고, 증거가 부족하면 '교육활동 침해 사안 아님'으로 끝낸다. 학생은 심각성·지속성·고의성(각 0~5점), 반성·선도가능성, 관계회복(각 0~3점)을 항목마다 출석 과반으로 정해 합산 점수로 조치를 고른다. 봉사 시간, 출석정지 일수, 특별교육 시간도 함께 정한다. 필요하면 피해교원 추가 보호조치를 권고한다.","basis":"교원지위법 제25조제2항·제26조제2항; 고시 별표; 매뉴얼 50~54쪽"},{"stage":"심의·결정","when":"요청받은 날부터 14일 이내","who":"교육장","what":"조치 처분과 통지","detail":"교육장이 조치하고 침해학생·보호자에게 조치결정 통지서(서식18-1~18-3)를 보낸다. 학교장에게도 알린다. 전학이면 초·중학교는 교육장, 고등학교는 교육감에게 전학 학교 배정을 요청하고, 피해교원과 충분한 거리를 고려해 배정한다.","basis":"교원지위법 제25조제7항·제8항·제26조제4항; 시행령 제22조제3항·제4항"},{"stage":"조치·이행","when":"조치 후","who":"학교장·교육장","what":"조치 이행과 부가조치","detail":"출석정지·학급교체·전학(4~6호)은 교육감이 정한 기관에서 특별교육·심리치료를 반드시 함께 받는다(전학은 먼저 시행). 1·2호에도 붙일 수 있다. 보호자도 함께 특별교육을 받아야 한다. 출석정지 중에는 원래 교실에 남아 수업을 들을 수 없다. 위원회 접수부터 이행 완료까지 원칙적으로 학적 변동을 제한한다.","basis":"교원지위법 제25조제3항~제5항; 매뉴얼 52~53쪽"},{"stage":"조치·이행","when":"조치 통보 후 90일","who":"학교장·교육장","what":"미이행 관리","detail":"90일 안에 끝내지 않으면 학교장이 미이행 명단을 교육장에게 공문 보고(서식12-1·12-2). 교육장은 21일 안에 30일 이내 이행을 서면 안내한다. 학생이 거부·회피하면 위원회는 4~7호 조치를 가중해 요청할 수 있다. 특별교육·심리치료를 정당한 사유 없이 받지 않은 보호자 등에게는 교육감이 300만원 이하 과태료를 부과한다.","basis":"교원지위법 제25조제8항·제35조; 매뉴얼 57~59쪽"},{"stage":"조치·이행","when":"필요 시","who":"피해교원·학교장","what":"보호조치 비용과 추가 회복 지원","detail":"치료·상담 비용은 침해 학생 보호자 등이 부담이 원칙이고, 빨리 치료받아야 하면 교육청이 먼저 내고 구상한다(신청서와 증빙을 교육감에게). 특별휴가 뒤 더 쉬어야 하면 학교장이 공무상 병가(6일 이내) 승인 가능. 원하면 시도 기준에 따라 전보 요청.","basis":"교원지위법 제20조제5항; 시행령 제19조; 매뉴얼 71~73쪽"},{"stage":"불복·구제","when":"처분을 안 날부터 90일, 있었던 날부터 180일 이내","who":"침해학생·보호자 / '침해 아님' 결정을 받은 교원","what":"행정심판 청구","detail":"교육장 조치(학생 조치·보호자 조치)에 대해 학생·보호자가, 위원회의 '교육활동 침해사안 아님' 결정에 대해 교원이 청구할 수 있다. 청구처는 해당 교육청 행정심판위원회. 국공립·사립 구분 없이 가능. 청구해도 조치는 멈추지 않으며, 멈추려면 행정심판위원회의 집행정지 결정이 필요하다.","basis":"교원지위법 제25조제14항; 행정심판법 제6조제3항·제27조·제30조; 매뉴얼 59~60쪽"},{"stage":"불복·구제","when":"처분을 안 날부터 90일, 있은 날부터 1년 이내","who":"침해학생·보호자(미성년자는 법정대리인) / 교원","what":"행정소송(취소소송)","detail":"행정심판을 거치지 않고 바로 낼 수 있다. 피고는 교육장. 행정심판을 거쳤으면 재결서 정본을 받은 날부터 90일. 소송을 내도 조치는 멈추지 않으며 법원의 집행정지 결정이 있어야 멈춘다.","basis":"행정소송법 제18조제1항·제20조·제23조; 매뉴얼 60~61쪽"},{"stage":"불복·구제","when":"범죄 행위일 때(선택)","who":"피해교원·교육감","what":"형사 고소·고발과 민사소송","detail":"피해교원이 직접 고소할 수 있다(모욕죄 등 친고죄는 본인 고소 필요). 교육감은 형사처벌 규정에 해당하면 고발할 수 있고, 시·도교권보호위원회가 중대 사안에 대해 14일 이내 고발을 권고할 수 있다. 14세 미만 학생은 고발 대상에서 빠지고, 만 10세 이상이면 학교장 통고제(소년부 통고)를 쓸 수 있다. 손해배상을 청구하는 민사소송도 가능. 경찰 불송치 결정에 대한 이의신청은 고발인은 못 하고 고소인만 할 수 있다.","basis":"교원지위법 제20조제4항; 소년법 제4조제3항; 형사소송법 제245조의7; 매뉴얼 77~79쪽"},{"stage":"종결·사후","when":"조치 이후","who":"학교·교육지원청","what":"후속조치와 종결","detail":"이행 독려, 피해교원 심리치료 지원, 재발방지·추수지도, 정상적 교육활동 복귀 지원, 이의제기 시 불복절차 안내. 교육지원청은 결과보고서(서식19)로 시도교육청에 보고. 같은 사안으로 재심 성격의 위원회는 다시 열지 않는다.","basis":"매뉴얼 28·59쪽"},{"stage":"종결·사후","when":"피해교원이 위원회를 원하지 않을 때","who":"학교장","what":"위원회 없이 종결","detail":"학교장 자체해결 권한은 법에 없지만, 오인 신고이거나 피해교원이 위원회 개최를 원하지 않으면 종결할 수 있다. 관련자에게 신고 사실이 통보된 뒤라면 양측이 사안종결확인서(서식8)를 쓰고, 이후 같은 사안으로 위원회를 요청할 수 없다. 이 경우에도 교육지원청에 접수·서류 제출은 해야 하며, 학교장 판단으로 특별휴가를 예외적으로 허가할 수 있다.","basis":"매뉴얼 42·55·72쪽"}],"deadlines":[{"what":"피해교원 보호조치·분리조치","limit":"알게 된 즉시","basis":"교원지위법 제20조제1항·제2항"},{"what":"교육지원청 사안 신고 보고","limit":"사안 접수부터 24시간 이내","basis":"교육활동 보호 매뉴얼(2026) 32·38쪽"},{"what":"사안 발생보고서 제출","limit":"사안 보고 후 5일 이내(주말·공휴일 미포함)","basis":"매뉴얼 32·41쪽"},{"what":"지역교권보호위원회 개최","limit":"사안 발생보고서 접수 후 21일 이내(주말·공휴일 포함, 훈시규정)","basis":"매뉴얼 32·46쪽"},{"what":"당사자 출석통지","limit":"회의 10일 전까지","basis":"매뉴얼 46쪽(행정절차법 제21조제3항)"},{"what":"교육장의 조치","limit":"위원회 요청을 받은 날부터 14일 이내","basis":"교원지위법 제25조제7항·제26조제4항"},{"what":"분쟁조정 종료","limit":"개시 후 30일이 지나도 합의 안 되면 종료 가능","basis":"매뉴얼 63~65쪽"},{"what":"분리조치 기간(권장)","limit":"휴일 포함 최대 7일 이내","basis":"매뉴얼 40쪽"},{"what":"특별휴가","limit":"5일 범위(상해·폭행·성폭력은 5일 범위 추가). 사안 인지 즉시·연속 사용 원칙","basis":"교원휴가에 관한 예규 제8조; 매뉴얼 71쪽"},{"what":"조치 이행·미이행 보고","limit":"통보 후 90일 내 미완료 시 학교장 보고 → 교육장 21일 내 '30일 이내 이행' 안내","basis":"매뉴얼 57쪽"},{"what":"행정심판","limit":"처분이 있음을 안 날부터 90일, 있었던 날부터 180일","basis":"행정심판법 제27조"},{"what":"행정소송(취소소송)","limit":"안 날부터 90일, 있은 날부터 1년(행정심판을 거치면 재결서 정본 송달일부터 90일)","basis":"행정소송법 제20조"}],"dont":["피해교원에게 '좋게 넘어가자'며 화해를 재촉하거나 사안을 줄여 보고하지 않는다 — 축소·은폐는 법으로 금지되고 징계 대상","피해교원 휴대전화 번호 등 개인정보나 상대방이 쓴 신고서·진술서를 다른 쪽에 넘기지 않는다","위원회 결정 전에 '가해 학생', '침해 학생'이라고 부르지 않는다 — '침해 관련 학생'으로","특별휴가를 한 달 뒤에 쓰거나 시간 단위로 쪼개 쓰지 않는다 — 인지 즉시·연속 사용이 원칙","법에 없는 조치(학생에게 서면사과 강제, '권고전학' 등)를 학교가 임의로 강요하지 않는다","피해교원 쪽이 준비되지 않았는데 학생·보호자의 사과를 일방적으로 받게 하지 않는다 — 피해교원을 더 힘들게 할 수 있다"],"contacts":[{"name":"교육활동보호 대표번호","tel":"지역번호+1395 (경북 054-1395)","note":"업무시간 유·무선 모두. 시도 교육활동보호 창구로 바로 연결"},{"name":"경북교육청 교육활동보호센터","tel":"054-450-4363~4","note":"경상북도교육청연수원 본관 1층(구미), 2026.1. 기준"},{"name":"경찰","tel":"112","note":"폭행 등 긴급상황"},{"name":"한국교육개발원 교육활동보호센터 누리집","tel":"","note":"forteacher.kedi.re.kr"}],"forms":["교육활동 침해 사안신고서 — 매뉴얼 서식1","긴급조치 보고서 — 서식2","즉시 분리 의사 확인서 — 서식3","의견서 — 서식4 / 참고인 진술서 — 서식5 / 분쟁조정 신청서 — 서식6","사안 발생보고서 — 서식7 / 사안종결확인서 — 서식8","조치 미이행 보고서 — 서식12-1·12-2","중대사안보고서 — 서식13 / 사안 조사 보고서 — 서식14","출석통지서 — 서식15, 서면의견서 — 서식15-1, 조치의결서 — 서식17, 조치결정 통지서 — 서식18-1~18-3, 결과보고서 — 서식19","합의서 — 서식20 / 분쟁조정 협의록 — 서식21"],"law":[{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제19조(교육활동 침해행위)","point":"학생·보호자 등이 교육활동 중인 교원에게 하는 공무방해·무고·상해·폭행·협박·명예훼손·모욕·업무방해·손괴, 성폭력범죄, 불법정보 유통, 그 밖의 형사처벌 대상 행위, 목적이 정당하지 않은 반복 민원, 법적 의무 아닌 일의 지속 강요 등"},{"name":"교육활동 침해 행위 및 조치 기준에 관한 고시","article":"제2조·별표","point":"성적 언동, 정당한 교육활동에 대한 반복적 부당 간섭, 정당한 생활지도 불응으로 인한 의도적 방해, 교원 영상·음성 무단 촬영·녹음·합성·배포 등도 침해행위. 별표는 학생 조치 점수 기준"},{"name":"교원지위법","article":"제20조(피해교원 보호조치·분리조치)","point":"알게 된 즉시 보호조치와 분리조치. 학교장은 지체 없이 관할청에 보고. 형사처벌 규정 해당 시 관할청 고발 가능. 비용은 침해 학생 보호자 등 부담 원칙"},{"name":"교원지위법","article":"제23조(특별휴가)","point":"피해교원은 교육부장관이 정하는 바에 따라 특별휴가를 쓸 수 있다"},{"name":"교원지위법","article":"제18조(교권보호위원회)","point":"시·도교권보호위원회(시행계획, 지역위 미조정 분쟁 조정 등), 교육지원청 지역교권보호위원회(침해학생·보호자 조치, 분쟁조정 등)"},{"name":"교원지위법","article":"제25조(침해학생 조치)","point":"7가지 조치, 의견 진술 기회, 요청 후 14일 내 교육장 조치, 거부 시 가중, 학교장 긴급조치(제9항~제13항, 2026.2.19. 신설), 이의는 행정심판"},{"name":"교원지위법","article":"제26조(보호자 등 조치)·제35조(과태료)","point":"서면사과·재발방지 서약, 특별교육·심리치료. 특별교육·심리치료 불이행 보호자 등은 300만원 이하 과태료"},{"name":"교원지위법","article":"제27조·제28조·제30조","point":"학교장의 축소·은폐 금지(시도 시 징계의결 요구), 신고의무와 신고자 불이익 금지, 위원회 비공개와 회의록 공개 신청"},{"name":"교원지위법 시행령","article":"제15조(지역교권보호위원회 구성·운영)","point":"10명 이상 50명 이하, 교원 위원은 정수의 2분의 1 초과 불가, 학부모·변호사·경찰·전문가 등. 임기 2년 1회 연임. 교육장·재적 4분의 1·피해교원 요청 시 소집. 재적 과반 출석, 출석 과반 찬성"}],"deep":[{"title":"처음 30분: 피해교원과 학교가 할 일","body":["피해교원은 침해를 멈추라고 말하고, 안 되면 도움을 청하거나 자리를 떠난다. 다쳤으면 치료가 먼저다. 신고는 말로 해도 된다.","학교장은 알게 된 즉시 두 가지를 해야 한다. 하나는 보호조치(상담·치료·특별휴가 안내), 다른 하나는 분리조치다. 분리는 피해교원이 원하지 않으면 하지 않는다. 폭행·성폭력처럼 급한 사안이면 학교장이 먼저 출석정지·학급교체 같은 긴급조치를 할 수 있고, 곧바로 지역교권보호위원회에 보고해 추인을 받는다."],"basis":"교원지위법 제20조·제25조제9항; 매뉴얼 37~40쪽"},{"title":"사안 조사는 이렇게 진행된다","body":["학교가 먼저 사안을 파악한다. 피해교원 면담(원하는 보호조치, 위원회·분쟁조정 희망 여부), 관련 학생·보호자 면담과 의견서, 목격자 진술서, 사진 등을 모아 보고 후 5일 안에 사안 발생보고서로 교육지원청에 낸다.","담당자는 침해 여부를 스스로 단정하거나, 진술을 강요하거나, 한쪽에만 관용·책임을 묻는 말을 하면 안 된다. 상대방이 쓴 신고서나 진술서를 다른 쪽에 넘기지 않는다.","교육지원청은 보고서를 검토하고 필요하면 추가 면담·현장 조사를 한 뒤 사안 조사보고서를 쓴다. 장애학생은 특수교육 전문가, 다문화 학생·보호자는 통역·번역 조사지로 진술을 돕는다."],"basis":"매뉴얼 41~45쪽"},{"title":"지역교권보호위원회 — 구성·출석·의견 진술","body":["교육지원청에 있고 10~50명으로 구성한다. 교원 위원은 정원의 절반을 넘을 수 없고 학부모, 변호사, 경찰, 교수 등 전문가가 함께 들어간다. 재적 과반이 출석해야 열리고 출석 과반 찬성으로 의결한다.","사안 발생보고서 접수 후 21일 안에 열도록 하고, 회의 10일 전까지 서면으로 출석을 통지한다. 못 오면 서면 의견서로 대신할 수 있다. 피해교원과 학생·보호자 모두 진술 기회를 받고, 변호사를 대리인으로 세울 수 있다. 교원 출석은 출장 처리, 학생 출석은 출석 인정이다.","회의는 비공개다. 다만 피해교원·침해학생·보호자가 회의록 열람·복사를 신청하면 개인정보(학생·가족 이름, 주민번호, 주소, 위원 이름 등)를 빼고 공개해야 한다. 위원이 당사자와 친족 관계 등이면 제척되고, 당사자는 기피 신청을 할 수 있다."],"basis":"교원지위법 제18조제2항·제30조; 시행령 제15조·제16조; 매뉴얼 46~49쪽"},{"title":"조치는 점수로 정한다","body":["침해행위의 심각성·지속성·고의성을 각각 0~5점, 학생의 반성 정도·선도가능성과 교원과의 관계회복 정도를 각각 0~3점으로 매긴다(반성·관계회복은 높을수록 점수가 낮다). 항목마다 출석위원 과반으로 정하고, 평균을 내면 안 된다.","학생이 장애가 있으면 1단계 감경, 피해교원이 임신 중이거나 장애가 있으면 1단계 가중을 출석 과반으로 정할 수 있다. 총점 4점 이하이거나 사안이 가벼우면 '조치 없음'도 가능하다.","전학·퇴학은 처음 일어난 침해로는 결정할 수 없고, 같은 학교에서 출석정지·학급교체를 받았던 학생이 다시 침해한 경우에만 가능하다. 다만 상해·폭행, 성폭력, 불법정보 유통(정보통신망법 제44조의7제1항제3호)은 처음이라도 가능하다."],"basis":"교육활동 침해 행위 및 조치 기준에 관한 고시 별표; 매뉴얼 51~54쪽"},{"title":"피해교원이 받을 수 있는 지원","body":["특별휴가 5일 범위(상해·폭행·성폭력은 5일 범위 추가). 쓰고도 더 쉬어야 하면 공무상 병가 6일 이내를 학교장이 승인할 수 있다. 위원회에서 침해가 아니라고 나오면 특별휴가는 병가·연가로 바뀐다.","치료·상담 비용은 침해 학생 보호자 부담이 원칙이지만 교육청이 먼저 내고 청구할 수 있다. 교육활동보호센터의 심리상담, 법률지원단 변호사 상담, 교원보호공제(표준약관: 상해치료·심리상담 300만원 한도, 긴급 경호, 민·형사 소송비용, 분쟁조정)를 이용한다. 원하면 전보도 요청할 수 있다."],"basis":"교원지위법 제20조제5항·제21조·제22조·제23조; 매뉴얼 71~85쪽"},{"title":"결정에 불복하려면","body":["교육장의 조치가 부당하다고 보는 학생·보호자, 위원회가 '침해 아님'이라고 결정해 억울한 교원 모두 행정심판이나 행정소송을 낼 수 있다. 사립학교여도 교육장 처분이라 같은 절차다.","행정심판은 처분을 안 날부터 90일, 있었던 날부터 180일 안에 해당 교육청 행정심판위원회에 낸다. '안 날'은 교육장 명의 통지서를 실제로 받은 때부터 센다. 행정소송은 행정심판 없이 바로 낼 수 있고, 안 날부터 90일·있은 날부터 1년 안에 교육장을 피고로 한다.","어느 쪽이든 청구만으로 조치가 멈추지 않는다. 멈추려면 행정심판위원회나 법원의 집행정지 결정을 따로 받아야 한다."],"basis":"교원지위법 제25조제14항; 행정심판법 제27조·제30조; 행정소송법 제18조·제20조·제23조; 매뉴얼 59~61쪽"}],"tables":[{"title":"침해학생 조치와 점수 기준","head":["호","조치","총점","출결 처리","비고"],"rows":[["-","조치 없음","0~4","-","학교 봉사에서 감경되면 조치 없음"],["1호","학교에서의 봉사","5~7","출석 인정 가능","학교장 긴급조치 가능"],["2호","사회봉사","8~10","출석 인정 가능",""],["3호","학내외 전문가 특별교육 또는 심리치료","점수 구간 없음(단독 또는 부가)","출석 인정 가능","학교장 긴급조치 가능"],["4호","출석정지","11~13","미인정 결석(출결특기사항 공란)","특별교육·심리치료 부가 의무, 긴급조치 가능"],["5호","학급교체","14~16","-","특별교육·심리치료 부가 의무, 긴급조치 가능(학적변동은 추인 후)"],["6호","전학","17~21","-","특별교육·심리치료보다 먼저 시행"],["7호","퇴학","17~21","-","의무교육 과정(초·중) 적용 불가"]],"note":"교육활동 침해 행위 및 조치 기준에 관한 고시 별표, 교육활동 보호 매뉴얼(2026) 51·56쪽. 6·7호는 원칙적으로 이전에 4·5호를 받은 학생의 재침해에만 가능(상해·폭행·성폭력·불법정보 유통은 예외)."},{"title":"보호자 등에 대한 조치","head":["호","조치","총점","불이행 시"],"rows":[["-","조치 없음","0~4","-"],["1호","서면사과 및 재발방지 서약","5~11","-"],["2호","교육감이 정하는 기관에서 특별교육 이수 또는 심리치료","12~21","정당한 사유 없이 안 받으면 300만원 이하 과태료"]],"note":"교원지위법 제26조·제35조; 매뉴얼 54·59쪽. 과태료 불복은 부과 통지를 받은 날부터 60일 이내 교육청에 서면 이의제기(질서위반행위규제법 제20조)."},{"title":"불복 절차 한눈에","head":["절차","누가","어디에","기간","조치가 멈추나"],"rows":[["행정심판","침해학생·보호자(조치), 교원('침해 아님' 결정)","해당 교육청 행정심판위원회","안 날부터 90일, 있었던 날부터 180일","안 멈춤 — 집행정지 결정 필요"],["행정소송(취소소송)","학생·보호자(미성년자는 법정대리인), 교원","법원(피고: 교육장)","안 날부터 90일, 있은 날부터 1년. 행정심판 거치면 재결서 송달일부터 90일","안 멈춤 — 법원 집행정지 결정 필요"],["2차 분쟁조정","분쟁 당사자","시·도교권보호위원회","지역위 분쟁조정 불성립 후","-"]],"note":"행정심판법 제27조·제30조, 행정소송법 제18조·제20조·제23조, 교육활동 보호 매뉴얼(2026) 59~65쪽."},{"title":"누가 언제 무엇을 내나(서식 흐름)","head":["시점","누가","무엇을","어디로"],"rows":[["발생 직후","피해교원","사안신고서(서식1), 즉시 분리 의사 확인서(서식3)","학교"],["24시간 이내","학교장","사안 신고 보고(유선·구두 또는 서식1)","교육지원청"],["긴급조치 시","학교장","긴급조치 보고서(서식2)","지역교권보호위원회"],["5일 이내","학교장","사안 발생보고서(서식7)+의견서(서식4)+참고인 진술서(서식5)","교육지원청"],["위원회 전","교육지원청","사안 조사보고서(서식14), 출석통지서(서식15)","위원회·당사자"],["결정 후 14일 이내","교육장","조치결정 통지서(서식18-1~18-3)","학생·보호자·학교장"],["90일 미이행 시","학교장","조치 미이행 보고서(서식12-1·12-2)","교육장"]],"note":"교육활동 보호 매뉴얼(2026) 32쪽 흐름도 기준."}],"faq":[{"q":"신고는 꼭 서면으로 해야 하나요?","a":"아니다. 구두로도 된다. 다만 지역교권보호위원회 개최를 원하면 피해교원이 사안신고서(서식1)를 작성해 내야 한다."},{"q":"위원회 열리기 전에 특별휴가를 쓸 수 있나요?","a":"쓸 수 있다. 학교장 판단으로 허가하고 진단서 등 증빙은 나중에 갖춘다. 다만 위원회·행정심판에서 침해가 아니라고 나오면 병가·연가로 정정된다."},{"q":"위원회를 안 열고 조용히 끝낼 수는 없나요?","a":"학교장 자체해결 권한은 법에 없다. 다만 오인 신고이거나 피해교원이 위원회 개최를 원하지 않으면 종결 처리할 수 있고, 양측에 통지된 경우 사안종결확인서(서식8)로 양측 의사를 확인한다. 그 뒤에는 같은 사안으로 위원회를 요청할 수 없다."},{"q":"위원회에 변호사나 가족이 같이 갈 수 있나요?","a":"변호사는 대리인으로 출석해 의견을 말할 수 있고 교육장은 특별한 사정이 없으면 거부하면 안 된다. 피해교원의 배우자 등 가족은 법적 근거가 없어 원칙적으로 동석할 수 없다."},{"q":"'침해 아님'으로 나왔어요. 교사도 다툴 수 있나요?","a":"있다. 교원은 '교육활동 침해사안 아님' 결정에 행정심판(안 날부터 90일)이나 행정소송(안 날부터 90일, 교육장 피고)을 낼 수 있다."},{"q":"침해 학생 조치가 생활기록부에 남나요?","a":"매뉴얼은 출석정지 조치를 미인정 결석으로 처리하고 출결특기사항은 공란으로 둔다고만 안내한다. 봉사·특별교육 등과 분리조치 기간, 위원회 참석은 출석 인정이다. 조치 내용 자체를 학생부에 적는 규정은 확인되지 않았다."},{"q":"학부모가 교사를 몰래 녹음해 단체방에 퍼뜨렸어요.","a":"교육활동 중인 교원의 음성 등을 녹음해 무단 배포하는 행위는 고시 제2조제5호의 교육활동 침해행위다. 명예훼손 등 범죄에 해당하면 고소·고발도 가능하다."},{"q":"치료비는 누가 내나요?","a":"침해 학생의 보호자 등이 내는 것이 원칙이다. 빨리 치료받아야 하면 피해교원이나 학교장이 원할 때 교육청이 먼저 내고 보호자에게 청구(구상)한다."}],"record":"교육활동 침해 학생 출석정지는 미인정 결석으로 처리하고 출결특기사항은 비워 둔다. 학교 봉사·사회봉사·특별교육(1~3호), 부가 특별교육·심리치료, 분리조치, 위원회 참석은 출석 인정. 학교장 긴급조치 출석정지를 위원회가 추인하지 않거나 위원회 전 사안이 끝나면 그 기간을 출석으로 인정할 수 있다. 학급교체 학적변동은 위원회 추인 뒤 반영하며 해당 학년도까지 유효. 위원회 접수부터 이행 완료까지 원칙적으로 학적 변동 제한.","sources":[{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (수탁연구자료 CRM 2026-09, 발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19., 법률 제21350호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 시행령 (시행 2025.9.19.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법시행령"},{"title":"교육활동 침해 행위 및 조치 기준에 관한 고시 (교육부고시 제2024-20호, 시행 2024.8.30.)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육활동침해행위및조치기준에관한고시"},{"title":"행정심판법·행정소송법·질서위반행위규제법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"}],"verified":"2026-09-24","uncertain":["경북 1395 번호(054-1395)는 매뉴얼의 '지역번호+1395' 원칙을 적용한 것으로, 경북 번호가 매뉴얼에 직접 적혀 있지는 않다","교육활동 침해 조치 사항이 학교생활기록부에 기재되는지에 대한 명시 규정은 법령·매뉴얼에서 찾지 못했다. 2026 학교생활기록부 기재요령 원문으로 다시 확인할 필요가 있다","24시간·5일·21일·7일·90일은 법률이 아니라 교육부·KEDI 매뉴얼의 처리 기준이다. 경북교육청 자체 지침과 다를 수 있다","교원휴가에 관한 예규 원문은 직접 열지 않았고 매뉴얼에 실린 제8조 인용(교육부 예규 제104호, 2026.2.27.)으로 확인했다","조치 점수표는 매뉴얼에 실린 고시 별표를 옮긴 것이다. 3호는 점수 구간이 따로 없고 단독 또는 1·2호 부가로 쓰인다고 읽었는데, 표가 PDF에서 깨져 있어 원문 표 모양은 다시 확인하면 좋다","경북교육청 교원보호공제 약관의 실제 보장 한도는 확인하지 못했다(표준약관 수치만 적음)"],"related":["malicious-complaint","teacher-abuse-accusation","student-photo-sns"]},{"id":"teacher-abuse-accusation","title":"교사가 아동학대로 신고당했을 때","aka":["아동학대 신고당함","정서학대 신고","교사 아동학대","학부모가 고소","경찰 조사 받아요","생활지도했는데 신고","교육감 의견서","직위해제","무고","교원 법률지원","교원보호공제","소송비용 지원","아동학대 피신고","소청심사"],"category":"교원 보호","urgency":"당일","roles":["신고된 교사","교장","교감","교육지원청 교육활동보호 담당","시도교육청(교육감 의견 제출)","시도교육청 교육활동보호센터·법률지원단"],"summary":"교원의 정당한 교육활동과 학생생활지도는 법에서 아동학대로 보지 않는다. 신고되면 교육감이 7일 안에 수사기관·지자체에 '정당한 생활지도였는지' 의견서를 내고, 경찰·검사·지자체는 이를 참고해야 한다. 정당한 사유 없는 직위해제는 금지되고, 징계 등 불리한 처분은 30일 안에 소청심사로 다툴 수 있다. 교사는 혼자 대응하지 말고 기록을 정리해 학교와 교육지원청 절차에 올린다.","first":["그날 있었던 일을 시간 순서대로 바로 적는다(무엇을, 왜, 어떤 말로, 누가 봤는지)","교장·교감에게 알리고, 교육지원청 교육활동보호 담당 또는 지역번호+1395(경북 054-1395)로 연락해 교육감 의견 제출 절차를 요청한다","학부모나 해당 학생에게 직접 연락해 해명·사과·합의를 시도하지 않는다","교육청 법률지원단(변호사) 상담과 교원보호공제 소송비용 지원을 안내받는다"],"steps":[{"stage":"알게 됨·신고","when":"신고 사실을 안 때","who":"신고된 교사","what":"신고 경로 파악","detail":"보통 경찰(112) 또는 시군구 아동학대전담공무원에 신고되고, 조사·수사기관이 교육지원청에 교원 대상 신고 사안을 공유한다. 학교가 먼저 알게 되는 경우도, 경찰 출석 요구로 처음 아는 경우도 있다.","basis":"교육활동 보호 매뉴얼(2026) 82쪽"},{"stage":"초기 대응","when":"안 즉시","who":"신고된 교사","what":"사실관계 기록 정리","detail":"지도 당시 상황, 학생 행동, 교사가 한 말·행동과 그 근거(학칙·학급 규칙·생활지도 고시 조항), 목격 학생·교직원, 이전 상담·지도 기록, 보호자와 주고받은 문자·알림장 등을 모은다.","basis":"매뉴얼 78·83쪽"},{"stage":"초기 대응","when":"당일","who":"신고된 교사 → 학교장","what":"학교장 보고와 학교 조치","detail":"학교장은 교육(지원)청 아동학대·교원업무 담당과 협의해 교사 면담, 동선 구분, 수업 교체, 담임 교체 등을 할 수 있다. 피해 주장 아동 보호, 사안의 경중, 2차 피해 예방, 아동·보호자 의사, 다른 학생 학습권, 정당한 교육활동 여부를 종합해 판단한다.","basis":"교육부 아동학대 가이드북 4판 65쪽"},{"stage":"초기 대응","when":"당일~이튿날","who":"신고된 교사·학교","what":"교육지원청·교육활동보호센터 연락","detail":"지역번호+1395(경북 054-1395)나 경북 교육활동보호센터(054-450-4363~4)로 연락하면 교육감 의견 제출 제도 담당자, 법률상담, 심리상담으로 연결해 준다.","basis":"매뉴얼 73~76쪽"},{"stage":"초기 대응","when":"초기","who":"신고된 교사","what":"법률 상담","detail":"교육청 법률지원단(변호사 등)에서 법률 상담을 받는다. 정당한 교육활동과 관련된 분쟁이면 기관 차원의 법률 자문·법무 지원을 받을 수 있다.","basis":"교원지위법 제21조; 매뉴얼 83쪽"},{"stage":"조사·확인","when":"신고 내용을 모를 때","who":"신고된 교사","what":"신고 내용 확인","detail":"수사기관에 정보공개청구(open.go.kr)로 신고 사안을 확인할 수 있고, 관련 자료를 교육지원청에 내 교육활동 확인서 작성에 협조할 수 있다.","basis":"매뉴얼 82쪽 각주12"},{"stage":"조사·확인","when":"신고사항을 공유받은 날부터 3일 이내","who":"교육지원청","what":"사안 확인","detail":"학교와 교사를 통해 사실관계를 확인한다.","basis":"매뉴얼 82쪽"},{"stage":"조사·확인","when":"공유받은 날부터 5일 이내","who":"교육지원청","what":"'교육활동 확인서' 작성·상신","detail":"정당한 생활지도로 판단한 근거를 적어 교육청에 공문으로 올린다. 판단 기준은 초·중등교육법 제20조의2, 시행령 제40조의3, 생활지도 고시와 해설서, 학칙, 학급 규칙·교육주체 간 협약, 교원-보호자 사전 협의 사항이다.","basis":"매뉴얼 82~83쪽"},{"stage":"조사·확인","when":"안 날부터 7일 이내(부득이하면 7일 범위 1회 연장)","who":"교육감","what":"교육감 의견서를 지자체·수사기관에 서면 제출","detail":"경찰은 의견서를 사건기록에 붙이고 수사와 송치 의견에 참고해야 한다. 검사도 수사·결정 때 참고해야 한다. 지자체는 아동학대 사례 판단에 참고해야 한다.","basis":"교원지위법 제17조; 시행령 제11조; 아동학대처벌법 제11조의2제2항·제17조의3"},{"stage":"조사·확인","when":"지자체 조사","who":"아동학대전담공무원","what":"지자체 조사와 사례판단","detail":"아동 보호·사례관리 목적의 조사다. 관계인에게 출석·진술·자료제출을 요구할 수 있고, 조사 후 복지적 관점에서 아동학대 여부를 사례판단한다. 수사(처벌 목적)와는 별개다.","basis":"아동학대처벌법 제11조의2; 가이드북 4판 124~125쪽"},{"stage":"조사·확인","when":"경찰 수사","who":"신고된 교사","what":"피의자(또는 피신고자) 진술","detail":"교육지원청으로 통보된 사건은 경찰과 아동학대전담공무원이 조율해 같은 날 같은 장소에서 연달아 진술을 듣는 방식으로 부담을 줄일 수 있다. 변호사 조언을 받고, 정리한 기록을 바탕으로 사실대로 진술한다.","basis":"가이드북 4판 87쪽"},{"stage":"심의·결정","when":"수사 종결","who":"사법경찰관","what":"송치 또는 불송치","detail":"혐의가 있다고 보면 검사에게 송치하고(아동보호사건 처리 의견을 낼 수 있음), 아니면 불송치 이유를 적어 서류를 검사에게 보낸다. 불송치 시 7일 안에 고소인 등에게 통지되고, 고소인 등(고발인 제외)은 이의신청을 할 수 있다.","basis":"아동학대처벌법 제24조; 형사소송법 제245조의5~제245조의7"},{"stage":"심의·결정","when":"송치 후","who":"검사","what":"검사 결정","detail":"불기소, 상담·치료·교육을 조건으로 한 조건부 기소유예, 보호처분이 적절하면 아동보호사건으로 가정법원 송치, 또는 기소(형사재판). 교육감 의견서를 참고해야 한다.","basis":"아동학대처벌법 제17조의3제2항·제26조·제27조; 가이드북 4판 124쪽"},{"stage":"조치·이행","when":"기소·송치된 경우","who":"법원","what":"형사재판 또는 보호처분","detail":"형사법원은 형벌을, 가정법원은 보호처분을 정한다. 형이나 치료감호를 선고할 때는 원칙적으로 학교 등 아동관련기관 취업제한명령을 함께 선고하지만, 재범 위험이 현저히 낮거나 특별한 사정이 있으면 선고하지 않는다. 취업제한명령이 없으면 벌금형만으로 직을 잃지는 않는다.","basis":"가이드북 4판 127쪽(아동복지법 제29조의3)"},{"stage":"조치·이행","when":"수사 중","who":"임용권자","what":"직위해제 제한","detail":"아동학대범죄로 신고된 것만으로는 정당한 사유 없이 직위해제할 수 없다. 교육공무원법상 수사 중 직위해제는 아동복지법 제17조 금지행위 등으로 비위 정도가 중대하고 정상적 업무수행을 기대하기 현저히 어려운 경우 등에 한한다. 기소되면(약식명령 청구 제외) 직위해제 사유가 될 수 있다.","basis":"교원지위법 제6조제3항; 교육공무원법 제44조의2제1항제3호·제4호"},{"stage":"조치·이행","when":"필요 시","who":"신고된 교사","what":"교원보호공제 청구","detail":"정당한 교육활동 관련 민·형사 소송비용, 손해배상금(고의·중과실 제외), 분쟁조정 서비스를 시도 학교안전공제회에 청구한다. 표준약관상 형사는 유죄 확정 시 지원 제외, 민사는 고의·중과실이 객관적으로 명백하면 제외. 청구권은 사유 발생일부터 3년.","basis":"교원지위법 제22조; 매뉴얼 84~85쪽; 학교민원 처리 매뉴얼(2026) 36쪽"},{"stage":"불복·구제","when":"징계·직위해제 등 처분을 안 날부터 30일 이내","who":"신고된 교사(변호사 대리 가능)","what":"교원소청심사 청구","detail":"징계처분과 그 밖에 의사에 반하는 불리한 처분(직위해제 포함)에 대해 교육부 교원소청심사위원회에 청구한다. 위원회는 접수 후 60일 안에 결정(30일 연장 가능). 처분권자는 결정서를 받은 날부터 30일 안에 결정 취지대로 구제조치를 해야 한다.","basis":"교원지위법 제7조·제9조·제10조"},{"stage":"불복·구제","when":"소청 결정서를 받은 날부터 30일 이내","who":"교원(사립은 학교법인 등도)","what":"행정소송","detail":"소청 결정에 불복하면 행정소송을 낸다. 이 기간이 지나면 결정이 확정된다.","basis":"교원지위법 제10조제4항·제5항"},{"stage":"불복·구제","when":"허위 신고·협박이 있을 때","who":"교사·학교장","what":"교육활동 침해로 신고, 형사 대응","detail":"무고, 협박, 명예훼손, 목적이 정당하지 않은 반복 민원은 교원지위법상 교육활동 침해행위다. 지역교권보호위원회 심의를 거쳐 보호자 조치(서면사과·특별교육)를 받게 하고, 무고 등은 교사가 고소할 수 있다.","basis":"교원지위법 제19조·제26조"},{"stage":"종결·사후","when":"사안 종결 후","who":"신고된 교사·학교장","what":"복귀와 회복","detail":"수업·담임 교체 등 임시 조치를 정리하고 정상 교육활동으로 복귀한다. 교육활동보호센터의 심리상담·치유 프로그램, 교원 정신건강 지원 사업을 이용한다.","basis":"교원지위법 제29조·제29조의2"}],"deadlines":[{"what":"교육지원청 사안 확인","limit":"신고사항을 공유받은 날부터 3일 이내","basis":"교육활동 보호 매뉴얼(2026) 82쪽"},{"what":"교육지원청 '교육활동 확인서' 상신","limit":"공유받은 날부터 5일 이내","basis":"매뉴얼 82쪽"},{"what":"교육감 의견서 서면 제출","limit":"조사·수사 사실을 안 날부터 7일 이내(부득이하면 7일 범위에서 1회 연장)","basis":"교원지위법 시행령 제11조"},{"what":"경찰 불송치 통지","limit":"송부한 날부터 7일 이내 고소인 등에게","basis":"형사소송법 제245조의6"},{"what":"교원소청심사 청구","limit":"처분이 있었던 것을 안 날부터 30일 이내","basis":"교원지위법 제9조제1항"},{"what":"소청심사 결정","limit":"접수 후 60일 이내(30일 연장 가능)","basis":"교원지위법 제10조제1항"},{"what":"소청 결정에 대한 행정소송","limit":"결정서를 송달받은 날부터 30일 이내","basis":"교원지위법 제10조제4항"},{"what":"교원보호공제 공제금 청구","limit":"지급 사유 발생일부터 3년 이내","basis":"학교민원 처리 매뉴얼(2026) 36쪽"}],"dont":["학부모에게 직접 전화·문자로 해명하거나 사과문·합의서를 먼저 써 주지 않는다 — 나중에 인정 자료로 쓰일 수 있다. 분쟁조정은 지역교권보호위원회·공제 분쟁조정 서비스를 거친다","해당 학생을 따로 불러 '그때 선생님이 그런 뜻 아니었지?'라고 묻지 않는다 — 진술에 영향을 주려 했다는 오해를 산다","반 학생들에게 사건을 설명하거나 목격 학생들에게 진술을 맞추라고 하지 않는다","기록 없이 기억만으로 조사를 받지 않는다 — 당일 기록과 근거 조항을 준비한다","혼자 버티지 않는다 — 학교장 보고와 교육지원청 절차에 올려야 교육감 의견서가 제때 나간다","학교가 보관하는 학생 자료를 개인적으로 빼내 수사기관에 내지 않는다 — 기관 자료는 수사기관의 적법한 요청이 있을 때 기관 명의로 낸다","소청심사 30일을 놓치지 않는다 — 징계·직위해제 통지를 받으면 바로 날짜를 적어 둔다"],"contacts":[{"name":"교육활동보호 대표번호","tel":"지역번호+1395 (경북 054-1395)","note":"업무시간. 교육감 의견 제출 제도 안내·담당자 연계, 교원보호공제 안내"},{"name":"경북교육청 교육활동보호센터","tel":"054-450-4363~4","note":"경북교육청연수원 본관 1층(구미), 2026.1. 기준"},{"name":"한국교육개발원 교육활동보호센터","tel":"","note":"forteacher.kedi.re.kr"},{"name":"정보공개 포털","tel":"","note":"open.go.kr — 수사기관에 신고 사안 정보공개청구"}],"forms":["당일 경위 기록(시간순, 교사 발언·행동과 근거 조항, 목격자)","학생 상담·생활지도 기록, 보호자와 주고받은 연락 기록, 학급 규칙","교육활동 확인서(교육지원청 작성 — 교사는 자료 제출로 협조)","정보공개청구서(수사기관 대상, open.go.kr)","교원보호공제 공제금 청구서(시도 학교안전공제회 서식)","소청심사 청구서(교원소청심사위원회)"],"law":[{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제2조제3호 단서","point":"「유아교육법」과 「초·중등교육법」에 따른 교원의 정당한 교육활동과 학생생활지도는 아동학대로 보지 않는다"},{"name":"초·중등교육법","article":"제20조의6(「아동복지법」의 적용 배제)","point":"정당한 학생생활지도, 방어·보호를 위한 제지, 개별학생교육지원, 스마트기기 사용·소지 제한은 아동복지법 제17조제3호·제5호·제6호(신체·정서학대, 방임) 금지행위로 보지 않는다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제17조(아동학대 사안에 대한 교육감의 의견 제출)","point":"정당한 생활지도가 아동학대로 신고되어 조사·수사가 진행되면 교육감은 지자체·수사기관에 신속히 의견을 내야 한다"},{"name":"교원지위법 시행령","article":"제11조","point":"안 날부터 7일 이내 서면 제출, 부득이하면 7일 범위에서 1회 연장"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제11조의2제2항·제17조의3","point":"지자체는 교육감 의견을 사례 판단에, 경찰은 수사와 의견 제시에, 검사는 수사·결정에 참고해야 한다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제6조제3항","point":"교원이 아동학대범죄로 신고된 경우 임용권자는 정당한 사유 없이 직위해제하면 안 된다"},{"name":"교육공무원법","article":"제44조의2(직위해제)","point":"기소된 자(약식명령 청구 제외), 아동복지법 제17조 금지행위 등으로 수사 중이며 비위가 중대하고 정상 업무를 기대하기 현저히 어려운 자 등에게 직위를 주지 않을 수 있다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제9조·제10조(소청심사)","point":"불리한 처분을 안 날부터 30일 내 청구, 60일(+30일) 내 결정, 결정서 송달 후 30일 내 행정소송"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제21조(법률지원단)·제22조(교원보호공제사업)","point":"교육활동 관련 분쟁 시 변호사 등 법률 상담, 정당한 교육활동 관련 민·형사 소송비용과 손해배상금(고의·중과실 제외) 지원"}],"deep":[{"title":"교육감 의견서는 이렇게 나간다","body":["조사·수사기관이 교원 대상 아동학대 신고 사안을 교육지원청에 공유하면 절차가 시작된다. 교육지원청은 3일 안에 사안을 확인하고, 5일 안에 '교육활동 확인서'를 교육청에 올린다. 교육감은 공유받은 날부터 7일 안에(공휴일 제외, 부득이하면 7일 1회 연장) 서면 의견서를 낸다.","의견서의 핵심은 '정당한 교육활동·생활지도였는가'다. 판단 근거는 초·중등교육법 제20조의2, 시행령 제40조의3, 학생생활지도 고시와 해설서, 학칙, 학급 규칙과 교육주체 간 협약, 보호자와 사전에 협의한 내용이다. 그래서 교사가 모아 둔 학급 규칙, 사전 안내, 지도 기록이 곧 의견서의 재료가 된다.","신고 내용을 모르면 수사기관에 정보공개청구를 해서 확인하고, 자료를 교육지원청에 낼 수 있다."],"basis":"교원지위법 제17조; 시행령 제11조; 매뉴얼 82~83쪽"},{"title":"지자체 조사와 경찰 수사는 다르다","body":["아동학대전담공무원(지자체)의 조사는 아이 보호와 사례관리를 위한 것이고, 조사 뒤 복지적 관점에서 '아동학대 사례' 여부를 판단한다. 관계인은 정당한 사유 없으면 출석·진술·자료 제출에 따라야 한다.","경찰 수사는 범죄 혐의를 가려 처벌 여부를 정하기 위한 것이다. 경찰은 송치 또는 불송치를 결정하고, 송치되면 검사가 불기소, 조건부 기소유예, 아동보호사건 송치, 기소 중 하나를 정한다. 두 기관 모두 교육감 의견을 참고해야 한다.","교육지원청으로 통보된 사건은 두 기관이 조율해 같은 날 같은 곳에서 연달아 진술을 들어 교사의 부담을 줄일 수 있다."],"basis":"아동학대처벌법 제11조의2·제17조의3·제24조~제27조; 가이드북 4판 87·124~125쪽"},{"title":"직위해제와 징계, 그리고 소청심사","body":["신고만으로는 직위해제할 수 없다(교원지위법 제6조제3항). 교육공무원법상 수사 중 직위해제는 비위 정도가 중대하고 정상적 업무수행을 기대하기 현저히 어려운 경우 등에 한정되고, 기소(약식명령 청구 제외)되면 사유가 된다.","직위해제나 징계처분을 받으면 안 날부터 30일 안에 교원소청심사위원회에 소청심사를 청구한다. 변호사를 대리인으로 세울 수 있다. 위원회는 60일(30일 연장 가능) 안에 결정하고, 처분권자는 결정서를 받은 날부터 30일 안에 결정대로 구제조치를 해야 한다. 결정에 불복하면 결정서 송달일부터 30일 안에 행정소송을 낸다."],"basis":"교원지위법 제6조·제9조·제10조; 교육공무원법 제44조의2"},{"title":"돈 문제: 변호사 비용과 배상","body":["교육청 법률지원단에서 법률 상담을 받을 수 있다. 소송 비용은 교원보호공제로 청구한다. 표준약관 기준 형사 고소(고발) 대리 1건당 330만원, 수사단계 1인당 330만원, 수사단계를 포함한 형사소송 1인당 660만원이 한도이고, 형사는 유죄가 확정되면 지원하지 않는다.","교육활동으로 생긴 손해배상책임은 1사고당 2억5천만원(소송 전 합의 시 1억5천만원) 한도로 지원하되 고의·중과실은 제외한다. 표준약관은 최소 보장 범위라 시도마다 다를 수 있으니 경북 약관을 확인한다. 청구는 사유 발생일부터 3년 안에 한다."],"basis":"교원지위법 제21조·제22조; 교육활동 보호 매뉴얼(2026) 84~85쪽; 학교민원 처리 매뉴얼(2026) 36쪽"},{"title":"학교는 무엇을 해야 하나","body":["학교장은 교육(지원)청 담당자와 협의해 교사 면담, 동선 구분, 수업·담임 교체 등 필요한 조치를 한다. 이때 아이 보호와 함께 정당한 교육활동 여부, 다른 학생 학습권도 함께 본다.","학부모가 교사의 학대를 호소하는 것만으로 동료 교사에게 신고의무가 생기지는 않는다. 여러 정보를 종합해 의심될 때 신고한다. 학교가 보유한 학생 자료는 수사기관의 적법한 요청이 있을 때 기관 명의로 제출한다."],"basis":"가이드북 4판 65·121쪽; 매뉴얼 78쪽"}],"tables":[{"title":"교육감 의견 제출 일정","head":["기한","누가","무엇을"],"rows":[["신고 접수 후","조사·수사기관","교원 대상 신고사항을 교육지원청에 공유"],["공유받은 날부터 3일 이내","교육지원청","사안 확인(학교·교사)"],["공유받은 날부터 5일 이내","교육지원청","교육활동 확인서를 교육청에 상신"],["공유받은 날(안 날)부터 7일 이내","교육감","지자체·수사기관에 의견서 서면 제출(부득이하면 7일 1회 연장)"],["조사·수사 중","지자체·경찰·검사","의견서를 사례판단·수사·결정에 참고"]],"note":"교원지위법 시행령 제11조, 교육활동 보호 매뉴얼(2026) 82쪽. 매뉴얼은 7일을 공휴일 제외로 적고 있다."},{"title":"수사 결과별 의미","head":["결과","누가 정하나","교사에게 의미"],"rows":[["불송치","사법경찰관","검사에게 송치하지 않음. 고소인 등은 이의신청 가능(이의신청 시 검사에게 송치)"],["불기소","검사","재판에 넘기지 않음"],["조건부 기소유예","검사","상담·치료·교육을 조건으로 기소를 미룸"],["아동보호사건 송치","검사","가정법원에서 보호처분(형사처벌 아님)"],["기소","검사","형사재판. 직위해제 사유가 될 수 있음(약식명령 청구 제외)"],["형 선고","형사법원","원칙적으로 취업제한명령 함께 선고. 선고되지 않으면 벌금형만으로 직을 잃지는 않음"]],"note":"아동학대처벌법 제24조·제26조·제27조, 형사소송법 제245조의5~제245조의7, 교육공무원법 제44조의2, 교육부 가이드북 4판 124·127쪽."},{"title":"교원이 쓸 수 있는 불복·구제 절차","head":["절차","대상","어디에","기간"],"rows":[["소청심사","징계, 직위해제 등 의사에 반하는 불리한 처분","교육부 교원소청심사위원회","처분을 안 날부터 30일(결정은 접수 후 60일, 30일 연장 가능)"],["행정소송","소청심사 결정","법원","결정서 송달일부터 30일"],["교육활동 침해 신고","무고·협박·명예훼손·반복 부당 민원","학교 → 지역교권보호위원회","발생 즉시 신고"],["행정심판·행정소송","지역교권보호위원회의 '침해 아님' 결정","교육청 행정심판위원회 / 법원","안 날부터 90일"]],"note":"교원지위법 제9조·제10조·제19조·제25조제14항, 교육활동 보호 매뉴얼(2026) 59~61쪽."}],"faq":[{"q":"교육감 의견서는 제가 신청해야 나가나요?","a":"조사·수사기관이 교원 대상 신고 사안을 교육지원청에 공유하면 교육지원청이 확인하고 교육감이 7일 안에 의견을 낸다. 공유를 기다리지 말고 학교장 보고와 교육지원청(1395) 연락을 먼저 해 두는 것이 좋다."},{"q":"신고된 내용을 몰라서 소명 자료를 준비할 수가 없어요.","a":"수사기관에 정보공개청구(open.go.kr)로 신고 사안을 확인할 수 있고, 자료를 교육지원청에 내 교육활동 확인서 작성에 협조할 수 있다."},{"q":"신고만으로 직위해제되나요?","a":"아니다. 교원지위법 제6조제3항은 정당한 사유 없는 직위해제를 금지한다. 교육공무원법상 직위해제는 기소되었거나, 비위가 중대하고 정상 업무를 기대하기 어려운 경우 등으로 한정된다. 직위해제를 받으면 30일 안에 소청심사를 청구할 수 있다."},{"q":"학부모가 교사의 학대를 주장하면 동료 교사는 무조건 신고해야 하나요?","a":"학부모의 호소나 민원만으로 신고의무가 생긴다고 보기 어렵다. 여러 정보를 종합해 학대가 의심될 때 신고한다(교육부 가이드북 Q&A)."},{"q":"변호사 비용은 어떻게 하나요?","a":"교육청 법률지원단에서 법률 상담을 받고, 교원보호공제로 민·형사 소송비용을 청구할 수 있다. 표준약관은 형사사건 수사단계 1인당 330만원, 수사단계 포함 형사소송 1인당 660만원 등 한도를 두며 유죄 확정 시 지원하지 않는다. 시도별 약관이 다를 수 있다."},{"q":"벌금형을 받으면 교사를 그만둬야 하나요?","a":"법원이 취업제한명령을 함께 선고하지 않으면 그것만으로 직에서 물러나지는 않는다. 다만 미성년자 대상 성범죄 등은 당연퇴직 사유이고, 형사처벌과 별도로 징계를 받을 수 있다(교육부 가이드북 Q&A)."},{"q":"무혐의가 나왔어요. 신고한 학부모에게 대응할 수 있나요?","a":"허위 신고로 교사를 형사처분받게 할 목적이었다면 무고로 교육활동 침해행위에 해당할 수 있다. 지역교권보호위원회에 올리거나 고소를 검토할 수 있다. 다만 무고가 성립하는지는 수사기관이 판단한다."}],"record":"교사 개인 기록은 사실 중심으로 남긴다(날짜·시간·말 그대로). 학교가 보유한 학생 관련 공문서·시스템 자료는 수사기관의 적법한 자료제출 요구가 있어야 기관 명의로 낼 수 있다(교육활동 보호 매뉴얼 78쪽 취지).","sources":[{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (수탁연구자료 CRM 2026-09, 발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"아동학대 예방 및 대처요령 교육부문 가이드북 4판 (발행 2024.12.)","publisher":"교육부","year":2024,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/AC1D0C24-4393-F719-8DFF-64E35865C917.pdf"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19.) 및 시행령 (시행 2025.9.19.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"아동학대범죄의 처벌 등에 관한 특례법 (시행 2026.8.4.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"교육공무원법 (시행 2026.2.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"형사소송법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/형사소송법"}],"verified":"2026-09-24","uncertain":["경북 1395 번호는 매뉴얼의 '지역번호+1395' 원칙에 경북 지역번호 054를 붙인 것이다. 매뉴얼 예시에 직접 나온 번호는 인천 032-1395뿐이다","경북교육청 교원보호공제 약관의 실제 보장 한도는 확인하지 못했다. 표준약관(최소 보장 범위) 수치만 적었다","'학부모와 직접 접촉·개인 합의를 삼가라'는 공식 매뉴얼의 명시 문구가 아니라, 분쟁조정·교육감 의견 제출 절차를 거치라는 매뉴얼 취지에서 끌어낸 실무 권고다","지자체의 '아동학대 사례' 판단 결과에 교사가 이의를 제기하는 별도 절차가 있는지는 법령·매뉴얼에서 확인하지 못했다","경북교육청이 따로 운영하는 교원 대상 아동학대 신고 대응 지침(담당 부서·서식)은 확인하지 못했다","사립학교 교원의 직위해제·징계 근거 조문(사립학교법)은 이번에 확인하지 않았다. 소청심사 절차(교원지위법 제9조)는 국공립·사립 모두 해당"],"related":["teacher-rights","student-guidance","malicious-complaint"]},{"id":"malicious-complaint","title":"악성(특이) 민원 대응","aka":["악성 민원","특이민원","학부모 민원","밤늦게 전화","개인 번호로 연락","카톡 민원","반복 민원","담임 교체 요구","폭언 전화","학교 찾아와요","민원대응팀","통화 녹음","면담 거절","국민신문고 반복","갑질 학부모"],"category":"교원 보호","urgency":"당일","roles":["민원을 받은 교사","교장","교감","행정실장","학교 민원대응팀","교육지원청 학교민원대응지원팀"],"summary":"학교민원은 교사 개인이 아니라 학교장 책임 아래 기관(민원대응팀)이 처리한다. 창구는 학교 대표번호·온라인 시스템으로 단일화하고, 폭언·폭행·스토킹·부당 반복 요구 같은 특이민원은 즉시 응대를 멈추고 관리자에게 넘긴다. 교원에 대한 특이민원이 교원지위법상 교육활동 침해에 해당하면 교권보호위원회에 올릴 수 있다.","first":["폭언·협박·성희롱이 시작되면 사유를 알리고 통화·면담을 끝낸다","혼자 상대하지 말고 교감·교장(민원대응팀)에게 즉시 보고해 넘긴다","개인 휴대전화·SNS로 온 민원에는 답하지 말고 학교 대표번호·공식 창구로 안내한다","통화·면담 내용, 문자, 날짜·시간을 기록하고 녹음 파일을 보관한다","위협이 있으면 112에 신고하고, 교육활동 침해면 1395(경북 054-1395)·교육지원청에 신고한다"],"steps":[{"when":"평소(학년 초)","who":"학교장·민원대응팀","what":"민원 창구 단일화와 안내","detail":"학교 대표번호·온라인 시스템을 공식 창구로 정한다(교직원 개인 연락처는 창구에 포함할 수 없음). 창구와 처리 절차를 연 1회 이상 학부모 총회·가정통신문·홈페이지 등으로 안내한다.","basis":"초·중등교육법 제30조의10제3항; 학교민원 처리 매뉴얼(2026) 9~10·28쪽"},{"when":"평소","who":"학교","what":"녹음 전화와 통화연결음, 민원상담실","detail":"녹음 사실 고지와 상호 존중 당부가 담긴 통화연결음을 설정하고, 상담·민원 전화는 녹음 가능한 전화로 한다. 민원상담실에는 녹음·녹화 장치, CCTV, 비상벨을 갖추고 녹음 고지문을 붙인다. 교실로 민원인을 들이는 것은 되도록 피한다.","basis":"민원처리법 시행령 제4조제1항; 매뉴얼 21~22·29~30쪽"},{"when":"민원 접수","who":"민원대응팀","what":"접수·분류·배분","detail":"단순 질의는 민원대응팀이 바로 처리하고, 학생 상담은 담임, 사실 확인이 필요한 건 담당자 협조, 교육활동 침해 가능성이 큰 복잡한 민원은 학교장이 총괄한다. 대표번호로 온 전화를 담당 교사에게 바로 돌려 연결하는 것은 피한다.","basis":"매뉴얼 10·28쪽"},{"when":"상담·면담 요청","who":"민원대응팀·담당 교사","what":"사전 예약·지정 장소·업무시간","detail":"유선·방문 민원은 사전 예약한 일정에만 진행한다. 전화는 학교 업무전화로, 방문은 민원상담실 등 지정 장소에서 한다. 필요하면 민원대응팀이 동석한다. 수업 중 요청이 와도 교육활동이 끝난 뒤 처리한다.","basis":"매뉴얼 6·11쪽"},{"when":"예약 없이 찾아왔을 때","who":"민원대응팀","what":"우선 면담 또는 예약 안내","detail":"담당 교사가 수업 중이거나 없으면 민원대응팀이 먼저 면담하고, 특이민원이면 교장·교감이 면담한다(필요하면 담당자 배석).","basis":"매뉴얼 11쪽"},{"when":"응대 중 특이민원 발생","who":"민원을 받은 교직원","what":"즉시 응대 중단과 관리자 보고","detail":"폭언·폭력·스토킹·부당요구가 생기면 바로 멈추고 관리자(민원대응팀)에게 보고해 기관 차원으로 넘긴다. 감정적으로 맞대응하지 말고, 경고 후에도 계속되면 녹음·녹화 → 진정 요청과 법령 위반 경고 → 퇴거 요청·경찰 신고 순으로 대응한다.","basis":"매뉴얼 11·19~20쪽"},{"when":"특이민원 발생 직후","who":"학교장","what":"피해 교직원 분리와 민원인 조치","detail":"피해 교직원을 민원인과 공간적·업무적으로 분리(대면 제한, 통화 제한, 대체 담당자 지정)하고 휴식 시간을 준다. 민원인에게는 출입 제한·퇴거 조치, 학교민원 창구 이용 제한, 경찰 신고를 할 수 있다.","basis":"민원처리법 시행령 제4조제1항제3호·제4호; 매뉴얼 20·35쪽"},{"when":"학교에서 해결이 어려울 때","who":"학교장","what":"교육(지원)청 지원 요청·이첩","detail":"3회 이상 같은 민원으로 종결했는데도 계속 요구하거나 위력을 쓰는 경우, 퇴거명령 등에 불응하는 경우, 처벌 가능한 중대 위법, 분쟁조정 후에도 해결이 안 되는 경우 등은 '특이민원 관련 지원 요청 보고서'로 교육(지원)청 학교민원대응지원팀에 지원을 요청·이첩한다.","basis":"매뉴얼 12·23쪽"},{"when":"교원 대상 특이민원이 교육활동 침해에 해당할 때","who":"피해교원·학교장","what":"교육활동 침해로 신고","detail":"목적이 정당하지 않은 반복 민원, 법적 의무가 아닌 일의 지속 강요, 정당한 교육활동에 대한 반복적 부당 간섭(담임 교체 반복 요구, 평가·생활지도 과도 간섭 등), 성적 언동, 무단 녹음·배포 등은 지역교권보호위원회에 올릴 수 있다. 보호자 조치는 서면사과·재발방지 서약, 특별교육·심리치료.","basis":"교원지위법 제19조·제26조; 교육활동 침해 행위 및 조치 기준에 관한 고시 제2조; 매뉴얼 17~19쪽"},{"when":"범죄에 해당할 때","who":"피해교직원·교육(지원)청","what":"고소·고발 등 법적 조치","detail":"피해 교직원은 직접 고소할 수 있고(친고죄는 본인 고소 필요), 교육감은 고발할 수 있다. 법적 조치 여부는 교육(지원)청 기관장이 최종 결정하고, 수사 출석·증거 제출을 지원한다.","basis":"교원지위법 제20조제4항; 민원처리법 시행령 제4조제1항제5호의2·제5호의3; 매뉴얼 23~24쪽"},{"when":"피해 이후","who":"학교장·교육활동보호센터","what":"회복 지원과 불이익 금지","detail":"심리상담·치료 지원, 6일 이내 단순 안정이면 공무상 병가 승인 가능. 교육활동 침해 피해는 교육활동보호센터 심리상담 연계. 교원보호공제로 분쟁·소송 비용 지원. 정당하게 응대(종료·분리·요구 거절)했다는 이유로 민원인이 징계를 요구해도 불이익을 주면 안 된다.","basis":"민원처리법 시행령 제4조제3항; 교원지위법 제22조; 매뉴얼 35~36쪽"}],"deadlines":[{"what":"민원 처리 기한(예시안)","limit":"단순민원 즉시 / 복합민원 7일 이내 / 관리자 총괄 민원 14일(연장 가능)","basis":"학교민원 처리 매뉴얼(2026) 11쪽"},{"what":"상담·면담 권장 시간(예시)","limit":"20분 — 정당한 사유 없이 넘기면 종결 가능","basis":"매뉴얼 7쪽; 민원처리법 시행령 제4조제1항제7호·제8호"},{"what":"반복 민원 종결","limit":"합리적 답변 뒤에도 같은 내용을 정당한 사유 없이 3회 이상 제기하면 종결 가능","basis":"매뉴얼 7·12쪽"},{"what":"교원보호공제 공제금 청구","limit":"지급 사유 발생일부터 3년 이내","basis":"매뉴얼 36쪽"},{"what":"교육활동 침해로 신고 시 교육지원청 보고","limit":"사안 접수부터 24시간 이내","basis":"교육활동 보호 매뉴얼(2026) 38쪽"}],"dont":["개인 휴대전화 번호를 알려주거나, 밤·주말에 개인 번호·SNS로 온 민원에 답하지 않는다 — 공식 창구 외 민원은 거부·종결할 수 있다","폭언이 오가는데 혼자 끝까지 들어주지 않는다 — 사유를 알리고 종료한 뒤 관리자에게 넘긴다","감정적으로 맞받아치거나 개인 의견·훈계로 언쟁하지 않는다 — 규정에 따라 원칙대로","녹음 파일을 단체방·SNS에 올리거나 목적 외로 쓰지 않는다 — 개인정보로 관리","교실에서 학부모를 따로 만나지 않는다 — 민원상담실·교무실 등 안전장비가 있는 개방 공간에서","'내 반 일이니 내가 해결한다'며 보고 없이 사과·약속을 하지 않는다 — 학교민원 처리 책임자는 학교장"],"contacts":[{"name":"교육활동보호 대표번호","tel":"지역번호+1395 (경북 054-1395)","note":"교육활동 침해 신고, 학교 민원 응대 매뉴얼 안내, 법률·심리 상담 연계"},{"name":"경북교육청 교육활동보호센터","tel":"054-450-4363~4","note":"2026.1. 기준"},{"name":"경찰","tel":"112","note":"폭행·흉기·퇴거 불응·스토킹 등"},{"name":"교육(지원)청 학교민원대응지원팀","tel":"","note":"관할 교육지원청 대표번호로 연결. 옛 명칭 '통합민원팀'"}],"forms":["특이민원 관련 지원 요청 보고서 — 학교민원 처리 매뉴얼(2026) 부록","민원 응대 기록(일시·경로·내용·조치)과 녹음·녹화 파일","교육활동 침해 사안신고서 — 교육활동 보호 매뉴얼 서식1(교육활동 침해로 올릴 때)","학교 민원 창구·처리 절차 안내문(가정통신문·홈페이지 게시용)"],"law":[{"name":"초·중등교육법","article":"제20조제1항(교직원의 임무)","point":"교장은 교무를 총괄하고 민원처리를 책임진다"},{"name":"초·중등교육법","article":"제30조의10(학교민원 처리 계획)","point":"교육부 학교민원 처리 계획, 교육감 지원계획(민원 처리 교직원 보호 포함), 학교장은 민원 처리 방법·절차를 학생·보호자에게 정기 안내"},{"name":"초·중등교육법","article":"제20조의3(교원 개인정보 보호)","point":"학교와 학교장은 교원의 전화번호 등 개인정보가 보호되도록 필요한 조치를 해야 한다"},{"name":"민원 처리에 관한 법률","article":"제4조(민원 처리 담당자의 보호)·제5조(민원인의 의무)","point":"기관장은 폭언·폭행·부당 반복 민원으로부터 담당자를 보호할 조치를 해야 하고, 민원인은 부당한 요구나 공무방해를 하면 안 된다"},{"name":"민원 처리에 관한 법률 시행령","article":"제4조제1항","point":"안전장비·녹음전화 운영, 퇴거·일시 출입 제한, 담당자 분리, 치료·상담, 고발과 고소 지원, 권장 통화·면담 시간 설정, 폭언·권장시간 초과 시 사유 고지 후 종료"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제19조제2호","point":"목적이 정당하지 않은 반복 민원, 법적 의무가 아닌 일의 지속 강요는 교육활동 침해행위"},{"name":"초·중등교육법","article":"제18조의6(보호자의 의무)","point":"보호자는 교직원 인권 침해 금지, 생활지도 존중, 교원의 전문적 판단 존중·협력 의무"},{"name":"교원의 학생생활지도에 관한 고시","article":"제10조","point":"사전 합의 없는 상담, 직무 범위를 넘는 상담, 근무시간 외 상담은 거부할 수 있고, 폭언·협박 시 즉시 중단 가능"}],"faq":[{"q":"학부모에게 개인 번호를 절대 알려주면 안 되나요?","a":"교직원 개인 연락처는 비공개가 원칙이다. 교사가 원하면 상담용으로 개인 전화를 쓸 수는 있지만, 보호자 개인전화 연락에 응답하지 않을 수 있고 공식 창구 외 민원은 거부·종결할 수 있다."},{"q":"통화를 녹음하려면 상대 동의가 필요한가요?","a":"매뉴얼은 통화연결음이나 면담 시작 때 녹음 사실을 알리고 처음부터 끝까지 녹음할 수 있다고 안내한다. 폭언·폭행이 생겼거나 생기려는 비상시에는 알리지 않고 녹음·녹화할 수 있다. 자신이 참여한 대화 녹음은 통신비밀보호법 위반이 아니다."},{"q":"같은 요구를 계속 반복합니다. 언제까지 답해야 하나요?","a":"합리적으로 답했는데도 같은 내용을 정당한 사유 없이 3회 이상 이어가면 종결할 수 있다. 그 뒤에도 계속되거나 위력을 쓰면 교육(지원)청으로 이첩한다."},{"q":"악성 민원도 교권보호위원회에 올릴 수 있나요?","a":"교원을 상대로 한 특이민원이 교원지위법 제19조의 교육활동 침해행위(반복 부당 민원, 법적 의무 아닌 일 강요, 반복 부당 간섭 등)에 해당하면 교육활동 침해로 신고해 지역교권보호위원회 심의를 받을 수 있다."},{"q":"예약 없이 교실로 찾아왔어요.","a":"수업 중이면 응하지 않고 민원대응팀이 먼저 면담하거나 예약을 안내한다. 특이민원이면 교장·교감이 면담한다. 폭언·난동이면 퇴거를 요청하고 불응하면 경찰에 신고한다."},{"q":"학부모가 교사 징계를 요구하는 민원을 넣었습니다.","a":"정당하게 응대(종료·분리·권장시간 준수·부당 요구 거절)한 것을 이유로 한 징계 요구로 불이익을 줄 수 없다. 기관장은 인사상 불이익을 검토할 때 발생 경위를 충분히 고려해야 한다(민원처리법 시행령 제4조제3항)."}],"record":"민원 응대 녹음·녹화 파일은 기관 개인정보처리방침에 반영해 보유기간을 정하고 안전하게 관리한다. 교육활동 침해로 신고하면 교육활동 침해 사안 절차(24시간 내 교육지원청 보고 등)를 따른다.","sources":[{"title":"학교민원 처리 매뉴얼 (발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://buseo.sen.go.kr/buseo/bu12/user/bbs/BD_selectBbs.do?q_bbsSn=1266&q_bbsDocNo=20260310154650758"},{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"민원 처리에 관한 법률 시행령 (시행 2026.5.6.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/민원처리에관한법률시행령"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"}],"verified":"2026-09-24","uncertain":["20분 권장 시간, 처리 기한(즉시·7일·14일)은 매뉴얼의 '예시(안)'이다. 학교마다 정한 기준을 따른다","경북교육청 학교민원 처리 지원계획과 교육지원청 학교민원대응지원팀 연락처는 확인하지 못했다","민원대응팀 법제화 논의가 있었으나 현행 초·중등교육법에 '민원대응팀' 조문은 없다(제30조의10의 계획 규정만 있음). 매뉴얼의 '구성·운영(안)'에 근거한다","2024.3. 교육부 '학교 민원 응대 안내자료'는 2026.2. 매뉴얼로 대체된 것으로 보고 이번에는 근거로 쓰지 않았다","경북 054-1395는 '지역번호+1395' 원칙을 적용한 번호다"],"related":["teacher-rights","teacher-abuse-accusation"]},{"id":"student-guidance","title":"수업 방해 등 문제행동 생활지도","aka":["수업 방해","떠드는 학생","말 안 들어요","휴대폰 압수","휴대전화 수거","스마트폰 사용","교실 밖으로 내보내기","분리 지도","개별학생교육지원","훈육","훈계","반성문","생활지도 고시","물리적 제지","보호자 상담 요청"],"category":"교원 보호","urgency":"당일","roles":["수업 교사","담임","교감","교장","생활지도(학생부) 담당"],"summary":"교원은 법령과 학칙에 따라 조언·상담·주의·훈육·훈계·보상으로 학생을 지도할 수 있고, 2026년 3월부터는 수업을 계속 방해하는 학생을 일시 분리해 '개별학생교육지원'을 할 수 있다. 체벌(도구·신체로 고통을 주는 방법)은 어떤 경우에도 안 되고, 분리·물품 보관 뒤에는 학교장 보고와 보호자 통지가 따라야 한다.","first":["먼저 말로 주의를 준다(무엇이 문제인지, 멈추라고). 주의 준 횟수를 기억해 둔다","2회 이상 주의에도 계속 방해하거나 고성·폭언으로 수업이 안 되면 교실 안 지정 자리 또는 교실 밖 안전한 공간으로 일시 분리(개별학생교육지원)한다","학생이 자신이나 남을 다치게 할 긴급 상황이면 즉시 제지하고 다른 교직원에게 도움을 청한다 — 고통을 주는 방법은 금지","분리했거나 휴대전화 등을 보관했다면 일시·경위를 적어 학교장(교감)에게 보고한다","반복되면 보호자 상담을 요청하고, 계속 불응하면 학교장에게 징계나 교육활동 침해 처리를 요청한다"],"steps":[{"when":"문제행동 발생","who":"수업 교사","what":"조언·주의","detail":"학생 행동의 위험성, 학칙 위반 가능성 등을 짚어 경고한다. 수업 중 스마트기기나 수업에 맞지 않는 물품을 쓰면 주의를 주어 사용을 제한할 수 있다. 주의를 줬는데도 학생이 무시해 피해가 생기면 교사는 생활지도 책무를 다한 것으로 본다.","basis":"생활지도 고시 제9조·제11조"},{"when":"주의로 안 될 때","who":"수업 교사","what":"훈육(지시·말로 제지·과업 부여)","detail":"금지된 행동은 즉시 말로 멈추게 할 수 있다. 바람직한 행동을 위한 과업이나 지시를 할 수 있으나 인권을 존중하고 법령·학칙 범위 안에서 한다.","basis":"생활지도 고시 제12조제1항~제3항"},{"when":"수업 중 스마트기기 등을 계속 쓸 때","who":"수업 교사","what":"물품 분리 보관","detail":"2회 이상 주의에도 계속 쓰는 물품, 위험 물품, 학생에게 판매 금지 물품, 학칙으로 정한 스마트기기 등은 학칙에 따라 분리 보관할 수 있다. 보관 뒤 일시·경위를 학교장에게 보고하고, 학교장이 보호자에게 알린다. 반환 시점·방법은 학칙을 따른다.","basis":"초·중등교육법 제20조의5; 생활지도 고시 제12조제5항·제6항"},{"when":"위험 물품 소지가 의심될 때","who":"교원","what":"소지품 조사","detail":"자신·타인의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 줄 물품을 가졌다고 의심할 합리적 이유가 있을 때 필요한 범위에서만 조사한다.","basis":"생활지도 고시 제12조제4항"},{"when":"2회 이상 주의에도 반복하거나, 고성·폭언 등으로 수업을 심각하게 방해할 때","who":"수업 교사","what":"개별학생교육지원(일시 분리)","detail":"① 교실 안 지정된 자리 ② 교실 밖 학교 안 안전하고 쾌적한 공간 ③ 실외·학교 밖 수업이면 참여 학생과 떨어진 안전한 공간에서 상담이나 학습지원을 한다. 필요한 최소한으로 쓰고, 다시 수업에 참여할 수 있다고 판단되면 즉시 복귀시킨다. 장소·시간·학습지원 방법 등 세부는 학칙에 따른다.","basis":"초·중등교육법 제20조의4제1항; 시행령 제40조의4; 생활지도 고시 제19조제1항"},{"when":"별도 공간에서 지원한 뒤","who":"수업 교사 → 학교장","what":"보고와 보호자 통지","detail":"교원은 일시와 경위를 학교장에게 보고하고, 학교장은 보호자에게 알린다.","basis":"초·중등교육법 제20조의4제3항"},{"when":"분리를 거부하거나 여러 번 해도 계속 방해할 때","who":"학교장","what":"보호자에게 학생 인계 요청 → 가정학습","detail":"학교장은 가정학습 상황을 점검해야 한다. 이 경우 출석으로 인정한다. 인계 요청이 여러 번 반복되면 교육감에게 지원(치료·상담·학습지원 프로그램)을 요청할 수 있다.","basis":"초·중등교육법 제20조의4제4항·제5항; 생활지도 고시 제19조제2항"},{"when":"생명·신체 위해, 재산 중대 손해 우려가 있는 긴급 상황","who":"교원","what":"방어·보호를 위한 제지","detail":"피해 대상과 즉시 떼어 놓는 등 행동을 일시적으로 멈추게 하는 방법으로, 위험이 없어질 때까지 필요한 최소한만 한다. 다른 교직원에게 도움을 요청할 수 있다. 제지했으면 학교장에게 지체 없이 보고하고, 학교장은 보호자에게 신속히 알린다.","basis":"초·중등교육법 제20조의2제3항~제5항; 시행령 제40조의3제2항"},{"when":"문제행동이 이어질 때","who":"담임·교과 교사","what":"보호자 상담 요청","detail":"교원과 보호자는 서로 상담을 요청할 수 있고, 명백한 사유가 없으면 응해야 한다. 일시·방법은 학교장이 정한 대로 미리 협의한다. 사전 합의 없는 상담, 직무 범위를 넘는 상담, 근무시간 외 상담은 거부할 수 있고, 폭언·협박 시 즉시 중단할 수 있다.","basis":"생활지도 고시 제10조"},{"when":"개선이 없을 때","who":"교원","what":"훈계(성찰 과제 부여)","detail":"사유와 개선 방안을 함께 제시하고, 대안 행동, 성찰하는 글쓰기, 훼손한 시설·물품 원상복구(청소 포함) 과제를 줄 수 있다.","basis":"생활지도 고시 제13조"},{"when":"지속적으로 불응할 때","who":"교원 → 학교장","what":"징계 요청 또는 교육활동 침해 처리","detail":"교원은 계속 불응하는 학생의 징계를 학교장에게 요청할 수 있다(학교 봉사, 사회봉사, 특별교육, 1회 10일·연간 30일 이내 출석정지, 퇴학(의무교육 제외)). 의도적으로 교육활동을 방해하면 교육활동 침해행위로 보고 조치할 수 있다.","basis":"생활지도 고시 제16조; 초·중등교육법 제18조; 시행령 제31조"},{"when":"학생·보호자가 부당하다고 할 때","who":"학교장","what":"이의제기 처리","detail":"학생·보호자는 14일 이내 학교장에게 이의를 낼 수 있고, 학교장은 14일 이내 답한다. 같은 내용을 정당한 사유 없이 반복하면 2회 이상 답한 뒤 거부할 수 있다.","basis":"생활지도 고시 제17조"}],"deadlines":[{"what":"방어·보호 제지 후 학교장 보고","limit":"지체 없이","basis":"초·중등교육법 제20조의2제5항"},{"what":"학생·보호자의 이의제기","limit":"14일 이내","basis":"생활지도 고시 제17조제1항"},{"what":"학교장의 이의제기 답변","limit":"14일 이내","basis":"생활지도 고시 제17조제2항"},{"what":"출석정지 징계 한도","limit":"1회 10일 이내, 연간 30일 이내","basis":"초·중등교육법 시행령 제31조제1항제4호"},{"what":"2026 고시 위임사항 학칙 반영","limit":"2026년 8월 31일까지(그 전까지는 학교장이 정한 대로)","basis":"생활지도 고시 부칙(제2026-3호) 제2조"}],"dont":["도구나 신체를 이용해 학생 신체에 고통을 주는 방법을 쓰지 않는다 — 시행령 제40조의3이 생활지도와 제지 모두에서 명시적으로 금지","학생을 복도에 내보내고 혼자 방치하지 않는다 — 분리는 '상담·학습지원'이어야 하고 안전한 공간이어야 한다(무더위에 복도로 내보내 오래 방치한 교사가 방임 등으로 벌금형을 받은 판례가 해설서에 실려 있다: 대구지법 2018고단1137)","분리하거나 휴대전화를 보관하고 보고를 빠뜨리지 않는다 — 학교장 보고, 보호자 통지까지가 절차다","학칙에 근거 없이 물품을 압수하거나 보관 기간을 마음대로 정하지 않는다","사전 약속 없이 근무시간 외에 개인 전화로 보호자 상담을 이어가지 않는다 — 거부할 수 있다","다른 학생들 앞에서 사생활을 들춰 조언하지 않는다 — 사생활에 관한 조언은 비공개가 원칙"],"contacts":[{"name":"교육활동보호 대표번호","tel":"지역번호+1395 (경북 054-1395)","note":"지도 불응이 교육활동 침해로 번질 때"},{"name":"경찰","tel":"112","note":"흉기 등 긴급 위험 상황"}],"forms":["개별학생교육지원 기록(일시·경위·장소·지원 내용) — 학교장 보고용, 학교 서식","물품 분리보관 기록(일시·경위·물품·반환) — 학교장 보고용","방어·보호 제지 보고(일시·상황·조치)","가정학습 점검 기록(보호자 인계 시)","학교 생활규정(학칙)·학급생활규정"],"law":[{"name":"초·중등교육법","article":"제20조의2(학교의 장 및 교원의 학생생활지도)","point":"법령·학칙에 따라 학생 지도. 긴급 상황에서 방어·보호 제지 가능(최소한도, 도움 요청 가능, 학교장 보고·보호자 통지). 제3항~제6항은 2026.3.1. 학년도부터 시행"},{"name":"초·중등교육법","article":"제20조의4(개별학생교육지원)","point":"수업이 불가능할 정도로 방해하면 일시 분리해 개별 교육지원. 별도 공간 사용 시 학교장 보고·보호자 통지. 거부·지속 방해 시 보호자 인계 후 가정학습(2026.3.1. 학년도부터 시행)"},{"name":"초·중등교육법","article":"제20조의5(교내 스마트기기 사용 제한)","point":"학생은 수업 중 휴대전화 등 스마트기기를 쓰면 안 된다. 예외는 장애·특수교육 보조기기, 교육 목적, 긴급상황 대응으로 학교장·교원이 허용한 경우. 교내 사용·소지 제한은 학칙으로(2025.9.16. 공포, 2026.3.1. 시행)"},{"name":"초·중등교육법","article":"제20조의6(아동복지법 적용 배제)","point":"정당한 생활지도, 방어·보호 제지, 개별학생교육지원, 스마트기기 제한은 아동복지법상 신체·정서학대·방임 금지행위로 보지 않는다"},{"name":"초·중등교육법 시행령","article":"제40조의3(학생생활지도)","point":"학업·진로, 보건·안전, 인성·대인관계 등 분야에서 조언·상담·주의·훈육·훈계로 지도. 도구·신체로 고통을 주는 방법 금지"},{"name":"초·중등교육법 시행령","article":"제40조의4(개별학생교육지원의 적용 기준 및 방법)","point":"2회 이상 주의에도 반복·지속하거나 고성·폭언 등으로 심각하게 방해할 때. 교실 내 지정 공간, 교실 외 학교 내 공간, 실외 수업 시 분리 공간에서 상담·학습지원. 복귀 가능하면 즉시 복귀"},{"name":"교원의 학생생활지도에 관한 고시","article":"제2조(정의)","point":"조언·상담·주의·훈육·훈계·보상, 개별학생교육지원의 뜻을 정함(교육부고시 제2026-3호, 2026.3.1. 시행)"},{"name":"초·중등교육법","article":"제18조의6(보호자의 의무)","point":"보호자는 교원의 학생생활지도를 존중·지원하고 교육활동에 협력해야 한다"}],"faq":[{"q":"예전처럼 '교실 밖 분리'를 해도 되나요?","a":"2026년 3월 1일부터는 법률(초·중등교육법 제20조의4)의 '개별학생교육지원'으로 바뀌었다. 2회 이상 주의에도 계속 방해하거나 고성·폭언으로 심각하게 방해하면 교실 밖 학교 안 안전한 공간에서 상담·학습지원을 한다. 세부 장소·시간은 학칙을 따르고, 별도 공간을 썼다면 학교장 보고가 필요하다."},{"q":"주의→훈육 순서를 꼭 지켜야 하나요?","a":"원칙은 조언·주의로 안 될 때 훈육이다. 해설서는 앞선 주의가 반드시 당일일 필요는 없고, 학칙상 금지 행동은 바로 말로 제지할 수 있으며, 생명·신체 위해 같은 긴급 상황은 곧바로 제지할 수 있다고 안내한다."},{"q":"휴대전화는 등교 때 일괄 수거해도 되나요?","a":"법은 학교장과 교원이 필요하면 교내 스마트기기 사용·소지를 제한할 수 있고, 기준·방법은 학칙으로 정할 수 있다고 한다. 학교 학칙(학생생활규정)에 정한 방식대로 한다."},{"q":"보호자에게 데려가라고 해도 되나요? 결석 처리되나요?","a":"개별학생교육지원을 거부하거나 여러 번 했는데도 계속 방해하면 학교장이 보호자에게 인계를 요청해 가정학습을 하게 할 수 있다. 이때는 출석으로 인정한다. 담임이 혼자 결정할 일은 아니고 학교장이 요청한다."},{"q":"학생을 붙잡아 말리면 아동학대로 신고당하지 않나요?","a":"긴급 상황에서 필요한 최소한의 방어·보호 제지는 법에 근거가 있고, 정당한 제지는 아동복지법 금지행위로 보지 않는다(제20조의6). 끝나면 곧바로 학교장에게 보고하고 학교장이 보호자에게 알린다."},{"q":"보호자가 수업 시간에 전화해 상담하자고 합니다.","a":"상담은 수업시간 외 활용이 원칙이다. 목적·일시·방법이 미리 합의되지 않은 상담, 근무시간 외 상담은 거부할 수 있다."},{"q":"학생이 지도에 계속 불응하면 어떻게 하나요?","a":"교원은 학교장에게 징계를 요청할 수 있고, 의도적으로 교육활동을 방해하면 학교장은 교육활동 침해행위로 보고 조치할 수 있다(고시 제16조)."}],"record":"개별학생교육지원 기간과 보호자 인계 후 가정학습은 출석 인정(고시 제19조제2항). 학교 징계로서 출석정지는 별도(시행령 제31조). 교원은 별도 공간 분리, 물품 분리보관, 방어·보호 제지 모두 일시·경위를 학교장에게 보고한다.","sources":[{"title":"교원의 학생생활지도에 관한 고시 (교육부고시 제2026-3호, 2026.2.20. 개정, 2026.3.1. 시행)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원의학생생활지도에관한고시"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"초·중등교육법 시행령 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"교원의 학생생활지도에 관한 고시 해설서 (2025년도 일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소","year":2025,"url":"https://www.jbe.go.kr/board/download.do?boardId=BBS_0000191&command=update&startPage=1&dataSid=773355&fileSid=630661"}],"verified":"2026-09-24","uncertain":["해설서는 2025년판이라 2026.3.1. 개정 고시(개별학생교육지원 도입, 옛 교실 밖 분리 조항 삭제)가 반영되지 않았다. 2026년판 해설서는 찾지 못해 절차는 법·시행령·2026 고시 원문 기준으로 적었다. FAQ 두 번째 답(주의 순서)만 2025 해설서를 인용했다","휴대전화 보관 기간·반환 방법, 개별학생교육지원 장소·시간은 학칙마다 다르다. 소속 학교 생활규정을 확인해야 한다","'휴대전화 사용 제한 법제화'는 법률 공포일이 2025.9.16.(국회 통과는 그 전), 시행은 2026.3.1.이다. 요청서의 '2025.8'은 국회 의결 시점으로 보이나 원문으로 확인하지 못했다","경북교육청의 개별학생교육지원 운영 지침(공간·인력 지원)이 따로 있는지는 확인하지 못했다"],"related":["teacher-rights","teacher-abuse-accusation"]},{"id":"field-trip-accident","title":"현장체험학습·수학여행 중 사고·학생 이탈","aka":["수학여행 사고","체험학습 사고","수련회 다침","학생이 없어졌어요","학생 실종","인원 부족","버스 사고","숙소에서 다침","소풍 사고","현장학습 사고","인솔교사 책임","안전요원","보조인력","여행자보험","해외 수학여행 사고"],"category":"안전·보건","urgency":"즉시","roles":["인솔교사(담임)","현장 책임자(인솔 총괄)","보조인력·안전요원","학교장·교감","학교 비상대책위원회","행정실","교육지원청·교육청","여행사·가이드"],"summary":"현장체험학습·수학여행은 법상 ‘교육활동’이므로 그 중 사고는 학교안전사고이고 학교안전공제 대상이다. 현장에서는 ①구조 요청(119·112)과 응급처치 ②학교장에게 실시간 보고 ③학교장이 교육청에 즉시 보고 ④언론·학부모 창구 일원화 ⑤잔여 일정 판단 ⑥공제회 사고통지와 보상 안내 순으로 간다. 2025.6.21.부터 학교 밖 교육활동에 인솔교사를 돕는 보조인력을 둘 수 있고(제10조의4), 지침에 따라 안전조치의무를 다한 학교장·교직원·보조인력은 민사·형사 책임을 지지 않는다(제10조 제5항).","first":["다친 학생이 있으면 현지 119(해외는 현지 구급·가이드)에 구조를 요청하고 응급처치, 다른 학생은 안전한 곳으로 모은다","학생이 안 보이면 즉시 인원 재확인 → 마지막 목격 위치·시각 확인 → 현장 관리자·가이드에 알리고 찾기 시작, 짧은 시간 안에 못 찾으면 112(해외는 현지 경찰·영사콜센터)","현장 책임자는 학교장(교감)에게 바로 전화로 상황과 피해 규모를 보고한다","병원 동행 교사와 상황 보고 담당을 정하고, 남은 학생 인솔 인원을 다시 나눈다","학부모·언론에는 개인적으로 설명하지 말고 학교(교육청) 창구로 모은다"],"steps":[{"stage":"알게 됨·신고","when":"사고 즉시","who":"현장 책임자·인솔교사","what":"현지 구조 요청과 응급처치","detail":"현지 경찰서·소방서·보건소·병원 등에 즉시 구조를 요청하고 응급구조기관 지시를 따른다. 사고 발생 시 119 신고(필요 시 112)와 긴급 구조·구호를 먼저 한 뒤 교육청에 보고한다.","basis":"인천광역시교육청 2025학년도 현장체험학습 운영 매뉴얼 07 사안 발생 시 대응 요령(교육부 현장체험학습 안내자료 2024.12. 기반)"},{"stage":"알게 됨·신고","when":"학생 이탈 인지 즉시","who":"인솔교사·보조인력","what":"이탈 학생 확인과 신고","detail":"인원을 다시 세고 짝·조원에게 마지막 목격 위치를 묻는다. 학생에게는 낙오하면 그 자리에서 전화하도록 사전 교육한다. 공항 등에서 실종 시 안내방송과 경찰 신고, 국외에서는 현지 가이드에게 즉시 연락한다. 18세 미만이 길을 잃는 등으로 보호자에게서 이탈하면 법상 ‘실종아동등’이며 경찰신고체계(112)로 신고한다.","basis":"인천 2025 매뉴얼 국외 현장체험학습 안전 점검; 실종아동등의 보호 및 지원에 관한 법률 제2조·제6조"},{"stage":"초기 대응","when":"즉시","who":"현장 책임자","what":"학교장에게 실시간 보고","detail":"정확한 현장 상황과 피해 규모를 학교장에게 즉시 보고하고, 인솔교사 비상연락망으로 상황을 공유한다. 병원 동행 교사와 상황 보고자를 지정하고 인솔교사 업무를 다시 나눈다.","basis":"인천 2025 매뉴얼 07-가"},{"stage":"초기 대응","when":"즉시","who":"인솔교사(담임)","what":"학생 피해 파악과 돌봄","detail":"학생 피해 상황을 파악하고 상황에 따라 신속히 대피를 지도한다. 추가 피해가 예상되면 현장 책임자에게 즉시 보고한다. 응급환자는 응급처치 후 교사와 가이드가 함께 가까운 병원으로 이송하고, 담임은 병원에 머물며 상태를 파악해 학년부장·보호자에게 알린다.","basis":"인천 2025 매뉴얼 07-가, 부록 8 응급상황 대응 체계"},{"stage":"초기 대응","when":"사고 인지 즉시","who":"학교장·인솔교사","what":"교육청 즉시 보고","detail":"학교장과 인솔교사는 안전사고관리 지침에 따라 즉시 안전조치를 한 뒤 교육감(교육부장관)에게 즉시 보고해야 한다. 먼저 전화로 보고하고 사안보고서(6하원칙, 피해현황, 조치사항)를 뒤이어 보낸다.","basis":"학교안전법 제10조 제4항; 인천 2025 매뉴얼 07-2)"},{"stage":"초기 대응","when":"보고 직후","who":"학교장","what":"학교 비상대책위원회 소집","detail":"교장(교감)·교무부장·학생부장·해당 학년 학부모 대표 등으로 구성해 수습 방안을 논의한다. 교육청과 협의해 언론 대응 창구를 한 곳으로 모은다. 학부모·교직원에게 사실 그대로 알림 문자를 보낸다.","basis":"인천 2025 매뉴얼 07-가"},{"stage":"조사·확인","when":"당일","who":"현장 책임자·학교","what":"잔여 일정 진행 여부 결정","detail":"현장총괄자가 나머지 학생의 일정 진행 여부를 학교(교장·교감)와 협의하고, 필요하면 학부모 의견을 모아 신속히 결정한다. 교육감은 학생 안전 문제를 보고받으면 학교장에게 시행 보류·취소 등을 권고해야 한다.","basis":"인천 2025 매뉴얼 07-가·부록 8; 경상북도교육청 현장체험학습 학생안전관리 조례 제11조 제2항"},{"stage":"조사·확인","when":"당일~귀교 후","who":"인솔교사·보조인력·목격자","what":"사고 경위 기록","detail":"발생 일시·장소·활동·경위·목격자·조치·이송 병원을 기록한다. 경찰·언론 관련 사항이 있으면 사안보고서에 함께 적는다. 이 기록이 공제 사고통지와 교원 면책 판단(지침에 따른 안전조치 이행 여부)의 근거가 된다.","basis":"인천 2025 매뉴얼 사안보고서(예시); 학교안전법 제10조 제5항"},{"stage":"조치·이행","when":"사고 후 지체 없이","who":"학교장(행정실)","what":"학교안전공제회 사고통지","detail":"수학여행 등 현장체험활동은 법상 교육활동이므로 학교안전공제로 보상된다. schoolsafe.or.kr에서 사고발생통지를 하고, 보호자에게 공제급여 청구 방법을 안내한다(세부는 ‘교내 안전사고’ 항목).","basis":"학교안전법 제2조 제4호 가목, 제41조의2, 제44조 제2항"},{"stage":"조치·이행","when":"사고 후","who":"학교·보호자","what":"여행자보험·업체 배상책임보험 확인","detail":"계획 단계에서 학생·인솔자 보험 가입과 업체의 영업배상책임보험 가입을 확인해 두어야 한다. 사고 후에는 여행사·숙박·수련시설·운송업체 보험 적용 여부를 확인한다. 공제급여와 같은 성질의 배상을 다른 법령에 따라 받으면 그 범위에서 공제급여는 지급되지 않고, 자동차손해배상보장법에 따른 배상을 받으면 공제급여가 지급되지 않는다.","basis":"인천 2025 매뉴얼 04 공통 준수사항·계약 구비서류; 학교안전법 제8조의2 제2항 제2호, 제43조 제1항 제3호, 제45조 제2항"},{"stage":"조치·이행","when":"사고 후","who":"학교장·교육청","what":"교사 보호 조치","detail":"사고 관련 수사·민원·소송이 예상되면 교육청 법률지원과 교원보호공제(손해배상금·소송비용 지원, 고의·중과실 제외)를 신청한다. 교육부는 2026.5.28. 사고 초기부터 교육청 전담팀과 전담변호사를 지정해 법률상담부터 소송까지 지원하겠다고 발표했다.","basis":"교원지위법 제22조; 교육부 ‘현장체험학습 지원 방안’ 보도자료(2026.5.28.)"},{"stage":"불복·구제","when":"공제 결정에 불복 시","who":"보호자","what":"심사청구 → 재심사청구 → 소송","detail":"결정을 안 날부터 90일 안에 공제회 심사위원회, 심사 결정서 송달일부터 90일 안에 공제중앙회 재심사위원회, 재결서 송달일부터 60일 안에 소송.","basis":"학교안전법 제57조·제61조·제64조"},{"stage":"종결·사후","when":"귀교 후","who":"학교","what":"학생·교사 심리 지원과 평가","detail":"피해 학생·가족의 상담·심리치료는 교육감이 지원한다. 체험학습 종료 후 평가회에서 사고 원인과 안전대책을 점검해 다음 계획에 반영한다.","basis":"학교안전법 제10조의3; 인천 2025 매뉴얼 평가 및 환류"}],"deadlines":[{"what":"교육청 보고","limit":"즉시 안전조치 후 즉시(먼저 유선, 뒤이어 사안보고서)","basis":"학교안전법 제10조 제4항"},{"what":"공제회 사고통지","limit":"지체 없이","basis":"학교안전법 제44조 제2항"},{"what":"공제급여 청구권","limit":"3년 소멸시효","basis":"학교안전법 제65조"},{"what":"학생 100명 이상 수학여행 계획 교육감 보고(경북)","limit":"사전(3학급 이하 제외)","basis":"경상북도교육청 현장체험학습 학생안전관리 조례 제5조 제3항"}],"dont":["인원 확인 없이 버스를 출발시키지 않는다 — 탑승·하차 때마다 인원을 센다","이탈 학생을 교사 혼자 오래 찾느라 신고를 늦추지 않는다","사고 현장에서 교사 개인 SNS·단톡으로 사진이나 추측을 올리지 않는다 — 언론·학부모 창구는 학교로 일원화","다친 학생을 가이드나 업체 직원에게만 맡겨 병원에 보내지 않는다 — 교사가 동행한다","‘일정은 계속해도 되겠지’ 하고 현장에서 혼자 결정하지 않는다 — 학교장과 협의"],"contacts":[{"name":"구급","tel":"119","note":"국내"},{"name":"경찰(실종·사건)","tel":"112","note":"국내, 학생 이탈 시"},{"name":"외교부 영사콜센터","tel":"02-3210-0404","note":"24시간. 해외 유료 +82-2-3210-0404, 해외 무료 +800-2100-0404"},{"name":"경상북도학교안전공제회","tel":"1899-7752","note":"사고통지·보상 문의"}],"forms":["사안보고서(발생일시, 기본사항, 6하원칙 사안 개요, 언론·경찰 내용, 조치사항 및 향후계획) — 먼저 유선 보고","비상연락망(교육청·학교·교사·학생·학부모)과 체험지 병원·경찰서·소방서·보건소 연락처표 — 사전 작성","학교안전공제 사고발생통지·공제급여청구서","보조인력 채용 시 성범죄·아동학대 전력 조회 회신서, 자격 증빙"],"law":[{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제2조 제4호 가목","point":"학교장 관리·감독 아래 학교 안팎에서 하는 수련활동·수학여행 등 현장체험활동은 교육활동"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제8조의2","point":"학교장은 교육활동 안전대책을 점검·확인하고, 위탁 시 업체 인가·허가, 손해배상 보험 가입 여부, 인증 프로그램 여부 등을 확인"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조 제4항·제5항","point":"학교장·인솔교사 즉시 안전조치·즉시 보고. 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사·형사 책임 없음(개정 2024.12.20., 2025.12.2.; 민사는 2025.12.2. 이후 사고부터)"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조의4","point":"학교장은 학교 밖 교육활동에 사전 답사 등 준비 단계부터 인솔교사를 보조하는 인력을 배치할 수 있고, 교육감은 행정·재정 지원. 세부는 시·도 조례(2024.12.20. 신설, 2025.6.21. 시행)"},{"name":"경상북도교육청 현장체험학습 학생안전관리 조례","article":"제2조, 제5조, 제7조, 제8조, 제9조, 제11조","point":"인솔자=인솔교사+보조인력(내부·외부 안전요원, 기타). 100명 이상 수학여행 계획 교육감 사전 보고(3학급 이하 제외), 현장답사, 인솔자 응급처치 등 사전교육, 보조인력 배치, 교육감의 시행보류·취소 권고(시행 2025.12.29.)"},{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제2조, 제6조","point":"18세 미만이 길을 잃는 등으로 보호자에게서 이탈하면 실종아동등. 업무 관계로 사실상 아동을 보호·감독하는 사람 등은 알게 되면 경찰신고체계로 지체 없이 신고"}],"faq":[{"q":"수학여행 중 사고도 학교안전공제로 보상되나요?","a":"된다. 수학여행 등 현장체험활동은 학교안전법상 교육활동이고, 집합·해산 장소와 집 사이 합리적 경로의 왕복 시간도 교육활동 관련 시간이다(법 제2조 제4호, 시행령 제2조 제6호)."},{"q":"사고가 나면 인솔교사가 형사처벌을 받나요?","a":"현행법은 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다한 경우 민사·형사 책임을 지지 않는다고 정한다(제10조 제5항). 민사 면책은 2025.12.2. 이후 사고부터 적용된다. 교육부는 2026.5.28. 면책 범위를 ‘고의·중과실이 아닌 경우’로 넓히는 개정을 추진한다고 발표했으나 아직 현행법은 아니다."},{"q":"보조인력·안전요원은 몇 명 둬야 하나요?","a":"법은 ‘배치할 수 있다’(제10조의4)이고 세부는 조례에 맡긴다. 경북 조례도 ‘필요한 경우 배치할 수 있다’(제9조)로만 정한다. 인천 2025 매뉴얼은 인솔자 학급당 2명 권장, 숙박형 수학여행 중·대규모는 학생 50명당 안전요원 1명 등을 제시했다. 교육부는 2026.5.28. 보조인력 기준을 ‘학생 50명당 1명’에서 ‘학급당 1명’으로 늘리겠다고 발표했다. 경북의 해당 연도 기준은 교육청 매뉴얼로 확인한다."},{"q":"교육청에 바로 보고해야 하는 사고는 어디까지인가요?","a":"법은 교육활동 중 사고·위급상황을 즉시 보고하라고 한다(제10조 제4항). 인천 2025 매뉴얼은 사망·입원, 같은 장소 같은 활동 중 2명 이상 동시 부상으로 병원 치료, 종료 후에도 지속 치료, 동일 원인 유사 증세 2명 이상(식중독 의심), 법정 감염병 의심 진료를 즉시 보고 사안으로 든다. 경북 기준은 교육청 매뉴얼로 확인한다."},{"q":"해외에서 학생이 없어지면 어디에 연락하나요?","a":"현지 가이드와 현지 경찰, 그리고 외교부 영사콜센터(국내 02-3210-0404, 해외 유료 +82-2-3210-0404, 해외 무료 +800-2100-0404, 24시간)에 연락한다. 동시에 학교장에게 보고한다."}],"deep":[{"title":"사고 순간부터 수습까지, 누가 무엇을 하나","body":["현장 책임자: 구조 요청 → 학교장 실시간 보고 → 비상연락망으로 인솔교사 공유 → 병원 동행 교사·상황 보고자 지정.","인솔교사(담임): 학생 피해 파악·돌봄·대피, 추가 위험은 즉시 보고, 병원 동행 시 상태 파악 후 보호자 연락.","학교장: 교육지원청·교육청 즉시 유선 연락 → 비상대책위원회(교장·교감·교무부장·학생부장·학년 학부모 대표) → 언론 창구 일원화 → 잔여 일정 협의 → 학부모·교직원 알림 문자.","교육청: 원스톱 대응팀, 필요시 현장 파견, 사고수습대책본부, 언론 창구 일원화, 교무학사 지원."],"basis":"인천광역시교육청 2025학년도 현장체험학습 운영 매뉴얼 07"},{"title":"보조인력 제도 — 2025년에 새로 생긴 것","body":["2024.12.20. 개정 학교안전법(2025.6.21. 시행) 제10조의4로 학교장은 학교 밖 교육활동에 사전 답사 등 준비 단계부터 인솔교사를 보조하는 인력을 둘 수 있게 됐다. 교육감은 행정·재정 지원을 해야 한다.","경북 조례(2025.7.14. 개정)는 인솔자를 인솔교사와 보조인력으로 나누고, 보조인력을 내부 안전요원·외부 안전요원·기타 보조인력으로 정의했다. 보조인력은 인솔교사의 안내에 따라 운영을 보조하고 안전조치 의무를 준수하도록 노력해야 한다(제9조).","보조인력도 제10조 제5항 면책 대상에 포함된다. 업체가 채용한 인력이라도 학교에 노무를 제공하므로 성범죄·아동학대 전력 조회가 필요하다(인천 매뉴얼)."],"basis":"학교안전법 제10조의4·제10조 제5항; 경상북도교육청 현장체험학습 학생안전관리 조례; 인천 2025 매뉴얼 05"},{"title":"면책은 ‘지침대로 안전조치를 다한 경우’다","body":["현행 제10조 제5항의 면책 조건은 ‘제3항에 따른 안전사고관리 지침에 따라 학생에 대하여 안전조치의무를 다한 경우’다. 따라서 사전 답사, 사전 안전교육, 인원 점검, 임장지도, 사고 시 즉시 안전조치·보고를 했다는 기록이 중요하다.","민사 면책은 2025.12.2. 개정(법률 제21149호) 시행 이후 발생한 사고부터 적용된다(부칙 제2조).","교육부는 2026.5.28. ‘지침을 현저히 위반하는 등 고의·중과실이 있는 경우를 제외하고’ 민사·형사(형법 제268조 포함) 책임을 면제하는 제10조의5 신설안을 국회와 협의해 추진한다고 밝혔다. 법 통과 전까지는 현행 조문이 기준이다."],"basis":"학교안전법 제10조 제5항, 부칙(법률 제21149호) 제2조; 교육부 보도자료(2026.5.28.)"}],"tables":[{"title":"인천 2025 매뉴얼의 인솔자·안전요원 기준(참고)","head":["유형","규모","안전요원 배치"],"rows":[["1일형 현장체험학습","규모 무관","팀당 1명 권장"],["숙박형 수학여행(국내)","소규모(100명 미만)","팀당 1명"],["숙박형 수학여행(국내)","중·대규모(100명 이상)","학생 50명당 1명"],["국외 수학여행","규모 무관","학생 50명당 1명"],["수련활동","규모 무관","학생 50명당 1명"]],"note":"인천광역시교육청 2025학년도 매뉴얼(교육부 2024.12. 안내자료 기반). 인솔자는 학급당 2명 권장, 학교운영위원회 심의 시 1명 가능(1명이면 반드시 교원). 숙박형은 숙박업체별 야간 보조인력 1명 이상 추가. 경북 기준은 경북교육청 매뉴얼 확인. 교육부는 2026.5.28. 보조인력을 학급당 1명으로 확대 발표."},{"title":"즉시 보고 사안(인천 2025 매뉴얼 예시)","head":["구분","기준"],"rows":[["인사 사고","사망·입원(인원 불문), 같은 장소·같은 활동 중 2명 이상 동시 부상으로 병원 치료, 종료 후에도 지속 치료, 기타 학교장 판단"],["식중독 의심","동일 원인 추정 유사 증세 2명 이상 동시 발생"],["감염병 의심","법정 감염병 임상증상 확인되어 병원 진료"]],"note":"보고 순서 예시: 초·중 학교→교육지원청→본청, 고 학교→본청. 먼저 유선 보고 후 사안보고서. 경북 보고 체계는 별도 확인."}],"record":"사안보고서(유선 보고 후 서면)를 교육(지원)청에 내고, 학교안전공제회에 사고발생 통지. 경북은 학생 100명 이상 수학여행 계획을 교육감에게 사전 보고(3학급 이하 제외). 생활기록부 기재 사항은 없다.","sources":[{"title":"학교안전사고 예방 및 보상에 관한 법률(법률 제21149호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"},{"title":"경상북도교육청 현장체험학습 학생안전관리 조례(경상북도조례 제5397호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/자치법규/경상북도교육청 현장체험학습 학생안전관리 조례"},{"title":"2025학년도 초중고 수학여행·수련활동 등 현장체험학습 운영 매뉴얼","publisher":"인천광역시교육청","year":2025,"url":"https://www.ice.go.kr/upload/ice/na/bbs_2102/2025/03/cf637a079b8f0ae9345b79bb6310b459.pdf"},{"title":"안전한 환경 속 배움이 숨 쉬는 「현장체험학습 지원 방안」 발표(보도자료)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=106303&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=020402&opType=N"},{"title":"실종아동등의 보호 및 지원에 관한 법률","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/실종아동등의보호및지원에관한법률"}],"verified":"2026-09-24","uncertain":["경북교육청의 2026학년도 현장체험학습 운영 매뉴얼(안전요원 배치 기준, 즉시 보고 기준·보고처)은 원문 확보 못 함 — 인천 2025 매뉴얼로 대신 적음","교육부 ‘현장체험학습 안내자료(2024.12.)’ 원문은 직접 확인 못 함(인천 매뉴얼이 이를 바탕으로 했다고 밝힘)","교육부 2026.5.28. 발표(면책 확대 제10조의5, 보조인력 학급당 1명, 전담변호사)의 법 개정·시행 여부와 경북 적용 시기 미확인","인솔교사가 실종아동법 제6조 제1항 제6호 신고의무자에 해당하는지는 법문상 명확하지 않음(신고 자체는 누구나 가능)","해외 현장체험학습 중 사고에 대한 학교안전공제 지급 범위(해외 의료비 등)는 확인 못 함"],"related":["safety-accident","runaway-missing","emergency-medical"]},{"id":"fire-earthquake","title":"화재·지진 발생 후 사안 처리","aka":["화재","불났어요","불이야","지진","흔들려요","대피","대피 후 인원 확인","운동장 대피","귀가 조치","조기 하교","임시휴업","보호자 인계","재난 보고","여진","화재경보"],"category":"안전·보건","urgency":"즉시","roles":["수업 중이던 교사","담임","대피유도반·인솔 교사","보건교사","교감","교장(학교안전책임관)","행정실"],"summary":"대피 자체는 훈련대로 하고, 이 문서는 대피 뒤의 '사안 처리'를 다룬다. 핵심은 ①대피 전·후 인원 확인과 못 나온 학생 파악 ②부상자 119·응급처치 ③교육청 보고 ④수업 계속·운동장 대기·귀가 중 결정 ⑤보호자에게 인계하며 알리기 ⑥상황일지와 공제 청구까지다. 귀가는 안전이 명확히 확보됐을 때만, 인계 절차를 지켜서 한다.","first":["대피 장소에서 반별 인원을 즉시 세고, 없는 학생 이름을 교감·본부에 보고한다","부상자는 응급처치하고 119에 알린다(갇힌 사람은 섣불리 구조하지 말고 의식만 확인)","학생을 건물 쪽으로 돌려보내지 않는다 — 여진·재발화 위험","불안해하는 학생 곁에 교사를 붙이고, 진행 상황을 짧게 알려 동요를 막는다","누가 언제 무엇을 결정·지시했는지 한 줄씩 기록을 시작한다"],"steps":[{"stage":"알게 됨·신고","when":"화재 발견 즉시","who":"최초 발견자","what":"'불이야' 외치고 비상벨(발신기)을 누르고, 안전한 곳에서 119 신고","detail":"학교 주소, 불의 진행 정도, 부상자 상황을 알린다. 119에 신고한 전화로는 다른 곳에 걸지 않는다(119가 다시 걸 수 있음).","basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 2-2 화재"},{"stage":"알게 됨·신고","when":"지진 흔들림 중","who":"수업 중 교사","what":"머리 보호·책상 아래로 지시, 출입문 개방","detail":"크게 흔들리는 시간은 길어야 1~2분. 흔들림이 멈춘 뒤 약품·가스·전열기를 차단해 2차 화재를 막는다.","basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 1-8 지진 2단계"},{"stage":"초기 대응","when":"화재경보 직후 / 흔들림 멈춘 뒤","who":"방송 담당·대피유도반","what":"방송·타종·메가폰으로 전교 대피 지시","detail":"지정된 대피경로로 운동장 등 넓은 곳으로. 화재 시 엘리베이터 금지, 연기 속에서는 자세를 낮추고 코·입을 막는다. 지진 대피 중 유리파편 주의.","basis":"같은 매뉴얼 1-8 지진, 2-2 화재"},{"stage":"초기 대응","when":"대피 장소 도착 즉시","who":"담임·인솔 교사","what":"대피 전·후 인원 확인, 대피 못 한 학생 확인","detail":"반별로 세어 없는 학생을 즉시 본부(교감)에 보고한다. 지정 대피 장소 도착 시 유관기관에 통보한다.","basis":"같은 매뉴얼 1-8 지진 2단계, 2-2 화재 2단계"},{"stage":"초기 대응","when":"대피 직후","who":"보건교사·교직원","what":"부상자 응급처치·구조대 인계","detail":"인명피해가 있으면 즉시 119 신고. 붕괴로 갇힌 경우 의식만 확인하고 섣부른 구조는 하지 않는다. 후송 시 담당 교사가 동행하고 병원·치료 상황을 교장에게 수시 보고.","basis":"같은 매뉴얼 1-8 지진 3단계·후속조치"},{"stage":"초기 대응","when":"소방대 도착 전","who":"교장·교직원","what":"초기 소화·방호 조치(화재)","detail":"화재 유형에 맞게 소화기·옥내소화전으로 초기 진압이 가능할 때만 한다. 교장은 소방대 도착까지 경보·대피 관련 조치를 지휘하고, 도착하면 현장지휘대를 지원한다.","basis":"같은 매뉴얼 2-2 화재 3단계"},{"stage":"조사·확인","when":"긴급대피 완료 후","who":"교장(부재 시 상위 직급 순)","what":"대책 회의 소집","detail":"학생 인원과 피해 학생 여부, 건물 손상, 재난 규모(지진은 규모·진앙을 기상청 누리집·안전디딤돌 앱으로 확인)를 파악해 초동 대처와 향후 대책을 정한다.","basis":"같은 매뉴얼 1-8 지진 3단계"},{"stage":"알게 됨·신고","when":"피해 파악 즉시","who":"교장·교감","what":"교육청(교육지원청)에 신속 보고","detail":"피해 내용, 현재 학교 조치, 향후 계획을 보고한다. 인명피해가 있으면 교육청·소방서 보고를 철저히. 피해가 심각하면 주민센터에도 신고.","basis":"같은 매뉴얼 1-8 지진 3단계, 2-2 화재 2단계"},{"stage":"심의·결정","when":"대책 회의","who":"교장","what":"수업 계속·운동장 대기·귀가 조치 결정","detail":"여진이 없거나 시설 점검으로 안전이 확인된 경우에만 정상 수업. 결정 근거는 행정안전부·기상청·교육청·지자체·언론 등의 상황 모니터링을 종합한다.","basis":"같은 매뉴얼 1-8 지진 3단계"},{"stage":"심의·결정","when":"지진 규모 확인 후","who":"교장","what":"규모별 학교 조치 기준 적용(권고)","detail":"진앙 반경 100km 이내 학교에 적용을 권장. 4.0 미만은 정상 운영·대피 여부 학교 판단(학생 대다수가 진동을 느꼈으면 운동장 등 임시대피 권장), 4.0~4.9는 교육활동 중지·대피 실시, 5.0 이상은 교육활동 중지·피해교 임시휴업·대피 및 귀가(명확한 안전 확보 후 인계 절차에 따라). 가능한 높은 단계로 대응하고, 진앙 근처 학교는 1단계라도 가급적 대피.","basis":"같은 매뉴얼 1-8 지진 '지진 규모별 학교 조치 기준'"},{"stage":"조치·이행","when":"결정 직후","who":"교장·교감","what":"임시휴업·수업 단축 시 교육청 즉시 보고","detail":"학교장은 비상재해 등 급박한 사정이 있으면 임시휴업할 수 있고, 지체 없이 관할청에 보고해야 한다. 관할청이 휴업을 명하면 즉시 휴업한다.","basis":"초·중등교육법 시행령 제47조제2항·제3항, 초·중등교육법 제64조"},{"stage":"조치·이행","when":"귀가 결정 시","who":"담임·인솔 교사","what":"보호자 인계 절차에 따라 귀가","detail":"귀가는 명확한 안전 확보가 가능할 때만. 보호자 인계·연락(전화·문자·홈페이지)을 하고, 보호자와 연락이 안 되는 학생은 교내 안전구역 대기 또는 인솔 교사 직접 귀가 인솔 등을 미리 정한다. 인솔 교사는 끝까지 대기.","basis":"같은 매뉴얼 1-8 지진 3단계·후속조치, 2-2 화재 4단계"},{"stage":"조치·이행","when":"결정 직후","who":"교감·담당자","what":"보호자 안내","detail":"정상 수업 여부, 귀가 시각·방법, 돌봄교실·휴업대체프로그램 운영 여부를 알린다. 통신이 끊기면 학생을 운동장에 계속 대기시키고, 복구 후 SNS·홈페이지로 공지한다. 지진은 기상청 문자 수신 시(규모 3.0 이상) 보호자 문자 발송이 기준표에 있다.","basis":"같은 매뉴얼 '재난으로 인한 휴업', 1-8 지진"},{"stage":"조치·이행","when":"대피 이후 계속","who":"담임·상담교사","what":"불안 호소 학생 먼저 돌보기","detail":"진행 상황을 알려 동요를 막고, 불안을 호소하는 학생은 상담교사에게 인계한다. 필요하면 관할 교육지원청 Wee센터에 협조를 요청한다. 장애학생은 지원 인력을 붙여 정서적 안정을 돕는다.","basis":"같은 매뉴얼 1-8 지진 후속조치, 부록 장애 학생 대응 요령"},{"stage":"조치·이행","when":"재난 종료 시까지","who":"교직원","what":"학생 안전관리 지속·위험구역 통제","detail":"여진·재발화 대비, 위험구역 설정과 학생 출입 통제, 가스·상하수도·전기 등 2차 피해 시설 점검.","basis":"같은 매뉴얼 1-8 지진 4단계"},{"stage":"종결·사후","when":"상황 종료 후","who":"교감·담당자","what":"상황일지 작성·결과 보고","detail":"사고, 결정, 행동을 기록한 상황일지와 대응 결과·특이사항을 교육청에 보고한다.","basis":"같은 매뉴얼 1-8 지진 3~4단계"},{"stage":"종결·사후","when":"복구 단계","who":"교장·행정실","what":"응급 복구·수업 대책","detail":"피해시설 응급 복구, 원인 조사와 예방대책 수립, 복구 예산 협의. 화재로 수업이 어려우면 인근 학교 시설 이용·2부제 수업 등을 강구한다.","basis":"같은 매뉴얼 2-2 화재 4단계, 1-8 지진 4단계"},{"stage":"종결·사후","when":"피해 확인 후","who":"행정실","what":"시설 피해 재난복구비(공제급여) 신청","detail":"매뉴얼은 피해 내용 확인 후 한국교육시설안전원에 공제급여를 신청하도록 안내한다.","basis":"같은 매뉴얼 2-2 화재 4단계"},{"stage":"종결·사후","when":"학생·교직원이 다쳤을 때","who":"보호자(청구인)·학교","what":"학교안전공제회에 공제급여 청구","detail":"교육활동 중 사고로 다친 학생·교직원은 학교안전공제회(경북 1899-7752)에 요양급여 등을 청구한다. 공제회는 청구일부터 14일 이내(조사 필요 시 14일 연장)에 지급 여부를 결정한다. 학교는 공제사업을 안내해야 한다. 받을 권리는 3년간 행사하지 않으면 소멸.","basis":"학교안전사고 예방 및 보상에 관한 법률 제41조, 제41조의2, 제65조"},{"stage":"불복·구제","when":"공제급여 결정에 불복할 때","who":"청구인(보호자 등)","what":"심사청구 → 재심사청구 → 소송","detail":"결정이 있음을 안 날부터 90일 이내 시·도 공제회의 학교안전공제보상심사위원회에 심사청구(60일 이내 결정, 1회 1개월 연장). 그 결정에 불복하면 결정서 정본 송달일부터 90일 이내 공제중앙회 재심사위원회에 재심사청구. 재결서 송달일부터 60일 안에 소송을 내지 않으면 재결 내용대로 합의한 것으로 본다.","basis":"학교안전법 제57조, 제59조, 제61조, 제64조"}],"deadlines":[{"what":"임시휴업 시 관할청 보고","limit":"지체 없이(매뉴얼: 결정 즉시)","basis":"초·중등교육법 시행령 제47조제3항"},{"what":"공제회 공제급여 지급 여부 결정","limit":"청구받은 날부터 14일 이내(14일 연장 가능)","basis":"학교안전법 제41조제2항"},{"what":"공제급여 심사청구","limit":"결정이 있음을 안 날부터 90일 이내","basis":"학교안전법 제57조제2항"},{"what":"재심사청구","limit":"심사 결정서 정본 송달일부터 90일 이내","basis":"학교안전법 제61조제2항"},{"what":"재결 뒤 소송","limit":"재결서 정본 송달일부터 60일(넘기면 재결대로 합의 간주)","basis":"학교안전법 제64조"},{"what":"공제급여 받을 권리","limit":"3년간 행사하지 않으면 소멸시효 완성","basis":"학교안전법 제65조"}],"dont":["인원 확인 없이 해산하거나 바로 귀가시키지 않는다","소지품·출석부를 가지러 학생이나 교사가 건물로 다시 들어가지 않는다","보호자 연락이 안 된 학생을 혼자 귀가시키지 않는다","여진·시설 점검 없이 '괜찮아 보인다'고 교실 수업을 재개하지 않는다","붕괴로 갇힌 사람을 교직원이 무리하게 끌어내지 않는다","화재 신고한 전화로 다른 곳에 연락하지 않는다"],"contacts":[{"name":"화재·구조·구급","tel":"119","note":""},{"name":"경찰","tel":"112","note":""},{"name":"대구지방기상청 예보과(경북 관할)","tel":"053-282-0199","note":"매뉴얼 수록 번호 — 지진·기상 상황 문의"},{"name":"경상북도학교안전공제회","tel":"1899-7752","note":"학생·교직원 부상 공제급여"},{"name":"경북교육청 대표(경북교육 콜센터)","tel":"054-1396","note":""}],"forms":["상황일지(사고·결정·행동 기록)","재난 피해 상황 보고(교육청 서식)","보호자 안내 문자·가정통신문(휴업·조기하교·돌봄 운영 안내)","학생 인계 확인 기록","학교안전공제 공제급여 청구서"],"law":[{"name":"초·중등교육법 시행령","article":"제47조(휴업일 등) 제2항·제3항","point":"비상재해 등 급박한 사정이 있으면 학교장이 임시휴업할 수 있고, 지체 없이 관할청에 보고"},{"name":"초·중등교육법","article":"제64조(휴업명령 및 휴교처분)","point":"관할청은 재해 등으로 정상수업이 불가능하면 휴업을 명할 수 있고, 학교장은 지체 없이 휴업"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제41조(공제급여의 청구 및 지급 등)","point":"공제회는 청구일부터 14일 이내 지급 여부 결정, 부지급 시 심사청구 절차 안내"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제57조·제61조·제64조","point":"심사청구(안 날부터 90일) → 재심사청구(송달일부터 90일) → 소송(송달일부터 60일)"}],"faq":[{"q":"지진이 났는데 흔들림이 약했어요. 꼭 운동장으로 대피해야 하나요?","a":"매뉴얼의 규모별 기준(권고)은 4.0 미만이면 정상 운영이지만, 학생 대다수가 진동을 느꼈다면 운동장 등으로 임시대피를 권장합니다. 진앙 근처 학교는 1단계라도 가급적 대피하고, 가능한 높은 단계로 대응하라고 합니다."},{"q":"대피 후 바로 하교시켜도 되나요?","a":"귀가는 명확한 안전 확보가 가능할 때만, 학생 인계 절차를 지켜서 합니다. 보호자 연락이 안 되는 학생은 교내 안전구역 대기나 인솔 교사 직접 인솔 등을 미리 정해 두라고 매뉴얼은 안내합니다."},{"q":"임시휴업은 누가 결정하나요?","a":"학교장이 비상재해 등 급박한 사정이 있을 때 할 수 있고 지체 없이 관할청에 보고해야 합니다. 교육청이 휴업을 명하거나 등하교 시간 조정을 지시하면 따릅니다."},{"q":"통신이 끊겨 학부모에게 연락이 안 돼요.","a":"보호자 불안을 줄이기 위해 학생들을 운동장에 계속 대기시키고, 통신이 복구되면 SNS나 홈페이지로 공지하라고 매뉴얼은 안내합니다."},{"q":"대피하다 다친 학생 치료비는요?","a":"교육활동 중 사고는 학교안전공제회에 공제급여를 청구합니다(경북 1899-7752). 결정에 불복하면 안 날부터 90일 안에 심사청구, 이어 재심사청구를 할 수 있습니다."}],"record":"학교생활기록부 기재 사항 없음. 교육청(교육지원청) 피해 상황 보고, 임시휴업 시 관할청 보고, 상황일지 작성·보관.","deep":[{"title":"대피 뒤 첫 30분: 인원·부상·보고","body":["대피 전·후 인원 확인이 가장 먼저다. 없는 학생 이름이 나오면 구조대에 바로 알릴 수 있어야 한다.","부상자는 응급처치 뒤 구조대에 인계하고, 후송에는 교사가 동행해 교장에게 수시로 보고한다. 동시에 교장(부재 시 상위 직급 순)이 대책 회의를 열고 교육청에 피해 상황을 보고한다."],"basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 1-8 지진·2-2 화재"},{"title":"수업을 계속할지, 돌려보낼지","body":["정상 수업은 여진이 없거나 시설 점검으로 안전이 확인된 경우에만 한다. 판단 근거는 기상청·행정안전부·교육청·지자체 발표를 종합한다.","귀가를 택하면 보호자 인계를 원칙으로 하고, 연락이 안 되는 학생의 대기 장소와 인솔자를 정한다. 휴업하더라도 가정 보호가 어려운 학생을 위해 돌봄교실·휴업대체프로그램 운영 여부를 함께 안내한다(단, 학교 안 안전을 보장하기 어렵거나 휴교 처분이면 미운영)."],"basis":"같은 매뉴얼 1-8 지진, '재난으로 인한 휴업'"},{"title":"지진 규모별 학교 조치 기준(권고)","body":["진앙 반경 100km 이내 교육청·학교에 적용을 권장하는 기준이다. 학교 위치와 여건에 따라 바꿀 수 있지만 가능한 높은 단계로 대응하라고 한다.","규모가 커질수록 근무 형태(전 교직원 근무·대응조직 소집), 상황반 설치(행정실), 교육활동 중지·임시휴업, 대피·귀가, 보호자 문자, 상황일지·보고가 단계적으로 강화된다."],"basis":"같은 매뉴얼 1-8 지진"},{"title":"끝난 뒤: 기록·복구·보상","body":["상황일지와 대응 결과를 보고하고, 피해시설 응급 복구와 원인 조사·예방대책을 세운다. 시설 피해는 한국교육시설안전원 공제급여, 사람 피해는 학교안전공제회 공제급여로 나뉜다.","공제급여 결정에 불복하면 시·도 공제회 심사위원회(안 날부터 90일) → 공제중앙회 재심사위원회(송달일부터 90일) → 소송(재결서 송달일부터 60일) 순서다."],"basis":"같은 매뉴얼 2-2 화재 4단계, 학교안전법 제41조·제57조·제61조·제64조"}],"tables":[{"title":"지진 규모별 학교 조치 기준(권고, 요약)","head":["구분","1단계","2단계","3단계"],"rows":[["지진 규모","4.0 미만(해역 5.0 미만)","4.0~4.9(해역 5.0~5.9) / 지역최대진도 Ⅴ","5.0 이상(해역 6.0 이상) / 지역최대진도 Ⅵ 이상"],["교육 활동","정상 운영","교육 활동 중지","교육 활동 중지·임시휴업(피해 발생교)"],["학생 안전 조치","대피 여부 학교 판단(학생 대다수가 진동을 느꼈으면 운동장 등 임시대피 권장)","대피 실시","대피 및 귀가 실시(반드시 명확한 안전 확보 후 학생 인계 절차에 따라)"],["상황반","미설치","설치 여부 학교장 판단","설치(행정실)"],["보호자 문자","기상청 문자 수신 시(규모 3.0 이상)","조치 사항 안내","조치 사항 안내"],["보고","상황일지 작성·상황 종료 후 특이사항 보고","상황일지 작성·상황 종료 후 특이사항 보고","상황일지 작성·상황 종료 후 특이사항 보고"]],"note":"학교현장 재난유형별 교육·훈련 매뉴얼(교육부·학교안전공제중앙회, 2024.12.) 74쪽. 진앙 반경 100km 이내 적용 권장, 권고사항."}],"sources":[{"title":"학교현장 재난유형별 교육·훈련 매뉴얼 (발행 2024.12.)","publisher":"교육부 교육안전정책과·학교안전공제중앙회","year":2024,"url":"https://www.data.go.kr/data/15114149/fileData.do"},{"title":"초·중등교육법 (시행 2026.9.11.) / 같은 법 시행령 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"학교안전사고 예방 및 보상에 관한 법률 (시행 2025.12.2.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"},{"title":"경상북도학교안전공제회 누리집","publisher":"경상북도학교안전공제회","year":2026,"url":"http
