<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학교 사안 처리 길잡이</title>
<meta name="description" content="학교폭력·아동학대·교육활동 침해·자해 위기·안전사고 등 학교에서 사안이 생겼을 때 교사가 바로 따라 하는 절차, 기한, 연락처, 법령 근거.">
<meta property="og:title" content="학교 사안 처리 길잡이">
<meta property="og:description" content="사안이 터졌을 때 지금 할 일부터. 법령·교육부 매뉴얼 원문 기준 업무 흐름도.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F6F8FB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232456A6'/%3E%3Cpath d='M9 10h9M9 16h14M9 22h7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='10' r='3' fill='%23F5B7AE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --pt:#2456A6; --pt-h:#1C4487; --pt-soft:#EAF0F9; --pt-line:#C8D6EC;
  --bg:#F6F8FB; --card:#FFFFFF; --line:#E3E9F2; --line2:#EEF2F7; --head:#FAFBFD;
  --tx:#1B2A41; --tx2:#334155; --sub:#64748B;
  --ok:#1D7A4D; --ok-bg:#E7F3EC; --warn:#B26B0F; --warn-bg:#FBF0DE; --err:#C0392B; --err-bg:#F9E8E6;
  --r1:8px; --r2:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--pt)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}

/* 앱바 */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--tx);min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.brand small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:8px 13px;border-radius:var(--r1);text-decoration:none;color:var(--tx2);font-size:14px;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--line2)}
.nav a.on{color:var(--pt);background:var(--pt-soft)}

/* 긴급 띠 */
.sos{background:var(--err-bg);border-bottom:1px solid #F0D2CE}
.sos .wrap{display:flex;align-items:center;gap:6px 16px;padding-top:8px;padding-bottom:8px;font-size:13.5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.sos .wrap::-webkit-scrollbar{display:none}
.sos b{color:var(--err);font-weight:700}
.sos a{color:var(--err);font-weight:700;text-decoration:none}
.sos a span{font-weight:500;opacity:.85;margin-left:3px}

/* 홈 상단 */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-top:18px;padding-bottom:16px}
.srow{display:flex;gap:20px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);padding:0 46px 0 88px;font-size:16px;color:var(--tx);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--pt);background:#fff;box-shadow:0 0 0 3px rgba(36,86,166,.12)}
.search label{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--sub);padding-right:14px;border-right:1px solid var(--line)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--sub);cursor:pointer;display:none;font-size:22px;line-height:1}
.stats{display:flex;gap:26px;flex:none}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.5px;color:var(--sub)}
.stat.u b{color:var(--err)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.quick .ql{font-size:13px;font-weight:700;color:var(--sub);margin-right:4px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;min-height:34px}
.quick button:hover{border-color:var(--pt);color:var(--pt);background:var(--pt-soft)}

/* 홈 본문 */
.layout{display:grid;grid-template-columns:232px 1fr;gap:0;min-height:60vh}
.side{border-right:1px solid var(--line);padding:18px 16px 40px 0;background:transparent}
.side h3{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin:0 0 6px;padding-left:10px}
.side .grp{margin-bottom:20px}
.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r1);cursor:pointer;font-size:14.5px;min-height:38px;position:relative}
.side button:hover{background:var(--line2)}
.side button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--pt);color:var(--pt);font-weight:700;border-radius:0 var(--r1) var(--r1) 0}
.side button .n{color:var(--sub);font-size:13px;font-weight:500}
.side button.on .n{color:var(--pt)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.d-즉시{background:var(--err)} .d-당일{background:var(--warn)} .d-며칠{background:#94A3B8}

.main{padding:16px 0 60px 24px;min-width:0}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.listhead h2{font-size:15px;margin:0;font-weight:700}
.listhead h2 span{color:var(--sub);font-weight:500;margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--sub);min-height:34px}
.seg button.on{background:var(--tx);color:#fff}

.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{font-size:12.5px;font-weight:700;color:var(--sub);text-align:left;padding:10px 12px;background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FAFCFF}
.tbl .no{color:var(--sub);font-size:13px;width:56px;padding-left:16px;white-space:nowrap}
.tbl .ti a{font-size:15.5px;font-weight:700;color:var(--tx);text-decoration:none}
.tbl .ti p{margin:2px 0 0;color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl .ti .hit{color:var(--pt);font-size:13px;margin-top:3px}
.tbl .fst{color:var(--tx2);font-size:13.5px;width:230px;min-width:200px}
.tbl .dl{font-size:13px;font-weight:700;color:var(--err);width:170px;min-width:150px}
.tbl .dl small{display:block;font-weight:500;color:var(--sub)}
.tbl .sc{color:var(--sub);font-size:13px;white-space:nowrap}
.empty{padding:34px 16px;color:var(--sub);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2)}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;line-height:1.5;white-space:nowrap}
.u-즉시{background:var(--err-bg);color:var(--err)}
.u-당일{background:var(--warn-bg);color:var(--warn)}
.u-며칠{background:var(--line2);color:var(--sub)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);background:var(--card);white-space:nowrap}

/* 상세 */
.dbar{background:var(--card);border-bottom:1px solid var(--line)}
.dbar .wrap{display:flex;align-items:center;gap:10px;height:52px}
.dbar .lb{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.dbar select{height:36px;border:1px solid var(--line);border-radius:var(--r1);padding:0 10px;background:var(--card);min-width:0;max-width:320px;font-size:14px}
.dbar .pn{display:flex;gap:6px;margin-left:auto;align-items:center}
.dbar .pos{font-size:13px;color:var(--sub);margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r1);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:#C3CEDF}
.btn.dark{background:var(--tx);border-color:var(--tx);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}

.dhead{padding:26px 0 18px;display:flex;gap:24px;align-items:flex-start}
.dhead .l{flex:1;min-width:0}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.dhead .no{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin-right:4px}
.dhead h1{font-size:30px;margin:0 0 8px;letter-spacing:-.025em;line-height:1.3;font-weight:800}
.dhead .sum{font-size:16px;margin:0;color:var(--tx2);max-width:820px}
.dhead .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.kpis{display:flex;flex-wrap:wrap;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:22px;overflow:hidden}
.kpi{padding:12px 20px;border-right:1px solid var(--line2);min-width:110px}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--sub)}
.kpi.w b{color:var(--warn)}

.now{background:var(--card);border:1px solid #F0D2CE;border-radius:var(--r2);display:grid;grid-template-columns:150px 1fr;overflow:hidden;margin-bottom:26px}
.now .h{background:var(--err-bg);padding:16px 18px;color:var(--err);font-weight:800;font-size:15px;line-height:1.4}
.now .h small{display:block;font-weight:500;font-size:12.5px;margin-top:4px;color:#9A3A2E}
.now ol{margin:0;padding:12px 18px 12px 18px;list-style:none;counter-reset:n;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px}
.now li{counter-increment:n;padding:6px 0 6px 30px;position:relative;font-weight:600;font-size:15px;line-height:1.5}
.now li::before{content:counter(n);position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--err);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

.sec{margin:0 0 30px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
.sec h2 + p,.sech p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--sub);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:2px solid}
.lg-done{border-color:var(--ok)!important;background:var(--ok-bg)}
.lg-now{border-color:var(--pt)!important;background:var(--pt-soft)}
.lg-wait{border-color:#CBD5E1!important;background:#fff}

/* 업무 흐름도 */
.flowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.flowscroll{overflow-x:auto;position:relative}
.flow{position:relative;display:grid}
.flow .ch{background:var(--head);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--sub)}
.flow .ch b{display:block;color:var(--tx);font-size:14px}
.flow .lh{border-right:1px solid var(--line);border-bottom:1px solid var(--line2);padding:12px;font-size:13px;font-weight:700;color:var(--tx2);background:var(--head);display:flex;align-items:center}
.flow .cell{border-bottom:1px solid var(--line2);border-right:1px dashed var(--line2);padding:12px 12px 12px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:76px}
.flow .cell.last{border-right:0}
.flow .corner{background:var(--head);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--sub);font-weight:700}
.node{display:block;position:relative;z-index:2;background:#fff;border:1.5px solid #CBD5E1;border-radius:var(--r1);padding:7px 10px 8px;cursor:pointer;text-align:left;width:100%;font-size:13.5px;line-height:1.4;font-weight:600;color:var(--tx)}
.node:hover{border-color:var(--pt)}
.node .nh{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:2px;letter-spacing:.03em}
.node .nt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node.done{border-color:var(--ok);background:var(--ok-bg)}
.node.done .nh span{color:var(--ok)}
.node.now{border-color:var(--pt);border-width:2px;background:var(--pt-soft);box-shadow:0 0 0 3px rgba(36,86,166,.12)}
.node.now .nh span{color:var(--pt)}
.node.sel{outline:2px solid var(--tx);outline-offset:2px}
.flow svg.arrows{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.ndetail{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 260px;gap:0}
.ndetail .nd-l{padding:16px 20px}
.ndetail .nd-r{padding:16px 20px;border-left:1px solid var(--line2);background:var(--head);font-size:13.5px}
.ndetail .k{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.03em}
.ndetail h3{margin:3px 0 6px;font-size:17px;line-height:1.45}
.ndetail .det{color:var(--tx2);font-size:14.5px;margin:0}
.ndetail .nd-r dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:6px 8px}
.ndetail .nd-r dt{color:var(--sub);font-weight:600}
.ndetail .nd-r dd{margin:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600;cursor:pointer;width:max-content;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--pt)}

.deep details{border-top:1px solid var(--line2)}
.deep details:first-child{border-top:0}
.deep summary{cursor:pointer;list-style:none;padding:14px 44px 14px 18px;font-weight:700;font-size:15.5px;position:relative;display:flex;gap:10px;align-items:baseline}
.deep summary::-webkit-details-marker{display:none}
.deep summary::after{content:"";position:absolute;right:20px;top:21px;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg)}
.deep details[open] summary::after{transform:rotate(-135deg);top:24px}
.deep .dn{font-size:12px;font-weight:800;color:var(--pt);font-variant-numeric:tabular-nums}
.deep .db{padding:0 22px 16px 44px;color:var(--tx2);font-size:15px}
.deep .db p{margin:0 0 10px}
.deep .db p.bs{font-size:12.5px;color:var(--sub);margin:0}
.xt{margin-bottom:14px;overflow:hidden}
.xth{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.xtw{overflow-x:auto}
.xt table.t{min-width:560px}
.xt table.t td{font-size:14px}
.xt table.t td.k0{font-weight:700;white-space:nowrap}
.xtn{padding:10px 16px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line2);background:var(--head)}

/* 목록형 흐름 */
.steps{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2)}
.pgrp{padding:10px 16px 4px;font-size:12.5px;font-weight:800;color:var(--pt);background:var(--head);border-top:1px solid var(--line2)}
.pgrp:first-child{border-top:0;border-radius:var(--r2) var(--r2) 0 0}
.step{display:grid;grid-template-columns:34px 1fr;gap:2px 8px;padding:12px 16px 12px 12px;border-top:1px solid var(--line2)}
.step input{width:22px;height:22px;margin:1px auto 0;accent-color:var(--pt);cursor:pointer}
.step .sn{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.03em}
.step .who{font-size:12.5px;font-weight:700;color:var(--tx2);background:var(--line2);border-radius:5px;padding:1px 7px;margin-left:6px}
.step .what{font-size:15px;font-weight:600;margin-top:3px}
.step .det{font-size:14px;color:var(--tx2);margin-top:3px}
.step .bs{font-size:12.5px;color:var(--sub);margin-top:3px}
.step.done .what,.step.done .det{color:var(--sub);text-decoration:line-through;text-decoration-color:#AAB6C8}
.step.now{background:#F7FAFE}
.step.now .sn{color:var(--pt)}

.cols{display:grid;grid-template-columns:1fr 330px;gap:32px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:11px 16px;border-top:1px solid var(--line2);vertical-align:top}
table.t tr:first-child th,table.t tr:first-child td{border-top:0}
table.t thead th{font-size:12.5px;color:var(--sub);background:var(--head);font-weight:700}
table.t td.lim{font-weight:700;color:var(--err)}
table.t .bs{display:block;font-size:12.5px;color:var(--sub);font-weight:400;margin-top:2px}
table.t td.due{font-weight:700;white-space:nowrap}
table.t td.due small{display:block;font-weight:500;color:var(--sub);white-space:normal}
.calc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--head);font-size:13.5px}
.calc b{font-weight:700}
.calc input{height:36px;border:1px solid var(--line);border-radius:var(--r1);padding:0 10px;background:#fff}
.calc .hint{color:var(--sub);font-size:12.5px}

.dont{padding:6px 18px}
.dont ul{margin:0;padding:0;list-style:none}
.dont li{margin:0;padding:10px 0 10px 28px;position:relative;border-top:1px solid var(--line2)}
.dont li:first-child{border-top:0}
.dont li::before{content:"";position:absolute;left:2px;top:15px;width:14px;height:14px;background:linear-gradient(45deg,transparent 43%,var(--err) 43%,var(--err) 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--err) 43%,var(--err) 57%,transparent 57%)}
details.faq{border-top:1px solid var(--line2)}
details.faq:first-child{border-top:0}
details.faq summary{cursor:pointer;padding:13px 18px 13px 44px;font-weight:600;list-style:none;position:relative}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"Q";position:absolute;left:18px;color:var(--pt);font-weight:800}
details.faq summary::after{content:"";position:absolute;right:18px;top:20px;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);transition:transform .15s}
details.faq[open] summary::after{transform:rotate(-135deg);top:23px}
details.faq .a{padding:0 18px 14px 44px;font-size:14.5px;color:var(--tx2)}
.plain{padding:12px 18px}
.plain ul{margin:0;padding-left:18px}
.plain li{margin:5px 0}
.law div{padding:12px 16px;border-top:1px solid var(--line2)}
.law div:first-child{border-top:0}
.law b{font-size:14.5px}
.law p{margin:3px 0 0;font-size:14px;color:var(--tx2)}
.note{background:var(--warn-bg);border-radius:var(--r2);padding:12px 18px;font-size:14px}

<script>
const DATA = {"updated":"2026-09-24","cases":[{"id":"child-abuse","title":"아동학대 의심 신고 (가정 내 학대·방임)","aka":["아동학대","학대 의심","방임","멍 자국","맞고 와요","집에 가기 싫대요","밥을 못 먹어요","가정폭력","112 신고","아동학대전담공무원","신고의무자","보호자가 때려요","씻지 않고 와요","연락 두절"],"category":"학생 보호·위기","urgency":"즉시","roles":["알게 된 교직원(담임·교과·상담·보건교사 등)","교감","교장","아동학대 업무 담당자","Wee클래스(상담교사)"],"summary":"교원은 아동학대처벌법상 신고의무자라서 직무 중 학대를 알게 되거나 '의심만 되어도' 112나 시군구(아동학대전담공무원)에 즉시 신고해야 한다. 확신이 들 때까지 기다리지 말 것, 보호자에게 먼저 묻지 말 것, 아이에게 캐묻지 말 것이 핵심이다.","first":["아이가 지금 위험한지부터 본다. 다쳤거나 집에 보내면 위험하면 학교 안에서 안전하게 보호한다","112 또는 시군구 아동학대 긴급전화(아동학대전담공무원)에 바로 신고한다. 학교(학교장) 명의로도 신고할 수 있다","학교장에게 보고한다. 보고만 하고 끝내면 신고로 인정되지 않는다","보호자(학대 의심자일 수 있음)에게는 신고 사실이나 내용을 알리지 않는다","본 것·들은 것을 아이 말 그대로, 날짜·시간과 함께 적어 둔다"],"steps":[{"when":"징후를 알아챈 즉시","who":"알게 된 교직원","what":"학대 의심 징후 확인","detail":"멍·상처, 굶주림·위생 불량, 이유 없는 결석이 이어지거나 2일 이상 연락이 안 됨, 보호자가 정당한 이유 없이 아동 면담을 거부, 아이가 학대를 직접 말함, 가정폭력 노출 등은 모두 신고 사유가 될 수 있다. '확실'할 필요는 없고 의심이면 충분하다.","basis":"아동학대처벌법 제10조제2항제20호; 교육부 가이드북 4판 62쪽"},{"when":"즉시","who":"알게 된 교직원","what":"아이의 안전 확보","detail":"심각한 위해가 우려되면 경찰·아동학대전담공무원이 올 때까지 학교에서 보호한다. 성학대가 의심되면 증거 보존을 위해 씻기거나 옷을 갈아입히지 않는다.","basis":"교육부 가이드북 4판 58·63쪽"},{"when":"즉시","who":"알게 된 교직원(또는 학교장 명의)","what":"112 또는 시군구 아동학대전담공무원에게 신고","detail":"학교명, 아이의 현재 상태(안전·응급 여부), 인적사항, 의심되는 사람(몰라도 신고 가능), 형제자매 유무를 말한다. 조사 시간·장소·출입 동선 등 비밀 보장 요청을 함께 할 수 있다. 회신 번호는 학교 대표번호를 줘도 된다.","basis":"아동학대처벌법 제10조제2항"},{"when":"신고 직후","who":"신고자","what":"학교장 보고","detail":"학교장에게 보고하되, 관계자 최소 인원 외에는 아이·신고자 정보를 공유하지 않는다.","basis":"교육부 가이드북 4판 58쪽"},{"when":"신고 당일","who":"학교장(업무 담당자)","what":"교육(지원)청 사안보고","detail":"공문은 비공개(6호)·목록 비공개·열람 불가로 처리해 신고자·피해아동이 드러나지 않게 한다. 가이드북 \u003c서식2>(사안보고 공문), \u003c서식3>(사안보고서) 참고.","basis":"교육부 가이드북 4판 64쪽"},{"when":"현장 출동·조사 때","who":"학교","what":"조사 협조","detail":"아이가 편하게 말할 수 있는 독립된 공간을 내준다. 다른 학생 눈에 띄지 않게 한다(복도에서 손잡고 기다리는 식 금지). 담임·상담교사는 필수 면담 대상이다. 아이가 원하면 담임·상담교사가 동석할 수 있으나 진술에 끼어들면 안 된다.","basis":"아동학대처벌법 제11조의2제1항; 가이드북 4판 58·63·124쪽"},{"when":"조사 이후","who":"담임·상담교사","what":"아이를 평소처럼 대하고 경과 관찰","detail":"큰일 난 것처럼 대하지 않는다. 재학대가 의심되면 다시 112에 신고한다. 필요하면 Wee클래스·Wee센터로 연계한다.","basis":"가이드북 4판 63·71쪽"},{"when":"보호조치가 내려지면","who":"학교장·담임","what":"학적·출결 처리와 비밀 유지","detail":"보호시설 보호 등으로 결석하면 지자체 협조 공문에 따라 출석을 인정한다. 비밀전학 요청이 오면 절차를 따르고, 전학 간 학교 등은 학대행위자인 친권자를 포함해 누구에게도 알려주지 않는다.","basis":"아동학대처벌법 제35조제3항; 가이드북 4판 71·126쪽"},{"when":"변동이 생기면 수시","who":"학교장(업무 담당자)","what":"교육(지원)청에 추가 보고","detail":"최초 신고·보고 후 달라진 사항은 수시로 보고한다.","basis":"가이드북 4판 58쪽"},{"when":"신고 후 보호자 항의·협박이 오면","who":"학교장","what":"신고한 교원 보호","detail":"신고자가 누구인지 절대 알려주지 않는다(신고자도 스스로 밝힐 필요 없음). 학교에서 감당하기 어려운 민원은 교육지원청으로 넘긴다. 협박 등은 교육활동 침해로 처리할 수 있다.","basis":"아동학대처벌법 제10조제3항·제10조의2; 교원지위법 제19조·제20조"}],"deadlines":[{"what":"수사기관·시군구 신고","limit":"직무 중 알게 되거나 의심이 든 즉시","basis":"아동학대처벌법 제10조제2항"},{"what":"신고받은 기관의 조사·수사 착수","limit":"정당한 사유 없으면 즉시","basis":"아동학대처벌법 제10조제4항"}],"dont":["보호자에게 먼저 전화해 '혹시 집에서…' 하고 확인하지 않는다 — 증거 조작·은폐, 아이 위험이 커진다","학교장·교육청에 보고하거나 아동보호전문기관에 상담만 하고 끝내지 않는다 — 수사기관·시군구에 신고한 게 아니면 신고로 인정되지 않는다","아이에게 '누가 때렸어?', '엄마가 그랬지?'처럼 대상을 정해 묻거나 '학대'라는 말을 쓰지 않는다 — 조사관 역할 금지, 진술이 오염된다","확실해질 때까지 지켜보다가 늦게 신고하지 않는다 — 지체하면 증거가 사라지고 진술 신빙성이 떨어진다","신고한 사람이 누구인지 동료·보호자에게 말하거나 공문에 드러나게 쓰지 않는다 — 형사처벌 대상","언론 인터뷰에 혼자 응하지 않는다 — 창구는 관리자로 한정"],"contacts":[{"name":"경찰(아동학대 신고)","tel":"112","note":"긴급 시 우선"},{"name":"시군구 아동학대 긴급전화(아동학대전담공무원)","tel":"","note":"학교 소재 시군구 번호를 미리 확인해 둘 것. 신고처는 시·도, 시·군·구, 수사기관"},{"name":"보건복지상담센터","tel":"129","note":"제도·절차 문의용 상담 전화(신고는 112·시군구)"},{"name":"장애인권익옹호기관","tel":"1644-8295","note":"장애아동 학대 의심 시 신고처(수사기관 112도 가능)"}],"forms":["아동학대 사안보고 공문(예시) — 교육부 가이드북 4판 \u003c서식2>","아동학대 사안보고서(예시) — \u003c서식3>","출석 인정 협조 요청 내부결재 기안문 — \u003c서식5>","의견 제출서(학교→지자체) — \u003c서식7>","비밀전학 관련 서식 — \u003c서식11>~\u003c서식15>","관찰·면담 기록(날짜·시간·아이가 한 말 그대로·본 상처 위치와 모양)"],"law":[{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제2항제20호(신고의무)","point":"초·중등학교의 장과 그 종사자는 직무 중 아동학대범죄를 알게 되거나 의심이 있으면 시·도, 시·군·구 또는 수사기관에 즉시 신고해야 한다"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제3항(신고인 비밀)","point":"누구든지 신고인의 인적사항이나 신고인임을 알 수 있는 사실을 알리거나 공개하면 안 된다 — 위반 시 3년 이하 징역 또는 3천만원 이하 벌금(제62조제2항)"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조의2(불이익조치 금지)·제62조의2","point":"신고를 이유로 한 불이익조치 금지. 파면·해임 등 신분상실은 2년 이하 징역 또는 2천만원 이하 벌금 등"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조의3(신고자 보호조치)","point":"특정범죄신고자 등 보호법 제7조~제13조 준용(인적사항 기재 생략, 신변안전조치 등)"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제63조제1항제2호(과태료)","point":"정당한 사유 없이 신고하지 않은 신고의무자에게 1천만원 이하 과태료. 기관이 아니라 사람 단위로 부과"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제11조의2제1항(조사)","point":"아동학대전담공무원은 관계인에게 출석·진술·자료제출을 요구할 수 있고 관계인은 정당한 사유 없으면 따라야 한다"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제35조(비밀엄수)","point":"신고의무자는 직무상 알게 된 비밀을 누설하면 안 되고, 학교 교직원은 피해아동의 취학·진학·전학 사실을 학대행위자인 친권자를 포함해 누구에게도 누설하면 안 된다"},{"name":"아동복지법","article":"제26조제3항(신고의무자 교육)","point":"신고의무자가 소속된 기관의 장은 소속 신고의무자에게 신고의무 교육을 실시하고 결과를 제출해야 한다"}],"faq":[{"q":"확실하지 않은데 신고해도 되나요? 아니면 틀리면 어떡하죠?","a":"법은 '알게 된 경우나 그 의심이 있는 경우' 즉시 신고하라고 정한다. 학대 판단은 아동학대전담공무원·경찰이 한다. 교사는 의심만으로 신고하면 된다."},{"q":"학교장이나 교육청에 보고했으면 신고한 건가요?","a":"아니다. 학교장·교육청 보고, 아동보호전문기관 상담만으로는 신고로 인정되지 않는다. 반드시 112나 시군구(아동학대전담공무원)에 신고해야 한다."},{"q":"보호자에게 먼저 사정을 물어봐도 되나요?","a":"학대행위자가 보호자일 수 있어 신고 내용을 미리 알리면 증거가 조작·은폐될 수 있다. 알리지 않는다."},{"q":"학생이 신고를 취소해 달라고 해요.","a":"접수된 신고는 철회할 수 없고, 아이·신고자 뜻과 관계없이 조사가 진행된다. 교사에게 신고의무가 있다는 점과, 신고를 통해 아이와 가족이 지원받을 수 있다는 점을 설명한다."},{"q":"퇴근 후 이웃집 아이 학대를 봤어요. 이것도 신고의무인가요?","a":"신고의무는 직무를 수행하면서 알게 된 경우에 생긴다. 직무와 무관하게 본 것은 신고할 수 있지만(누구든지 신고 가능) 의무는 아니다."},{"q":"경찰이 참고인으로 출석하라는데 꼭 가야 하나요?","a":"참고인 조사는 강제가 아니다. 부담되면 진술서 제출, 방문·전화 조사로 대신할 수 있다. 다만 아동학대전담공무원의 조사(출석·진술·자료제출 요구)에는 정당한 사유 없으면 따라야 한다."},{"q":"신고했다가 보호자가 찾아와 누가 신고했냐고 따집니다.","a":"학교는 신고자를 절대 알려주면 안 되고 신고자도 스스로 밝힐 필요가 없다. 신변 위협이 있으면 경찰서에 신변안전조치를 요청할 수 있고, 보호자의 협박은 교육활동 침해로 처리할 수 있다."},{"q":"학생의 개인정보를 경찰·지자체에 넘기면 개인정보보호법 위반 아닌가요?","a":"신고할 때 아동·의심자 인적사항과 상황을 제공하는 것은 개인정보보호법 위반이 아니라고 교육부 가이드북이 안내한다."}],"record":"사안보고 공문은 비공개 6호·목록 비공개·열람 불가로 처리한다. 보호시설 입소 등으로 인한 결석은 지자체 협조 공문에 따라 출석 인정(학교생활기록부 기재요령 출결상황 참고). 학교는 매년 소속 교직원에게 신고의무자 교육을 하고 결과를 제출한다(보건복지부 제작·승인 콘텐츠만 인정).","sources":[{"title":"아동학대범죄의 처벌 등에 관한 특례법 (시행 2026.8.4., 법률 제21321호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"},{"title":"아동복지법 (시행 2026.9.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동복지법"},{"title":"아동학대 예방 및 대처요령 교육부문 가이드북 4판 (발행 2024.12.)","publisher":"교육부·유스메이트 아동·청소년문제연구소(교육부 2024 정책연구)","year":2024,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/AC1D0C24-4393-F719-8DFF-64E35865C917.pdf"}],"verified":"2026-09-24","uncertain":["경북 각 시군구 아동학대 긴급전화 번호는 지역마다 달라 넣지 않았다. 학교 소재 시군구 번호를 따로 확인해야 한다","미신고 과태료의 차수별 실제 부과액(시행령 별표2)은 원문 표를 열어 확인하지 못했다. 법률상 상한 '1천만원 이하'만 적었다","교육부 가이드북 4판은 2024년 12월 발행이다. 이후(2025~2026) 개정판이 있는지는 확인하지 못했다. 그 뒤 바뀐 법 조문은 법령 원문 기준으로 적었다","교육(지원)청 사안보고 기한(몇 시간 이내 등)은 가이드북에 숫자로 나와 있지 않다. 경북교육청 자체 지침이 있으면 그걸 따른다"],"related":["sexual-violence","absence-unknown","suicide-risk"]},{"id":"school-violence","title":"학교폭력 인지·신고·사안처리","aka":["학폭","학교폭력","때렸어요","맞았어요","괴롭힘","왕따","따돌림","욕했어요","돈 뺏겼어요","학폭 신고","117","분리 조치","학교장 자체해결","심의위원회","학폭 생기부","행정심판"],"category":"학생 간 사안","urgency":"즉시","roles":["처음 알게 된 교직원","담임","학교폭력 책임교사","전담기구(교감 총괄)","보건교사","전문상담교사","학교장","교육지원청 학교폭력 제로센터·전담조사관","교육지원청 학교폭력대책심의위원회"],"summary":"학교 안팎에서 학생을 대상으로 일어난 폭행·따돌림·사이버폭력·성폭력 등은 모두 학교폭력이다. 알게 된 교사는 사소해 보여도 즉시 학교장에게 보고하고, 학교는 접수대장 기록 → 분리·2호 조치 → 48시간 내 교육지원청 보고 → 전담조사관 또는 전담기구 조사 → 전담기구 심의(학교장 자체해결 여부) → 교육지원청 심의위원회 → 교육장 조치 결정·통보 → 조치 이행·생기부 기재 → (불복 시) 행정심판·행정소송·집행정지 → 졸업 시 삭제 순으로 처리한다. 심의위원회 의결 전까지 '가해학생·피해학생'으로 단정하지 않고, 축소·은폐하거나 화해를 서두르지 않는다.","first":["다친 학생이 있으면 보건실 응급처치, 위급하면 119부터 부른다","관련 학생들을 떼어 놓고, 피해 학생을 안정시킨다(대질·한자리 화해 금지)","학교장(책임교사)에게 바로 알리고 신고접수대장에 기록되게 한다","양쪽 보호자에게 사실을 알린다(교원이 알게 된 경우 보고·통지 의무)","성범죄가 섞여 있으면 피해자 의사와 관계없이 112 또는 117에 즉시 신고한다"],"steps":[{"stage":"알게 됨·신고","when":"① 감지·인지 즉시","who":"알게 된 교직원","what":"학교장에게 보고하고 해당 학부모에게 알린다","detail":"사소한 폭력이라도 신고한 것은 접수한다(신고접수대장은 은폐 여부를 판단하는 기초자료). 다른 학생 앞에서 피·가해 사실을 확인하지 말고 개별로 확인한다. 진술이 엇갈려도 추궁·강요하지 말고 객관적 증거를 확인한다.","basis":"학교폭력예방법 제20조제4항, 제14조제4항"},{"stage":"초기 대응","when":"① 인지 즉시","who":"현장 교직원·보건교사","what":"안전조치와 증거 보존","detail":"가벼운 상처는 보건실, 심하면 병원 이송, 위급하면 119. 보호자 연락, 병원 이송 시 동승. 현장의 증거물은 섞거나 없애지 말고, 응급조치 내용은 빠짐없이 기록한다. 목격 학생은 안전한 곳에서 진정시키고 언급 자제를 당부한다.","basis":"가이드북 유형별 초기대응 요령"},{"stage":"알게 됨·신고","when":"② 신고 접수 즉시","who":"책임교사(전담기구)","what":"신고접수대장 기록, 학교장 보고·담임 통보, 보호자 통보","detail":"117 통보·교사·학생·보호자 신고 등 모든 경로를 접수한다. 관련 학생 보호자에게 즉시 통보하고 통보 일자·방법을 기록. 최초 학생 확인서(육하원칙)를 받는다. 다른 학교 학생이 관련되면 그 학교에 알린다(공문 '비공개').","basis":"가이드북 신고 및 접수 절차, 양식 1-1·2-1"},{"stage":"알게 됨·신고","when":"② 인지 즉시","who":"학교장·교직원","what":"성범죄가 포함되면 수사기관(112, 117) 신고","detail":"피해학생 측 의사와 관계없이 신고한다. 117에는 '신고'라고 분명히 밝힌다. SPO(학교전담경찰관)와의 '상담'은 신고로 보지 않는다.","basis":"청소년성보호법 제34조제2항"},{"stage":"초기 대응","when":"③ 인지 후 24시간 이내","who":"학교장(전담기구·소속교원 협의)","what":"가해자(교사 포함)와 피해학생 분리","detail":"피해학생 분리 의사를 확인서로 받고, 분리 대상·기간·공간을 정한다. 최대 7일(시행 당일 포함, 주말·공휴일도 기간에 포함). 학교 안 별도 공간을 쓰고 다른 반으로 옮기지 않는다(학급교체가 아님). 학습 자료·원격수업 제공. 학교 밖(가정·위센터)에서 분리하면 출석인정 결석 처리 가능. 예외: 피해학생 반대, 교육활동 중이 아님, 경미 사안(자체해결 4요건 충족), 긴급조치로 이미 분리됨. 쌍방이 서로 분리를 요청하면 상호 분리한다.","basis":"학교폭력예방법 제16조제1항 단서, 시행령 제17조의2, 양식 1-2"},{"stage":"초기 대응","when":"③ 인지 즉시(지체 없이)","who":"학교장","what":"가해학생에게 제2호(접촉·협박·보복행위 금지) 조치","detail":"의도적 접촉(인터넷·휴대전화 포함)을 막는 것이지 공간 분리가 아니다. 이 제2호는 생활기록부 기재 대상이 아니다. 분리·제2호 조치 사실을 관련 학생과 보호자에게 통보한다.","basis":"학교폭력예방법 제17조제4항"},{"stage":"초기 대응","when":"④ 인지 후 48시간 이내","who":"책임교사","what":"교육(지원)청에 사안접수 보고","detail":"조사관 배정 요청 여부와 학생 조사 가능 시간·장소를 적는다. 불가피하면 유·무선 선보고 후 공문. 성폭력 등 중대 사안은 유선으로 별도 보고.","basis":"가이드북, 양식 1-3"},{"stage":"초기 대응","when":"⑤ 사안 초기~심의위원회 의결 전","who":"학교장","what":"필요 시 긴급조치","detail":"피해학생이 긴급보호를 요청하면 제1호(심리상담)·제2호(일시보호)·제3호(치료·요양)·제6호(그 밖의 보호)를 하고 심의위원회에 즉시 보고. 가해학생은 긴급하다고 인정되면 제1·3·5·6·7호를 우선 부과(제17조제5항), 피해 측이 요청하면 전담기구 심의를 거쳐 제6호·제7호(제17조제6항). 가해 긴급조치는 심의위원회에 즉시 보고해 추인을 받고 가해학생·보호자에게 통지. 출석정지·학급교체 전에는 해당 학생·보호자 의견을 듣는다. 거부·회피하면 초·중등교육법 제18조로 징계.","basis":"학교폭력예방법 제16조제1항, 제17조제5항~제7항·제10항, 시행령 제21조, 양식 2-3"},{"stage":"조사·확인","when":"⑥ 접수 보고 뒤","who":"학교장","what":"조사 주체 결정: 전담조사관 배정 요청 또는 전담기구 자체조사","detail":"교육지원청 학교폭력 제로센터가 조사관을 배정한다(사안에 따라 1인 또는 2인 이상). 사안 특성·피해학생 보호·관계 개선 가능성을 보아 학교 자체 조사가 적합하다고 판단하면 전담기구가 조사한다.","basis":"학교폭력예방법 제11조의2제4항, 제14조제4항"},{"stage":"조사·확인","when":"⑦ 조사 기간","who":"전담조사관(또는 전담기구)","what":"사안조사: 면담·확인서·증거 수집","detail":"학교 방문 전 일정·장소를 협의하고, 관련 학생·보호자 면담, 추가 학생 확인서, 목격자(학생·담임) 면담, 설문, 증거(메시지·SNS 캡처·사진·동영상·녹음·진단서) 수집. 가능한 한 수업시간 외, 관련 학생은 분리 조사. 장애학생은 특수교육 전문가, 이주배경학생은 통역을 참여시킨다. 면담 녹취는 사전 동의를 받는 것이 바람직.","basis":"학교폭력예방법 제11조의2, 가이드북 사안조사 절차"},{"stage":"조사·확인","when":"⑦ 조사 기간","who":"책임교사·담임","what":"조사 협조","detail":"독립된 면담 공간 제공, 학생 분리 조사 시간 확보, CCTV 열람 협조, 학생 확인서 원본은 학교가 관리하고 사본을 조사관에게 제공(암호·보안문서), '학교폭력 전담조사관 자료관리대장' 작성. 교원 동석 여부는 학교장이 판단. 성 사안·장애·위기학생 등 민감 정보는 사전 공유.","basis":"가이드북 조사관 사안조사 시 학교의 역할, 양식 2-7"},{"stage":"조사·확인","when":"⑧ 조사 완료","who":"조사관 또는 전담기구","what":"사안조사 보고서 작성·보고","detail":"육하원칙으로 쓰고, 확인이 어려운 쟁점은 양측 주장을 모두 적는다. 조사관은 전담기구와 제로센터에 보고하고, 제로센터 사례회의에서 조사의 완결성·객관성을 검토해 보완조사를 지시할 수 있다.","basis":"양식 2-4, 가이드북 사례회의"},{"stage":"심의·결정","when":"⑨ 인지 후 14일 이내","who":"전담기구","what":"학교장 자체해결 부의 여부 심의","detail":"4요건 모두 충족을 서면 확인(①2주 이상 치료 진단서 없음 ②재산 피해 없음·즉시 복구·복구 약속 ③지속적이지 않음 ④신고·진술·자료제공에 대한 보복 아님) + 피해학생·보호자의 심의위원회 미개최 서면 확인. 구성원 과반수 참석·과반수 찬성. 피해학생 1명·가해학생 여러 명이면 모두에 대해 동의해야 가능. 자체해결을 강요하지 않는다. 14일 안에 조사·심의·결정 또는 심의위원회 요청까지 마치며, 학교장이 7일 이내 연장할 수 있다.","basis":"학교폭력예방법 제13조의2, 양식 3-1·3-2"},{"stage":"심의·결정","when":"⑩-가 자체해결로 끝나는 경우","who":"학교장·책임교사","what":"자체해결 결재·교육(지원)청 보고·보호자 통보, 관계회복 지원","detail":"사안조사 보고서·전담기구 심의결과 보고서·동의서를 첨부해 결과 보고. 가해학생 우선 출석정지를 했었다면 직권 취소하고 출석으로 인정 가능. 이후 심의위원회 요청은 '재산 피해 복구 약속 불이행' 또는 '조사 때 확인되지 않은 사실 추가 확인' 때만 가능(서면 요청).","basis":"학교폭력예방법 제13조의2, 양식 3-3·3-4"},{"stage":"심의·결정","when":"⑩-나 자체해결이 안 되는 경우","who":"학교장","what":"교육지원청에 심의위원회 개최 요청(공문)","detail":"첨부: 전담기구 심의결과 보고서, 사안조사 보고서, 학생·목격학생 확인서, 보호자 확인서, 긴급조치 보고서, 보호자 개인정보, 학생선수 확인 서류(해당 시). 공문 보안 유의. 가해자가 학생이 아니면 자체해결 대상이 아니다. 4요건을 충족했는데 피해 측이 부동의해 요청된 경우, 의결 전까지 피해 측이 서면으로 취소 의사를 밝히면 요청을 취소(자체해결로 간주)할 수 있다.","basis":"학교폭력예방법 제12조·제13조, 양식 3-4·3-5"},{"stage":"심의·결정","when":"⑪ 요청 접수 후 21일 이내","who":"교육지원청 심의위원회","what":"심의위원회 개최(대면 원칙)","detail":"요청 공문 접수 시점부터 21일 이내 개최가 원칙이며 뚜렷한 사유가 있으면 7일 이내 연장. 교육장은 관련 학생·보호자에게 회의 일시·장소·안건을 통지한다. 피해·가해 측 대기실을 분리하고, 출석 학생은 출석인정 결석 처리 가능. 경찰 수사 중·성폭력 등 사실 확인이 어려우면 기한 안에 열고 조치결정을 유보할 수 있다.","basis":"학교폭력예방법 제13조제4항, 가이드북 심의기간·심의방식"},{"stage":"심의·결정","when":"⑪ 심의 당일","who":"심의위원회·관련 학생·보호자·교원","what":"의견진술과 전문가 의견 청취","detail":"조치 요청 전에 피해·가해학생과 보호자에게 의견진술 기회를 준다. 피해 측이 요청하면 소아청소년과·정신건강의학과 의사, 심리학자 등 전문가 의견을 반드시 듣는다. 장애학생이면 특수교육 전문가 의견(요청 시 반드시). 필요하면 관련 교원(관리자·책임교사·담임)을 출석시키거나 서면·통화로 의견을 듣는다. 위원에게 공정을 기대하기 어려운 사정이 있으면 서면으로 기피 신청할 수 있다.","basis":"학교폭력예방법 제13조제5항, 제16조제2항, 제16조의2제2항, 제17조제8항, 시행령 제14조제8항, 제26조"},{"stage":"심의·결정","when":"⑫ 심의 의결","who":"심의위원회","what":"학교폭력 여부 판단과 조치 의결","detail":"재적위원 과반수 출석, 출석위원 과반수 찬성. 가해학생 조치는 심각성·지속성·고의성·반성·화해 정도(각 0~4점)를 합한 판정 점수를 기본으로 하고, 선도가능성·피해학생 장애 여부로 가중·경감한다. 보복 사유면 제6~9호 병과·가중 가능. 제2~4호·제6~8호를 받은 가해학생에게는 특별교육(부가)이 붙고 보호자도 특별교육을 받아야 한다. 제1~3호에는 이행 기간을 정한다.","basis":"학교폭력예방법 제17조제1항~제3항·제13항, 시행령 제19조, 학교폭력 가해학생 조치별 적용 세부기준 고시"},{"stage":"심의·결정","when":"⑬ 조치 결정·통보","who":"교육장","what":"피해·가해 측과 학교에 서면 통보","detail":"교육장은 가해학생 조치 요청 후 14일 이내, 피해학생 보호조치 요청 후 7일 이내(보호자 동의) 조치한다. 통보서에는 조치와 근거·이유를 적고, 가해학생이 여럿이면 학생별로 통보. 학교에는 공문 통보. 결정이 유보되면 그 사실·사유를 서면 통보한다.","basis":"학교폭력예방법 제16조제3항, 제17조제9항, 행정절차법 제23조·제24조"},{"stage":"조치·이행","when":"⑭ 통보 접수 즉시","who":"담임·학교","what":"학교생활기록부 기재","detail":"'학교폭력 조치상황 관리'란에 즉시 입력(조치결정일 = 교육지원청 내부결재일). 제1~3호는 조건부 기재유보: 이행 기간 안에 이행하지 않거나 같은 학교급 재학 중(초등은 3년 이내) 다른 사건으로 조치를 받으면 기재. 피해학생 보호조치와 부가 특별교육은 기재하지 않는다. 불복이 제기돼도 먼저 기재하고 결과에 따라 수정한다.","basis":"초·중등교육법 시행규칙 제21조, 학교생활기록 작성 및 관리지침 제16조의2"},{"stage":"조치·이행","when":"⑮ 조치 이행 기간","who":"학교장·담임·책임교사","what":"가해학생 조치 이행 지도와 결과 보고","detail":"원칙적으로 학기 중 이행. 제3~5호와 부가 조치는 시간 단위. 제3~5호 관련 결석은 학교장이 인정하면 출석 처리 가능, 제6호 출석정지 기간은 미인정결석. 전학(제8호) 통보를 받으면 학교장은 즉시(7일 이내) 전학 학교 배정을 요청. 신고부터 이행 완료까지 가해학생 신청에 의한 학적변동은 원칙적으로 제한. 이행 결과를 교육(지원)청에 보고한다.","basis":"학교폭력예방법 제17조제12항·제14항, 제19조제3항, 시행령 제20조"},{"stage":"조치·이행","when":"⑮ 보호자 특별교육","who":"교육장·학교장·교육감","what":"가해학생 보호자 특별교육 이수 관리","detail":"교육장은 조치 후 14일 이내 보호자에게 서면 통보, 학교장은 3개월 안에 이수하도록 안내. 3개월이 지나도 불응하면 학교장이 그 다음 날 명단을 교육감에게 통보 → 교육감이 14일 이내 '1개월 안에 이수, 미이수 시 과태료' 서면 안내 → 불응 시 과태료 300만원 부과 예고, 14일 안에 이수증·의견 제출 없으면 부과(이의는 60일 이내). 과태료와 별개로 이수 의무는 남는다.","basis":"학교폭력예방법 제17조제13항, 제23조, 시행령 제35조"},{"stage":"조치·이행","when":"⑯ 조치 미이행 시","who":"학교장·교육장(심의위원회)","what":"미이행 보고와 추가 조치","detail":"통보받은 날부터 3개월 안에 이행하지 않으면 학교장이 명단을 교육장에게 보고. 제2호 위반은 새 학교폭력 사안으로 접수. 제3~9호 미이행은 교육장이 보고받은 뒤 21일 이내 '1개월 안에 이행, 미이행 시 추가 조치' 서면 안내, 거부·기피하면 심의위원회가 추가 조치를 요청할 수 있다. 조치·징계가 지연·미이행되면 피해 측은 교육감에게 신고할 수 있다.","basis":"학교폭력예방법 제17조제15항·제16항, 시행령 제22조"},{"stage":"불복·구제","when":"⑰ 통보 후(불복 시)","who":"피해·가해학생과 보호자","what":"행정심판·행정소송·집행정지","detail":"행정심판: 처분을 안 날부터 90일, 처분이 있은 날부터 180일 이내에 시·도교육청 행정심판위원회(경북은 경상북도교육청)에 서면 또는 온라인으로 청구. 행정소송: 안 날부터 90일, 있은 날부터 1년 이내(행정심판을 거쳤다면 재결서 정본 송달일부터), 원고는 학생(미성년이면 법정대리인), 피고는 교육장. 청구만으로 조치 효력이 멈추지 않으며 집행정지 결정이 있어야 한다. 행정심판위원회·법원은 집행정지 전에 피해 측 의견을 들어야 한다.","basis":"학교폭력예방법 제17조의2~제17조의5, 행정심판법 제27조·제30조, 행정소송법 제20조·제23조"},{"stage":"불복·구제","when":"⑰ 집행정지 인용 시","who":"학교장·전담기구","what":"피해 측 요청에 따른 분리","detail":"교육감·교육장은 집행정지 신청과 결과를 피해 측과 양쪽 학교에 통지한다. 인용되면 피해 측이 분리를 요청할 수 있고 학교장은 전담기구 심의를 거쳐 집행정지 기간 동안 분리한다(별도 공간 아님: 자리 배치 변경·동선 분리·생활지도 계획 등). 제1~3호 이행 기간 중 집행정지면 기재를 보류한다.","basis":"학교폭력예방법 제17조의4, 양식 4-5"},{"stage":"불복·구제","when":"⑱ 재심·재조치","who":"교육지원청","what":"같은 사안의 재심 성격 심의위원회는 열지 않는다","detail":"결과에 대한 다툼은 행정심판·행정소송으로 한다. 행정심판·소송으로 조치가 변경·취소되면 생기부 조치사항을 수정하되 조치결정일자는 바꾸지 않는다. 조치 미이행에 따른 추가 조치는 원조치일자로 입력.","basis":"가이드북 사안처리 시 유의사항, 학교생활기록부 기재 유의사항"},{"stage":"종결·사후","when":"⑲ 전출·진학 시","who":"학교","what":"조치 이행 협조 요청과 피해학생 정보 제공","detail":"미이행 가해학생이 전출·진학하면 원적교가 전입교·상급학교에 이행 협조를 요청하고 조치사항 관리대장을 보낸다. 피해학생이 요청하면 동의를 받아 보호에 필요한 최소 정보를 피해학생 관련 정보카드로 전입교·상급학교에 공문 발송한다.","basis":"양식 4-1·4-3·4-4"},{"stage":"종결·사후","when":"⑳ 졸업 직전(학년말)","who":"전담기구·학업성적관리위원회·담임","what":"생기부 조치사항 삭제 심의·처리","detail":"제1~3호는 졸업과 동시에 삭제(졸업식 이후~2월 말). 제4~7호는 졸업 직전 전담기구 심의로 졸업과 동시에 삭제 가능: 재학 중 2건 이상 사안으로 조치를 받지 않았고, 조치결정일부터 졸업학년도 2월 말까지 6개월이 지났을 것. 확인자료: 담임 의견서, 조치 이행 확인서, 부가 특별교육 이수확인서(학생·보호자), 가해학생 자기의견서, 불복 진행 여부, 피해학생 삭제동의 확인서. 전담기구가 명단을 학업성적관리위원회에 통보 → 확인·확정 → 담당자 나이스 삭제 → 학교장 결재. 심의 삭제 대상이 아니면 졸업 후 정해진 기간이 지나 삭제.","basis":"초·중등교육법 시행규칙 제22조, 학교생활기록 작성 및 관리지침 제18조, 가이드북 참고2"},{"stage":"종결·사후","when":"㉑ 전 과정과 종결 뒤","who":"담임·전문상담교사·책임교사","what":"관계회복과 사후 관리","detail":"관계회복 프로그램은 양측이 동의할 때만, 피해 측 의사를 먼저 확인하고 사전 개별면담 뒤 준비됐을 때 대면한다. 한쪽이 중단을 원하면 멈춘다. 관계회복을 해도 사안처리는 계속되며, 회복되면 심의위원회 '화해 정도'에 반영될 수 있다. 교육지원청 관계개선 지원단 지원 가능. 피해학생 적응, 가해학생 재발 방지, 주변 학생 교육을 이어간다.","basis":"학교폭력예방법 제13조의2제3항, 시행령 제14조의3, 가이드북 관계회복"}],"deadlines":[{"what":"교원의 학교장 보고·학부모 통지","limit":"알게 된 즉시","basis":"학교폭력예방법 제20조제4항"},{"what":"성범죄 수사기관 신고","limit":"알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자-피해학생 분리","limit":"인지 후 24시간 이내 결정, 최대 7일(시행 당일·주말·공휴일 포함)","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"가해학생 제2호 조치","limit":"인지 후 지체 없이","basis":"학교폭력예방법 제17조제4항"},{"what":"교육(지원)청 사안접수 보고","limit":"인지 후 48시간 이내","basis":"가이드북(양식 1-3)"},{"what":"조사·전담기구 심의·자체해결 결정 또는 심의위원회 요청","limit":"인지 후 14일 이내(학교장 7일 이내 연장 가능)","basis":"가이드북"},{"what":"심의위원회 개최","limit":"요청 공문 접수 후 21일 이내 원칙(7일 이내 연장)","basis":"가이드북 심의기간"},{"what":"교육장 조치","limit":"가해학생 조치 요청 후 14일 이내, 피해학생 보호조치 요청 후 7일 이내","basis":"학교폭력예방법 제17조제9항, 제16조제3항"},{"what":"전학 학교 배정 요청","limit":"전학 조치 통보 받은 즉시(7일 이내)","basis":"시행령 제20조제1항, 가이드북"},{"what":"조치 미이행 명단 보고","limit":"통보 받은 날부터 3개월 안에 미이행 시","basis":"가이드북"},{"what":"보호자 특별교육 이수","limit":"통보 후 3개월 이내 → 재안내 후 1개월 → 과태료 예고 후 14일","basis":"학교폭력예방법 제23조, 가이드북"},{"what":"행정심판 청구","limit":"처분을 안 날부터 90일, 처분이 있은 날부터 180일 이내","basis":"행정심판법 제27조"},{"what":"행정소송 제기","limit":"처분을 안 날부터 90일, 처분이 있은 날부터 1년 이내","basis":"행정소송법 제20조"},{"what":"분쟁조정","limit":"신청 후 5일 이내 개시, 조정기간 1개월 이내","basis":"학교폭력예방법 제18조제2항, 시행령 제27조"}],"dont":["피해·가해 학생을 한자리에 불러 화해시키거나, 학생들끼리 이야기하라고 자리를 비우지 않는다","반 전체 앞에서 이름을 지목해 훈계하거나 다른 학생 앞에서 사실을 확인하지 않는다","심의위원회 의결 전에 '가해학생·피해학생'으로 단정하지 않는다(관련 학생이라고 부른다)","사안을 축소·은폐하거나 학교장 자체해결·화해를 권하거나 강요하지 않는다","분리한다며 가해 관련 학생을 다른 반으로 옮기지 않는다(분리는 별도 공간, 학급교체는 조치)","신고한 학생을 드러내지 않는다. 가해 쪽이 물어도 끝까지 말하지 않는다","성범죄 사안을 SPO와 '상담'만 하고 끝내지 않는다(상담은 신고가 아님)","조사관처럼 학교폭력 여부나 조치 수준을 예단해 보호자에게 말하지 않는다"],"contacts":[{"name":"학교폭력 신고센터","tel":"117","note":"24시간, 문자 #0117, 누리집 안전Dream"},{"name":"경찰 긴급신고","tel":"112","note":"긴급 상황, 사이버범죄는 ecrm.police.go.kr"},{"name":"응급 구조","tel":"119","note":"골절·기도막힘 등 위급 시"},{"name":"청소년 상담","tel":"1388","note":"청소년상담복지센터 전화상담"},{"name":"푸른나무재단","tel":"1588-9128","note":"학교폭력 상담, 화해·분쟁조정 지원(분쟁조정 지원사업 02-598-1640)"},{"name":"대한법률구조공단","tel":"132","note":"법률상담·소송 지원"},{"name":"온라인 행정심판","tel":"","note":"www.simpan.go.kr (교육장 조치 행정심판 청구)"},{"name":"관할 교육지원청 학교폭력 제로센터","tel":"","note":"사안접수 보고·조사관 배정·관계개선·법률지원·컨설팅"}],"forms":["양식 1-1 학교폭력 신고 접수 대장","양식 1-2 가해자와 피해학생 분리 의사 확인서","양식 1-3 학교폭력 사안 접수 보고서","양식 2-1 학생 작성 확인서","양식 2-2 보호자 확인서","양식 2-3 (피해·가해학생) 긴급조치 보고서","양식 2-4 학교폭력 사안조사 보고서","양식 2-5 피해·가해학생 보호자 개인정보","양식 2-6 학교폭력대책심의위원회 개최 요구 공문","양식 2-7 학교폭력 전담조사관 자료관리대장","양식 3-1 학교폭력 전담기구 심의결과 보고서","양식 3-2 학교장 자체해결 동의서(심의위원회 미개최 요구 의사 확인서)","양식 3-3 학교장 자체해결 결과 보고서","양식 3-4 학교폭력대책심의위원회 개최 요청서","양식 3-5 심의위원회 개최 요구 취소 요청서","양식 3-6 학교폭력 아닌 사안의 종결 보고서","양식 3-7 심의위원회 미개최 동의서(가해자가 학생이 아닌 경우)","양식 4-1 학교폭력 가해학생 조치사항 관리대장","양식 4-2 가해학생 조치(제1·2·3호) 조건부 기재유보 관리대장","양식 4-3 학교폭력 피해학생 관련 정보제공 동의서","양식 4-4 학교폭력 피해학생 관련 정보카드","양식 4-5 집행정지 결정에 따른 분리 요청서","양식 5-1 분쟁조정 신청서"],"law":[{"name":"학교폭력예방 및 대책에 관한 법률","article":"제2조(정의)","point":"학교 안팎에서 학생을 대상으로 한 상해·폭행·감금·협박·명예훼손·모욕·공갈·강요·성폭력·따돌림·사이버폭력(딥페이크 영상 제작·반포 포함) 등"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제20조(학교폭력의 신고의무)","point":"현장을 보거나 안 사람은 즉시 신고. 교원이 알게 되면 학교장에게 보고하고 해당 학부모에게 알려야 함. 신고자에게 불이익 금지"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제14조(전담기구)","point":"교감·전문상담교사·보건교사·책임교사·학부모(3분의 1 이상)로 구성, 인지 시 사실 확인과 자체해결 부의 여부 심의"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제11조의2(학교폭력 조사·상담 등)","point":"교육감·교육장이 학교폭력 조사·상담자(전담조사관)를 위촉해 현장조사·문서열람, 관계인 출석·진술·자료제출 요청 가능, 결과는 학교장·보호자에게 통보"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제13조의2(학교의 장의 자체해결)","point":"경미 사안 4요건 모두 충족 + 피해 측이 심의위원회를 원하지 않을 때 자체해결, 지체 없이 심의위원회에 보고, 관계회복 프로그램 권유"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제12조·제13조(심의위원회)","point":"교육지원청에 설치, 10명 이상 50명 이내(학부모 3분의 1 이상), 소집 사유, 회의록 작성·보존, 관련 학생·보호자에게 일시·장소·안건과 결과 통지, 피해 측 요청 시 전문가 의견 필수 청취"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제16조(피해학생의 보호)","point":"보호조치 제1호 심리상담·조언, 제2호 일시보호, 제3호 치료·요양, 제4호 학급교체, 제6호 그 밖의 조치. 인지 시 가해자(교사 포함) 분리, 교육장 7일 이내 조치, 결석 출석 인정, 성적 불이익 금지, 상담·치료비는 가해학생 보호자 부담(공제회 선지급 후 구상 가능)"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조(가해학생에 대한 조치)","point":"제1호 서면사과~제9호 퇴학(의무교육 과정은 퇴학 불가), 부가 특별교육, 긴급조치와 추인, 의견진술 기회, 교육장 14일 이내 조치, 보호자 특별교육, 거부 시 추가 조치"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조의2~제17조의5(불복)","point":"피해 측은 보호조치·가해조치 모두, 가해 측은 가해조치에 행정심판·행정소송 가능, 집행정지 전 피해 측 의견 청취, 인용 시 피해 측 분리 요청권, 가해 측 소송은 1심 90일·2·3심 각 60일 안에 선고"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제18조(분쟁조정)","point":"심의위원회(또는 교육감)가 손해배상 합의 등 분쟁 조정, 조정기간 1개월 이내"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제21조·제22조·제23조","point":"비밀누설 금지(1년 이하 징역 또는 1천만원 이하 벌금), 심의위원회 회의 비공개(회의록 열람·복사 신청 시 개인정보 빼고 공개), 보호자 특별교육 불응 시 300만원 이하 과태료"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제11조의4(업무 담당자 지원 및 면책)","point":"법령·학칙을 지킨 정당한 사건처리·생활지도는 민사·형사 책임을 지지 않음, 책임교사 수업 조정 등 지원"},{"name":"학교폭력예방 및 대책에 관한 법률 시행령","article":"제14조·제26조","point":"심의위원 자격·임기 2년, 재적 과반수 출석·출석 과반수 찬성, 제척·기피·회피"},{"name":"학교폭력예방 및 대책에 관한 법률 시행령","article":"제17조의2·제19조·제20조·제21조","point":"분리 예외, 조치 적용 기준(심각성·지속성·고의성·반성·화해·선도가능성·장애), 전학 배정, 우선 출석정지 사유"},{"name":"학교폭력 가해학생 조치별 적용 세부기준 고시","article":"제2조, 별표","point":"판정 점수에 따른 조치 기준(1~3점 1호, 4~6점 3호, 7~9점 4호, 10~12점 6호, 13~15점 7호, 16~20점 8·9호)"},{"name":"초·중등교육법 시행규칙","article":"제21조·제22조","point":"가해학생 조치 학생부 기재(제1~3호 조건부 기재유보), 졸업 후 삭제 시기"},{"name":"행정심판법","article":"제27조·제30조·제45조","point":"안 날 90일·있은 날 180일, 청구만으로 집행 정지 안 됨(집행정지 결정 필요), 재결 60일(30일 연장 가능)"},{"name":"행정소송법","article":"제18조·제20조·제23조","point":"행정심판 없이 바로 소송 가능, 안 날 90일·있은 날 1년, 법원 집행정지"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항","point":"학교의 장과 종사자는 직무상 아동·청소년대상 성범죄를 알게 되면 즉시 수사기관 신고"}],"faq":[{"q":"피해 학생이나 부모가 '일 크게 만들지 말아 달라'고 하면 신고·접수를 안 해도 되나요?","a":"안 됩니다. 알게 된 교원은 학교장에게 보고하고 학부모에게 알려야 하며(제20조제4항), 학교장은 피해 측이 신고하지 않아도 사실 여부를 확인해야 합니다. 다만 절차 안에서 학교장 자체해결(4요건 충족 + 피해 측 서면 동의)로 끝낼 수 있고, 분리는 피해학생이 반대하면 하지 않습니다."},{"q":"분리할 때 가해 관련 학생을 다른 반에 보내도 되나요?","a":"안 됩니다. 분리는 학급교체가 아니므로 학교 안 별도 공간을 쓰고 학습 자료나 원격수업을 제공합니다. 별도 공간이 없어 가정이나 위(Wee)센터 등에서 분리하면 출석인정 결석으로 처리할 수 있습니다."},{"q":"학교장 자체해결 4요건이 뭔가요?","a":"①2주 이상 신체·정신 치료가 필요한 진단서를 발급받지 않음 ②재산 피해가 없거나 즉시 복구·복구 약속이 있음(치료비 포함) ③지속적이지 않음 ④신고·진술·자료제공에 대한 보복이 아님. 모두 충족하고 피해학생과 보호자가 심의위원회 개최를 원하지 않아야 합니다. 전담기구 심의일 전에 진단서를 내지 않았으면 ①을 충족한 것으로 보지만, 한 번 낸 진단서를 회수해도 충족하지 않은 것으로 봅니다."},{"q":"심의위원회에 담임이 불려 가나요? 회의록은 볼 수 있나요?","a":"심의위원회는 필요하면 관련 교원을 출석시키거나 서면·(영상)통화·사전면담 등으로 의견을 들을 수 있고 학교는 협조해야 합니다. 회의는 비공개지만 피해·가해학생이나 보호자가 회의록 열람·복사를 신청하면 학생·가족의 성명·주민번호·주소, 위원 성명 등 개인정보를 빼고 공개해야 합니다(제21조제3항)."},{"q":"가해학생 조치는 생활기록부에 언제까지 남나요?","a":"2024.3.1. 이후 신고 사안은 제1~3호 졸업과 동시, 제4·5호 졸업일부터 2년 후, 제6·7호 졸업일부터 4년 후, 제8호 졸업일부터 4년 후 삭제하고 제9호는 삭제하지 않습니다. 제4~7호는 졸업 직전 전담기구 심의로 졸업과 동시에 삭제할 수 있는데, 재학 중 다른 사안으로 조치받은 적이 없고 조치결정일부터 졸업학년도 2월 말까지 6개월이 지나야 합니다. 제8호는 심의 삭제 대상이 아닙니다."},{"q":"조치에 불복하려면 어디에, 언제까지 해야 하나요?","a":"행정심판은 조치를 안 날부터 90일(처분이 있은 날부터 180일) 안에 해당 시·도교육청 행정심판위원회(처분청인 교육장이나 위원회에 서면 또는 www.simpan.go.kr)에, 행정소송은 안 날부터 90일(있은 날부터 1년) 안에 교육장을 피고로 법원에 냅니다. 행정심판을 거치지 않고 바로 소송해도 됩니다. '안 날'은 교육장 명의 통보서를 실제 받은 날이며, 이유 없이 수령을 거절하면 그때부터 기간이 흐릅니다. 청구만으로 조치가 멈추지 않으니 조치를 멈추려면 집행정지를 함께 신청해야 합니다."},{"q":"가해 측이 집행정지를 받았어요. 피해학생은 어떻게 보호하나요?","a":"피해학생과 보호자는 학교장에게 분리를 요청할 수 있고(양식 4-5), 학교장은 전담기구 심의를 거쳐 집행정지 기간 동안 분리해야 합니다. 다만 이 분리는 가해학생 학습권을 고려해 별도 공간이 아니라 자리 배치 변경, 동선 분리, 생활지도 계획 등으로 합니다. 또 행정심판위원회·법원은 집행정지 결정 전에 피해 측 의견을 들어야 합니다."},{"q":"학부모가 이미 경찰에 고소했으면 학교 절차는 멈추나요?","a":"아닙니다. 경찰 신고(형사)와 학교폭력 절차(교육·선도)는 별개로 진행됩니다. 사실관계 확인이 어려운 수사 중 사건은 심의위원회가 기한 안에 열어 조치결정을 유보할 수 있습니다. 한편 피해 측이 고소·고발이나 민사소송을 제기하면 분쟁조정은 거부·중지될 수 있습니다."},{"q":"학폭 조치가 대학 입시에도 반영되나요?","a":"2026학년도 대입부터 학교폭력 조치사항을 학생부(교과·종합), 수능, 논술, 실기·실적 위주 전형에서 필수 반영하고, 반영 방법은 각 대학이 입학전형 시행계획에 미리 정해 발표합니다."}],"deep":[{"title":"사안 조사는 이렇게 진행된다","body":["학교장은 접수 보고 때 교육지원청에 전담조사관 배정을 요청하거나, 학교 자체 조사가 적합하면 전담기구에 조사를 맡긴다. 조사관은 교육감·교육장이 위촉한 전문가(퇴직 교원·경찰, 청소년 상담 경력자 등)로, 현장조사·문서열람을 하고 학생·목격자·교사·보호자에게 출석·진술·자료제출을 요청할 수 있으며 조사관증을 보여야 한다.","조사는 서면(확인서)·면담·현장·설문을 섞어 신속히 증거를 확보한다. 확인서는 육하원칙으로 받고, 진술이 엇갈리면 목격자와 직·간접 증거로 확인한다. 진위 판단은 면담 결과와 정황의 일치, 양측의 상호 인정, 진술의 일관성, 목격자 확인, 정황증거를 본다. 가해 측이 부인하거나 목격자가 증언을 거부해도 다른 정황으로 사실이 파악되면 보고서에 확인된 사실로 적을 수 있다.","사이버폭력은 명의도용·유포 정도·사이버성폭력 여부, 신체폭력은 상해 심각성·감금·성폭력 여부 등 유형별로 중점 요소가 다르다. 경중 판단에는 장애학생 피해 여부, 신고학생에 대한 보복 여부, 심각성·지속성·고의성, 반성·화해 정도, 교사(敎唆)·집단폭력·위험한 물건·주도 여부가 반영된다.","조사관이 쓴 사안조사 보고서는 제로센터 사례회의(센터장·장학사·조사관·SPO·외부전문가 등)에서 완결성·객관성을 검토하고, 필요하면 보완조사를 거쳐 심의위원회로 간다."],"basis":"학교폭력예방법 제11조의2, 가이드북 PART 2 사안조사"},{"title":"전담기구는 무엇을 하나","body":["학교장이 구성하며 교감(총괄)·책임교사·전문상담교사·보건교사와 학부모(구성원의 3분의 1 이상, 학교운영위원회 추천)로 이루어진다. 역할은 사안 접수·보호자 통보, 사실 확인·조사, 교육(지원)청 보고, 자체해결 부의 여부 심의, 가해학생 긴급조치(제6·7호) 심의, 집행정지에 따른 분리 심의, 졸업 전 조치사항 삭제 심의, 집중보호·관찰 학생 생활지도, 실태조사다.","회의는 비공개, 구성원 과반수 참석과 과반수 찬성으로 의결한다. 전담기구는 심의위원회가 아니어서 법정 회의록 작성 의무는 없지만 심의결과 보고서(양식 3-1)를 남긴다. 성폭력 등 특수 사안은 심의위원회 위원장 심의를 거쳐 학교장 명의로 전문기관에 실태조사를 의뢰할 수 있다."],"basis":"학교폭력예방법 제14조, 시행령 제16조, 가이드북"},{"title":"심의위원회는 이렇게 열린다","body":["교육지원청에 두는 법정위원회로 10명 이상 50명 이내, 학부모 3분의 1 이상(소위원회는 학부모 35% 이내 권장), 학교전담경찰관은 반드시 위촉한다. 위원은 교육지원청 국·과장, 2년 이상 생활지도 경력 교원, 판사·검사·변호사, 경찰, 의사, 교수 등이며 임기 2년이다. 피·가해학생이 서로 다른 교육지원청이면 공동 심의위원회를 둘 수 있다.","학교장 요청 공문 접수 후 21일 이내(7일 연장 가능) 개최가 원칙이다. 교육장은 관련 학생·보호자에게 일시·장소·안건을 통지한다. 대면 심의가 원칙이지만 요청이 있거나 도서지역 등이면 전화·화상·서면도 쓴다. 피·가해 측 대기실을 따로 두고, 출석한 학생은 학교장 허가 결석(출석 인정)으로 처리할 수 있다.","조치 전에 양측에 의견진술 기회를 반드시 준다. 피해 측이 요청하면 의사·심리학자 등 전문가 의견을 반드시 듣고, 장애학생이면 특수교육 전문가 의견을(요청 시 반드시), 이주배경학생이면 통역을 활용한다. 위원이 보호자·친족·친분 관계면 제척되고, 당사자는 서면으로 기피 신청을 할 수 있으며 위원회가 의결로 정한다.","재적 과반수 출석, 출석 과반수 찬성으로 의결한다. 수사 중·성폭력 등 사실 확인이 어려우면 조치결정을 유보하고 추가조사 후 다시 열 수 있다(유보 사유는 서면 통보). 회의는 비공개이며 회의록 열람·복사를 신청하면 개인정보를 뺀 뒤 공개한다. 같은 사안에 대한 재심 성격의 심의위원회는 열지 않는다."],"basis":"학교폭력예방법 제12조·제13조·제21조, 시행령 제14조·제26조, 가이드북 PART 4"},{"title":"조치는 어떻게 정해지나(판정 점수)","body":["심각성·지속성·고의성·반성 정도·화해 정도를 각각 0~4점(반성·화해는 높을수록 0점)으로 매겨 합산한다. 1~3점 제1호, 4~6점 제3호, 7~9점 제4호, 10~12점 제6호, 13~15점 제7호, 16~20점 제8호 또는 제9호가 기본이다. 제2호(접촉 금지)와 제5호(특별교육·심리치료)는 점수와 별개로 필요하다고 의결하면 부과한다.","선도가능성과 피해학생 보호를 고려해 출석위원 과반수 찬성으로 가중·경감할 수 있고, 피해학생이 장애학생이면 가중할 수 있다. 피해학생이나 신고·고발학생에 대한 협박·보복이 이유면 제6~9호를 병과하거나 가중할 수 있다. 관계회복·분쟁조정이 이루어졌다면 '화해 정도'에 반영될 수 있으나 그 자체로 조치가 면제되지는 않는다.","제2~4호, 제6~8호를 받은 가해학생은 교육감이 정한 기관에서 부가 특별교육(또는 심리치료)을 받아야 하고, 제5호나 부가 특별교육을 받으면 보호자도 특별교육을 받아야 한다(제2·3호 관련은 4시간 이내, 제4~8호 관련은 5시간 이상). 피해학생이 장애학생이면 장애인식개선 내용을 넣어야 한다."],"basis":"학교폭력예방법 제17조, 시행령 제19조, 학교폭력 가해학생 조치별 적용 세부기준 고시 별표, 가이드북"},{"title":"피해학생은 이렇게 보호·지원된다","body":["심의위원회는 제1호 심리상담·조언, 제2호 일시보호, 제3호 치료·요양, 제4호 학급교체, 제6호 그 밖의 조치(해바라기센터 연계, 법률구조기관 협조 등)를 요청할 수 있고 교육장은 보호자 동의를 받아 7일 이내 조치한다. 학교장이 인정하면 보호조치에 필요한 결석은 출석으로 계산하고, 보호조치를 받았다는 이유로 성적에서 불이익을 주지 않는다. 심의위원회 전이라도 전담기구 조사로 피해 때문에 결석했음이 확인되면 출석 처리한다.","상담·일시보호·치료 비용은 가해학생 보호자가 부담하지만, 신속한 치료를 위해 학교장이나 피해 보호자가 원하면 학교안전공제회(또는 교육청)가 먼저 내고 가해 측에 구상한다. 지원 기간은 상담·치료 2년(보상심사위원회 심의로 1년 연장 가능), 일시보호 30일이다.","교육감·교육장은 피해학생 지원 조력인(피해학생 전담지원관)을 지정해 법률·상담·보호 서비스를 연계하고, 가해 측이 행정심판·소송을 하면 제로센터가 피해학생 법률자문·소송 지원을 연계할 수 있다. 피해학생이 요청하면 전출·진학 때 보호에 필요한 최소 정보를 새 학교에 전달한다."],"basis":"학교폭력예방법 제16조, 제16조의3, 시행령 제18조, 학교안전사고 예방 및 보상에 관한 법률 시행규칙 제9조의3, 가이드북"},{"title":"불복: 행정심판·행정소송·집행정지","body":["행정심판은 교육장의 위법·부당한 처분을 교육청 행정심판위원회가 다시 판단하는 절차다. 피해학생·보호자는 피해학생 보호조치와 가해학생 조치 모두에, 가해학생·보호자는 가해학생 조치에 청구할 수 있다. 학교 설립 형태(국·공·사립)와 관계없이 가능하다. 청구서는 서면으로 처분청(교육장)이나 행정심판위원회에 내거나 온라인(www.simpan.go.kr)으로 낸다. 공동 심의위원회 사안에서 피해 측이 가해 조치를 다투면 가해학생 학교가 속한 교육청 행정심판위원회에 낸다.","청구 기간은 처분을 안 날부터 90일, 처분이 있은 날부터 180일이며 둘 중 하나만 지나도 청구할 수 없다. '안 날'은 교육장 명의 통보서를 실제로 받은 날이다. 행정심판위원회는 피해 측과 양쪽 학교에 청구 사실과 심판참가 방법을 문서로 알려야 한다. 재결은 청구서를 받은 날부터 60일 이내(30일 연장 가능).","행정소송(취소소송)은 행정심판을 거치지 않고 바로 낼 수 있다. 원고는 처분을 다투는 학생(미성년자는 법정대리인이 대리), 피고는 교육장이다. 안 날부터 90일, 있은 날부터 1년 안에 내고, 행정심판을 거쳤다면 재결서 정본을 받은 날부터 계산한다. 가해 측이 낸 소송은 1심은 제기일부터 90일, 2·3심은 전심 선고일부터 각 60일 안에 선고해야 한다. 교육장은 소송 사실과 소송참가 방법을 관련 학생·학교에 알린다.","청구나 소송만으로는 조치의 효력이 멈추지 않는다. 멈추려면 행정심판위원회(행정심판법 제30조) 또는 법원(행정소송법 제23조)의 집행정지 결정이 필요하다. 이때 피해 측 의견을 반드시 듣고(포기 의사 등 예외), 피해 측은 가해 측과 마주치지 않도록 퇴장시킨 뒤 진술하거나 서면으로 낼 수 있다. 인용되면 피해 측이 분리를 요청할 수 있고, 학교는 이행 기간 중인 제1~3호의 생기부 기재를 보류한다. 본안이 기각되면 남은 이행 기간 안에 이행했는지에 따라 기재 여부를 정한다."],"basis":"학교폭력예방법 제17조의2~제17조의5, 행정심판법 제23조·제27조·제30조·제45조, 행정소송법 제18조·제20조·제23조, 행정소송규칙 제10조의2, 가이드북"},{"title":"수사·재판, 민사, 분쟁조정과의 관계","body":["형사 절차(경찰 신고)와 학교폭력 절차는 별개로 진행되며, 학교는 수사 중에도 분리·보호·지도를 계속한다. 성범죄는 학교가 즉시 수사기관에 신고해야 한다. 14세가 되지 않은 사람은 형벌을 받지 않지만(형법 제9조), 형벌 법령에 저촉되는 행위를 한 10세 이상 14세 미만은 소년부 보호사건으로 심리된다(소년법 제4조).","치료비·정신적 손해는 민사 손해배상을 청구할 수 있다. 보통 가해학생의 감독의무자인 보호자가 책임지며, 교사는 교육활동과 밀접한 관계에서 폭력을 알았거나 알 수 있었는데 방지 노력을 다하지 않은 경우에만 책임을 진다. 국·공립은 교사에게 경과실만 있으면 지방자치단체가 배상하고, 교사 개인은 고의·중과실일 때 함께 책임진다. 법령·학칙을 지킨 정당한 사건처리는 민·형사 책임이 없다.","분쟁조정은 손해배상 합의 등을 심의위원회(다른 교육지원청이면 교육감)가 조정하는 제도다. 분쟁당사자 어느 쪽이든 문서로 신청하고, 신청 후 5일 이내 시작해 1개월을 넘지 않는다. 한쪽이 거부하거나 피해 측이 고소·고발·민사소송을 내면 거부·중지될 수 있다. 성립하면 합의서를 써서 당사자와 양쪽 학교장에게 통보한다. 분쟁조정이 성립해도 심의위원회 조치가 없어지는 것은 아니고 조치 기준에 고려된다."],"basis":"가이드북 경찰 신고 시 대처·참고1 민사책임·분쟁조정, 학교폭력예방법 제11조의4·제18조, 시행령 제25조~제29조, 형법 제9조, 소년법 제4조"},{"title":"끝맺음: 관계회복과 기록 삭제","body":["관계회복은 두 사람 이상이 대화와 이해로 일상으로 돌아가도록 함께 노력하는 것이다. 사안 처리 전 과정에서 운영할 수 있지만 양측 동의가 있어야 하고 한쪽이 원하지 않으면 멈춘다. 사전 개별면담으로 피해 측이 사과를 받을 준비가 됐는지, 가해 측이 잘못을 충분히 인정하고 사과할 준비가 됐는지를 확인한 뒤에만 대면한다. 담임·책임교사·상담교사가 역할을 나누고 교육지원청 관계개선 지원단(예비중재→본중재→사후관리)을 요청할 수 있다.","졸업 무렵 전담기구는 삭제 대상자(제1~3호 졸업예정자, 졸업 직전 심의로 삭제가 확정된 졸업예정자, 보존기간이 끝나는 졸업자)를 확정해 학업성적관리위원회에 통보하고, 위원회가 확인한 뒤 담당자(졸업예정자는 담임 등)가 나이스에서 삭제한다. 회의록과 내부결재를 남긴다. 학업중단자는 학적을 유지했다고 가정해 삭제 시기를 정하고 심의 삭제는 할 수 없다."],"basis":"학교폭력예방법 제13조의2, 시행령 제14조의3, 초·중등교육법 시행규칙 제22조, 가이드북 관계회복·참고2"}],"tables":[{"title":"가해학생 조치 1~9호","head":["호","조치","기준 판정점수","부가 특별교육·보호자 교육","생기부","삭제 시기(2024.3.1. 이후 신고)"],"rows":[["1호","피해학생에 대한 서면사과","1~3점","부가 없음","조건부 기재유보(미이행·재조치 시 기재)","졸업과 동시"],["2호","피해·신고학생 접촉·협박·보복행위 금지(정보통신망 포함)","점수 무관, 보호 필요 시 의결","부가 특별교육, 보호자 4시간 이내","조건부 기재유보","졸업과 동시"],["3호","학교에서의 봉사","4~6점","부가 특별교육, 보호자 4시간 이내","조건부 기재유보","졸업과 동시"],["4호","사회봉사","7~9점","부가 특별교육, 보호자 5시간 이상","기재","졸업일부터 2년 후(졸업 직전 심의로 졸업과 동시 가능)"],["5호","학내외 전문가·교육감 지정 기관의 특별교육 이수 또는 심리치료","점수 무관, 필요 시 의결","보호자 5시간 이상","기재","졸업일부터 2년 후(심의로 졸업과 동시 가능)"],["6호","출석정지(미인정결석)","10~12점","부가 특별교육, 보호자 5시간 이상","기재","졸업일부터 4년 후(심의로 졸업과 동시 가능)"],["7호","학급교체","13~15점","부가 특별교육, 보호자 5시간 이상","기재","졸업일부터 4년 후(심의로 졸업과 동시 가능)"],["8호","전학(피해학생 학교로 재전학 불가, 상급학교도 다른 학교 배정)","16~20점","부가 특별교육, 보호자 5시간 이상","기재","졸업일부터 4년 후(심의 삭제 불가)"],["9호","퇴학처분(의무교육 과정 적용 불가)","16~20점","-","기재","삭제하지 않음"]],"note":"판정점수는 학교폭력 가해학생 조치별 적용 세부기준 고시 별표, 삭제 시기는 초·중등교육법 시행규칙 제22조와 2026 가이드북. 2024.2.29. 이전 신고 사안은 삭제 시기가 다르다(예: 2023.3.1.~2024.2.29. 신고 제6·7·8호는 졸업일부터 2년 후). 보호자 교육 시간은 가이드북 '보호자 특별교육 이수시간 부과 기준'."},{"title":"피해학생 보호조치","head":["호","조치","내용","비용 지원 기간"],"rows":[["1호","학내외 전문가에 의한 심리상담 및 조언","학교 상담교사, 위센터·정신건강복지센터·청소년상담복지센터 등","2년(보상심사위원회 심의로 1년 연장 가능)"],["2호","일시보호","보복 우려 시 보호시설·집·학교 상담실 등에서 보호","30일"],["3호","치료 및 치료를 위한 요양","의료기관·보건소·약국 등","2년(1년 연장 가능)"],["4호","학급교체","피해학생을 같은 학교 다른 반으로(피해 측 의견 반영)","-"],["6호","그 밖에 필요한 조치","해바라기센터 지정병원 연계, 법률구조기관 협조 등","-"]],"note":"제5호는 삭제됨. 비용은 가해학생 보호자 부담이 원칙이며 공제회·교육청 선지급 후 구상 가능(학교폭력예방법 제16조, 시행령 제18조, 학교안전사고 예방 및 보상에 관한 법률 시행규칙 제9조의3)."},{"title":"불복 방법 비교","head":["구분","누가","어디에","기간","효력 정지","그 밖에"],"rows":[["행정심판","피해학생·보호자(보호조치·가해조치), 가해학생·보호자(가해조치)","해당 시·도교육청 행정심판위원회(경북: 경상북도교육청). 처분청(교육장)이나 위원회에 서면, 또는 www.simpan.go.kr","안 날부터 90일, 있은 날부터 180일","청구만으로 안 멈춤. 위원회 집행정지 결정 필요(심판청구와 동시~의결 전 서면 신청)","재결 60일 이내(30일 연장 가능), 피해 측·학교에 청구 사실 통지"],["행정소송(취소소송)","원고: 처분을 다투는 학생(미성년은 법정대리인), 피고: 교육장","법원","안 날부터 90일, 있은 날부터 1년(행정심판 거친 경우 재결서 정본 송달일부터)","법원 집행정지 결정 필요(행정소송법 제23조)","행정심판 없이 바로 가능. 가해 측 소송은 1심 90일, 2·3심 각 60일 안에 선고"],["집행정지","불복한 쪽이 신청","행정심판위원회 또는 법원","행정심판은 심판청구와 동시 또는 의결 전까지","인용 시 조치 집행이 멈춤","결정 전 피해 측 의견 청취 필수, 인용 시 피해 측 분리 요청권, 1~3호 기재 보류"],["분쟁조정","피해·가해학생 또는 보호자 누구든","심의위원회(다른 교육지원청이면 교육감)","신청 후 5일 이내 개시, 1개월 이내","-","손해배상 합의 조정, 고소·소송 제기 시 중지 가능"],["재심","-","-","-","-","같은 사안의 재심 성격 심의위원회는 열지 않음"]],"note":"학교폭력예방법 제17조의2~제17조의5·제18조, 행정심판법 제27조·제30조·제45조, 행정소송법 제18조·제20조·제23조, 2026 가이드북 불복절차."},{"title":"기한 한눈표","head":["단계","기한","근거"],"rows":[["교원 → 학교장 보고, 학부모 통지","즉시","법 제20조제4항"],["성범죄 수사기관 신고","즉시","청소년성보호법 제34조"],["분리 결정 / 분리 기간","24시간 이내 / 최대 7일","법 제16조, 가이드북"],["교육(지원)청 보고","48시간 이내","가이드북"],["자체해결 결정 또는 심의위원회 요청","14일 이내(+7일)","가이드북"],["심의위원회 개최","요청 접수 후 21일 이내(+7일)","가이드북"],["교육장 조치","가해 14일 / 피해 7일 이내","법 제17조제9항, 제16조제3항"],["보호자 특별교육 서면 통보","조치 후 14일 이내","가이드북"],["조치 이행(미이행 보고 기준)","통보 후 3개월","가이드북"],["미이행 서면 안내","보고 후 21일 이내, 1개월 안 이행 요구","가이드북"],["행정심판","안 날 90일 / 있은 날 180일","행정심판법 제27조"],["행정소송","안 날 90일 / 있은 날 1년","행정소송법 제20조"],["삭제 심의 요건","조치결정일부터 졸업학년도 2월 말까지 6개월 경과","학교생활기록 작성 및 관리지침 제18조"]],"note":"48시간·14일·21일은 법 조문이 아니라 2026 가이드북 운영 기준."}],"record":"심의위원회 조치결정 통보 공문을 받는 즉시 학교생활기록부 '학교폭력 조치상황 관리'란에 가해학생 조치를 입력한다(2026.3.1. 기준 초1~3학년과 중·고 전 학년은 이 란으로 일원화, 초4~6은 종전처럼 행동특성 및 종합의견·출결상황 특기사항·인적·학적사항 특기사항에 분산). 제1~3호는 조건부 기재유보이며 관리대장(양식 4-2)으로 관리하고, 이행 기간 안에 이행하지 않으면 기재한 뒤 나중에 이행해도 유지한다. 제17조제4항 제2호 긴급조치는 기재하지 않고, 심의위원회가 추인한 긴급조치(제1·3·5·6·7호)는 기재한다. 피해학생 보호조치와 부가 특별교육 이수 사실은 기재하지 않는다. 조치결정일자는 교육지원청 내부결재일. 행정심판·소송이 제기돼도 먼저 입력하고, 변경·취소되면 조치사항만 수정(결정일자 유지). 학적변동(전출·자퇴) 전에는 조치사항을 먼저 입력하고 관리대장(양식 4-1)을 전입교로 보낸다. 출석정지가 다음 학년도로 이어지면 당해 학년도 특기사항에 받은 일수를 적고 다음 학년도는 공란. 상급학교 진학 뒤 조치가 결정되면 심의 요청 학교급 학생부에 기재(결정일은 졸업학년도 2월 말일). 긴급 출석정지는 미인정결석이나 추인되지 않거나 자체해결로 끝나면 출석 인정 가능. 졸업 전 삭제는 전담기구 심의 → 학업성적관리위원회 확인 → 나이스 삭제 순.","sources":[{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"학교폭력예방 및 대책에 관한 법률 [시행 2026. 6. 2.] 법률 제21723호","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률"},{"title":"학교폭력예방 및 대책에 관한 법률 시행령 [시행 2026. 1. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률시행령"},{"title":"형법 [시행 2026. 9. 13.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/형법"},{"title":"소년법 [시행 2021. 4. 21.]","publisher":"국가법령정보센터","year":2021,"url":"https://www.law.go.kr/법령/소년법"},{"title":"2026학년도 대학입학전형기본사항 발표","publisher":"교육부 보도자료","year":2023,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=96229&lev=0&m=020402&opType=N&s=moe&statusYN=W"},{"title":"2026학년도 대학입학전형기본사항 발표","publisher":"한국대학교육협의회","year":2023,"url":"https://www.kcue.or.kr/news/sub02/sub01.php?at=view&idx=24138"}],"verified":"2026-09-24","uncertain":["가이드북 원문은 교육부 누리집이 아니라 충청북도교육청 게시본(2026년도 일부개정판)으로 확인함. 경북교육청 보완 지침(경북 제로센터 연락처, 보고·조사관 배정 운영 방식)은 확인 못 함","학교폭력예방법이 2026.6.2. 일부개정(장애학생 사건 시 특수교육 전문가 의견 청취 강화)되어, 3월 가이드북 이후 바뀐 세부 운영이 있는지는 확인 못 함","117 문자 신고 번호: 교육부 가이드북은 '#0117', 경기도교육청 2026 안내서는 '#1017'로 서로 다름. 가이드북 값을 적음","교육(지원)청 보고 48시간·14일(+7일)·심의위원회 21일(+7일)·미이행 3개월 등은 법률 조문이 아니라 가이드북 운영 기준임","행정소송의 관할 법원(행정법원·지방법원 행정부)은 원문에서 '법원'으로만 확인해 구체적으로 적지 않음","민사 손해배상 청구 기간(소멸시효)은 원문에서 확인하지 못해 적지 않음","대입 반영의 구체적 방법(감점·지원자격 제한 등)은 대학마다 달라 적지 않음","초4~6학년의 일원화 적용 시기는 연도별로 달라지므로(2027~2029년 순차) 해당 학년도 학생부 기재요령을 확인해야 함"],"related":["cyber-deepfake","sexual-violence","student-guidance"]},{"id":"sexual-violence","title":"학생 대상 성폭력·성희롱","aka":["성폭력","성추행","성희롱","몸을 만졌어요","강제로 만졌어요","성적인 말","교사 성희롱","선생님이 만졌어요","성고충","성범죄 신고의무","해바라기센터","1366","스쿨미투"],"category":"학생 보호·위기","urgency":"즉시","roles":["처음 알게 된 교직원","담임","성고충상담원","학교폭력 책임교사","보건교사","전문상담교사","학교장·교감"],"summary":"학생이 피해자인 성폭력(추행·강간·불법촬영 등)은 가해자가 학생이든 교직원이든 학교장과 모든 교직원이 알게 된 즉시 수사기관에 신고해야 하며, 피해자 의사와 관계없다. 학생 간 사안은 학교폭력 절차로, 교직원이 가해한 사안은 가해 교직원 즉시 분리·교육지원청 보고·성희롱·성폭력 사안 절차(성고충심의)와 징계·직위해제로 이어진다. 전 과정에서 피해 학생의 신원과 사생활을 철저히 비밀로 하고 2차 피해를 막는다.","first":["피해 학생의 안전을 먼저 확보하고 가해자(학생·교직원)와 즉시 떼어 놓는다","학교장에게 보고하고 112 또는 117에 즉시 신고한다(피해자·보호자가 원하지 않아도)","몸을 씻거나 옷을 갈아입지 말고 병원(해바라기센터)으로 가도록 안내하고, 현장·CCTV를 보존한다","피해 학생에게 캐묻지 말고 '네 잘못이 아니야'라고 말해 준다","사실을 아는 사람을 최소로 줄이고 관련자에게 비밀유지를 고지한다"],"steps":[{"when":"인지 즉시","who":"알게 된 교직원","what":"피해 학생 안정·안전 확보, 학교장(관리자)에게 보고","detail":"상담 과정·학교폭력 신고 접수 등 직무상 알게 된 경우 모두 해당한다. 판단이나 추궁 없이 들어 주고, 구체적인 내용을 반복해서 묻지 않는다(수사 진술 오염 방지).","basis":"청소년성보호법 제34조제2항"},{"when":"인지 즉시","who":"학교장·교직원","what":"수사기관 신고","detail":"긴급하면 112·117로 전화, 긴급하지 않으면 117 또는 관할 경찰서 여성청소년과로 신고서 공문 발송. 117에 할 때는 '신고'라고 분명히 밝힌다. 학교전담경찰관(SPO) 상담은 신고가 아니다. 피해 학생이나 보호자가 먼저 신고했어도 원칙적으로 신고 의무는 남는다(수사가 이미 진행 중인 경우는 예외). 교직원 가해 등 아동학대(성학대)에 해당하면 아동학대 신고 의무도 함께 적용된다.","basis":"청소년성보호법 제34조제2항, 아동학대처벌법 제10조제2항"},{"when":"인지 즉시","who":"보건교사·담임","what":"응급조치·의료 연계와 증거 보존","detail":"증거가 사라지지 않도록 가능한 한 빨리 의료기관으로 이송하고, 씻지 말고 병·의원(해바라기센터)에 가도록 안내한다. 보건실 치료 기록을 보관하고, 현장이 교내면 물품을 보관·현장을 보존하며 CCTV 영상을 확보해 수사기관에 넘긴다.","basis":"학교폭력 사안처리 가이드북(성폭력 초기대응), 학교 내 성희롱·성폭력 사안 대응 업무 가이드"},{"when":"인지 즉시","who":"학교장","what":"가해자와 피해 학생 분리","detail":"학교폭력예방법은 가해자에 '교사'를 포함한다. 가해 학생은 분리·제2호 조치·필요 시 긴급조치. 가해 교직원은 수업 배제, 업무 배제·변경, (임시) 담임 교체, 근무 장소 변경, 동선 분리, 연가 승인 등으로 즉시 분리한다.","basis":"학교폭력예방법 제16조제1항, 제17조제4항·제5항"},{"when":"인지 즉시","who":"학교장","what":"비밀유지·접촉금지 고지","detail":"사안 처리 담당자와 관련자(목격자·가해자 포함)에게 비밀유지를 강조하고 서약서를 받는다. 학교장과 관련 교원 외에는 사실을 모르게 한다. 소문을 퍼뜨리거나 피해자를 비난해 2차 피해를 일으키면 가중 조치될 수 있음을 알린다.","basis":"학교폭력예방법 제21조, 성폭력처벌법 제24조, 청소년성보호법 제31조"},{"when":"인지 후 48시간 이내","who":"책임교사·성고충 업무담당자","what":"교육(지원)청 보고","detail":"학생 간: 학교폭력 사안접수 보고서. 교직원 가해: 학교폭력 사안접수 보고서와 성희롱·성폭력 사건 발생사실 통보서. 중대·긴급 사안(언론 보도 등)은 먼저 유선 보고. 피해자 신상은 익명 처리할 수 있다.","basis":"가이드북(양식 1-3), 경기도교육청 업무 안내서"},{"when":"보고와 함께","who":"학교장","what":"성평등가족부 사건 발생사실 통보(교직원 가해 등 기관 내 성폭력)","detail":"피해자의 명시적 반대가 없으면 지체 없이 통보한다.","basis":"성폭력방지법 제5조의4제1항"},{"when":"학생 간 사안","who":"전담조사관 또는 전담기구","what":"학교폭력 절차로 조사·전담기구 심의·심의위원회 요청","detail":"성 사안은 비밀유지·신변보호·2차 피해 방지에 특히 유의한다. 성범죄는 수사와 별개로 학교폭력 절차를 진행한다. 필요하면 성폭력 전문기관에 실태조사를 의뢰할 수 있다(심의위원회 위원장 심의, 학교장 명의).","basis":"학교폭력예방법 제14조제8항, 가이드북"},{"when":"교직원 가해 사안","who":"학교(피해 학생 조사)·교육지원청(가해 교직원 조사)","what":"사실확인과 성희롱·성폭력 고충심의 의뢰","detail":"피해 학생 조사는 원칙적으로 학교폭력 전담기구(또는 전담조사관)가 하고, 가해 교직원 조사는 성희롱·성폭력 사안 담당 조사위원이 한다. 학교폭력대책심의위원회는 가해자가 학생이 아니므로 피해학생 보호조치만 심의한다. 성고충심의위원회는 성희롱·성폭력 해당 여부, 피해자 보호·2차 피해 방지·재발 방지를 권고하고, 해당 시 감사(징계) 절차로 넘어간다.","basis":"경기도교육청 학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026)"},{"when":"교직원이 수사 대상이 된 경우","who":"임용권자(교육청)","what":"직위해제 검토","detail":"성범죄 등 비위로 수사기관에서 조사·수사 중이고 비위가 중대해 정상 업무를 기대하기 어려우면 직위를 부여하지 않을 수 있다. 학교는 수사 개시 통보 등 사실을 교육지원청에 신속히 보고한다.","basis":"국가공무원법 제73조의3제1항제6호"},{"when":"초기부터 계속","who":"전문상담교사·담임","what":"피해 학생 심리·의료·법률 지원 연계","detail":"위(Wee)클래스·위센터, 해바라기센터, 성폭력상담소, 1366. 학교에 나오지 못할 정도면 전문 상담기관 상담을 연계하고 학습 결손을 점검한다.","basis":"가이드북 성폭력 초기대응"},{"when":"사건을 안 날부터 3개월 이내","who":"학교장","what":"재발방지대책 수립·제출(기관 내 성폭력)","detail":"사건 처리 경과, 예방교육 개선, 피해자 불이익 금지·2차 피해 방지 등을 담는다. 발생사실을 통보하지 않은 경우에도 제출한다. 기관장 등에 의한 사건은 1개월 이내.","basis":"성폭력방지법 제5조의4제1항"},{"when":"종결 뒤에도","who":"담임·성고충상담원","what":"피해 학생 보호조치 이행과 2차 피해 모니터링","detail":"보호조치와 2차 피해 여부 점검은 모든 단계에서, 종결 뒤에도 계속한다.","basis":"경기도교육청 업무 안내서"}],"deadlines":[{"what":"수사기관 신고","limit":"직무상 알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자(교사 포함)와 피해학생 분리","limit":"인지 즉시(학생 가해는 24시간 이내 방법 결정, 최대 7일)","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"교육(지원)청 보고","limit":"인지 후 48시간 이내(중대 사안은 유선 우선)","basis":"가이드북, 경기도교육청 업무 안내서"},{"what":"성평등가족부 발생사실 통보","limit":"지체 없이(피해자의 명시적 반대가 없을 때)","basis":"성폭력방지법 제5조의4제1항"},{"what":"재발방지대책 제출","limit":"사실을 안 날부터 3개월 이내(기관장 등에 의한 사건은 1개월)","basis":"성폭력방지법 제5조의4제1항"}],"dont":["피해 학생이나 보호자가 원하지 않는다고 신고를 미루거나 SPO 상담으로 대신하지 않는다","사실 확인한다며 피해 학생에게 같은 내용을 반복해서 묻거나 가해자와 대질시키지 않는다","교직원 가해 사안을 학교 안에서 조용히 사과·합의로 끝내려 하지 않는다","피해 학생 이름·반·사진 등 신원을 알 수 있는 정보를 교직원 메신저·회의·학급에 공유하지 않는다","'왜 그 자리에 갔어?' '장난이었을 거야'처럼 피해자를 탓하거나 가해자를 두둔하는 말을 하지 않는다","가해 교직원을 피해 학생과 같은 수업·공간에 그대로 두지 않는다"],"contacts":[{"name":"경찰 긴급신고","tel":"112","note":"긴급 상황"},{"name":"학교폭력 신고센터","tel":"117","note":"24시간, 학생 사안 신고는 수사기관 신고로 봄"},{"name":"여성긴급전화","tel":"1366","note":"24시간 365일, 해바라기센터·성폭력상담소 연계"},{"name":"청소년 상담","tel":"1388","note":"24시간"},{"name":"대한법률구조공단","tel":"132","note":"무료 법률상담"},{"name":"관할 경찰서 여성청소년과","tel":"","note":"긴급하지 않은 경우 신고서 공문 발송처"},{"name":"관할 교육지원청 학교폭력·성고충 담당","tel":"","note":"48시간 이내 보고, 중대 사안 유선 보고"}],"forms":["학교폭력 신고 접수 대장(학교폭력 가이드북 양식 1-1)","가해자와 피해학생 분리 의사 확인서(양식 1-2)","학교폭력 사안 접수 보고서(양식 1-3)","아동·청소년 대상 성범죄 신고서(경찰서 공문 신고용)","성희롱·성폭력 사건 발생사실 통보서","성희롱·성폭력 신고 및 사실확인(조사) 신청서","민감정보처리 동의서","비밀유지 서약서","성고충(성희롱·성폭력) 상담일지","성희롱·성폭력 사건 재발방지대책 보고서"],"law":[{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항(아동·청소년대상 성범죄의 신고)","point":"초·중등학교 등 기관의 장과 종사자는 직무상 아동·청소년대상 성범죄 발생 사실을 알게 된 때 즉시 수사기관에 신고해야 함"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제67조제4항제1호(과태료)","point":"직무상 알고도 신고하지 않거나 거짓으로 신고하면 300만원 이하 과태료"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제31조(비밀누설 금지)","point":"누구든지 피해 아동·청소년의 주소·성명·학교·용모 등 특정 가능한 정보를 인쇄물·방송·정보통신망으로 공개 금지, 위반 시 7년 이하 징역 또는 5천만원 이하 벌금"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제24조(피해자의 신원과 사생활 비밀 누설 금지)","point":"수사·재판 관여 공무원의 피해자 인적사항·사생활 누설 금지, 누구든지 동의 없이 피해자 특정 정보를 공개 금지"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제2항, 제63조제1항제2호","point":"직무상 아동학대범죄를 알거나 의심되면 즉시 신고, 정당한 사유 없이 미신고 시 1천만원 이하 과태료"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제2조제1호, 제16조제1항","point":"성폭력은 학교폭력에 포함, 학교장은 인지 시 가해자(교사 포함)와 피해학생을 지체 없이 분리"},{"name":"성폭력방지 및 피해자보호 등에 관한 법률","article":"제5조의4(성폭력 사건 발생 시 조치)","point":"기관 내 성폭력 발생 시 피해자 반대가 없으면 성평등가족부에 지체 없이 통보, 3개월(기관장 등 사건은 1개월) 안에 재발방지대책 제출, 피해자 보호 위한 근무장소 변경 등 조치(피해자 의사에 반하면 안 됨), 사건처리 관여자 비밀누설 금지"},{"name":"국가공무원법","article":"제73조의3제1항제6호(직위해제)","point":"성범죄 등 비위로 감사원·수사기관에서 조사·수사 중이며 비위가 중대해 정상 업무를 기대하기 현저히 어려운 사람은 직위해제 가능"}],"faq":[{"q":"피해 학생이 '절대 경찰에 알리지 말아 달라'고 부탁했어요.","a":"학교장과 교직원은 직무상 알게 된 학생 대상 성범죄를 피해자 의사와 관계없이 즉시 신고해야 합니다(청소년성보호법 제34조제2항). 신고하지 않으면 300만원 이하 과태료 대상입니다. 신고 의무가 왜 있는지 피해 학생 측에 설명하고, 신고할 때 피해 학생 측 의사를 수사기관에 충분히 전달합니다."},{"q":"SPO(학교전담경찰관)에게 이야기했으면 신고한 것 아닌가요?","a":"아닙니다. 교육부 가이드북은 SPO를 통한 '상담'은 신고로 볼 수 없다고 안내합니다. 112나 117에 신고 의사를 분명히 밝히거나 관할 경찰서에 신고서를 보내야 합니다. 117 신고는 학생 사안에서 수사기관 신고로 봅니다."},{"q":"학생끼리 성희롱(성적인 말·장난)도 학교폭력으로 처리하나요?","a":"학교폭력예방법상 학교폭력에는 성폭력과 정신적 피해를 주는 행위가 포함되므로, 학생 간 성희롱·성폭력은 학교폭력 사안처리 절차(접수·분리·보고·조사·심의)를 따릅니다. 형사상 성범죄에 해당하는 행위(추행, 불법촬영 등)이면 수사기관 신고를 함께 합니다."},{"q":"가해자가 교사예요. 학교폭력대책심의위원회에서 처리하나요?","a":"학교폭력예방법은 분리 대상 가해자에 교사를 포함하므로 학교장은 즉시 분리합니다. 가해자가 학생이 아닌 경우 학교장 자체해결 대상이 아니며, 심의위원회에서는 피해학생 보호조치만 다룹니다. 가해 교직원은 수사기관 신고, 교육지원청 보고, 성희롱·성폭력 사안 조사·고충심의, 감사·징계 절차로 처리되고, 수사 중이며 비위가 중대하면 직위해제될 수 있습니다."},{"q":"교직원끼리 공유해야 대응할 수 있지 않나요? 어디까지 알려도 되나요?","a":"학교장과 사안 처리에 필요한 관련 교원 외에는 알지 못하도록 철저히 비밀을 지키는 것이 원칙입니다. 학교폭력 업무 관련자의 비밀 누설은 1년 이하 징역 또는 1천만원 이하 벌금(학교폭력예방법 제22조) 대상이고, 피해 학생을 특정할 수 있는 정보를 공개하면 청소년성보호법 제31조로 처벌될 수 있습니다."},{"q":"피해 학생이 방과 후 전화로 피해를 알려 왔어요.","a":"안전을 확인하고, 씻지 말고 그대로 병·의원(해바라기센터)에 가도록 안내하며, 가해자 정보와 피해 상황 사진 등 증거를 최대한 남기도록 알립니다. 긴급하면 경찰에 신고할 수 있음을 알리고, 다음 날 학교에서 전담기구에 알려 절차를 시작합니다."}],"record":"학생 간 사안은 학교폭력 심의위원회 조치결정 후 가해학생 조치를 학교생활기록부 '학교폭력 조치상황 관리'란에 기재한다(학교폭력 사안 항목 참조). 피해 학생 관련 내용은 학생부에 적지 않는다. 교육(지원)청 보고는 48시간 이내이며, 교직원 가해 사안은 학교폭력 사안접수 보고서와 함께 성희롱·성폭력 사건 발생사실 통보서를 제출한다. 보고 문서의 피해자 신상은 익명 처리하고 공문은 비공개로 한다. 기관 내 성폭력은 성평등가족부 통보(피해자 반대 없을 때)와 3개월 이내 재발방지대책 제출이 따로 있다.","sources":[{"title":"학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026.2.1. 기준, 2025.9.1. 이후 접수 사안 적용)","publisher":"경기도교육청(교육부·한국여성정책연구원 2025 「학교 내 성희롱·성폭력 사안 대응 업무 안내서」 참고)","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/03/bffe0d25-c24a-4f6d-ab15-572e551528b3.pdf"},{"title":"학교 내 성희롱·성폭력 사안 대응 업무 가이드(교육부 2023 가이드 기반 경기 보완판)","publisher":"경기도교육청","year":2025,"url":"https://www.goe.go.kr/resource/old/BBSMSTR_000000030138/BBS_202502281013489530.pdf"},{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"아동·청소년의 성보호에 관한 법률 [시행 2026. 5. 12.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동ㆍ청소년의성보호에관한법률"},{"title":"성폭력범죄의 처벌 등에 관한 특례법 [시행 2025. 10. 1.]","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/성폭력범죄의처벌등에관한특례법"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 [시행 2026. 9. 11.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/성폭력방지및피해자보호등에관한법률"},{"title":"국가공무원법 [시행 2026. 6. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"},{"title":"아동학대범죄의 처벌 등에 관한 특례법 [시행 2026. 8. 4.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"}],"verified":"2026-09-24","uncertain":["교육부·한국여성정책연구원 2025 「학교 내 성희롱·성폭력 사안 대응 업무 안내서」 원문 PDF는 찾지 못해, 이를 참고한 경기도교육청 2026 안내서로 확인함","경기도교육청은 2025.9.1.부터 학교 성고충심의위원회를 교육지원청으로 이관했음. 경북교육청이 교직원 가해 사안의 조사·성고충심의를 학교에서 하는지 교육지원청에서 하는지, 경북 보고 서식·번호는 확인 못 함","교육지원청 보고 '48시간 이내'는 법률 조문이 아니라 학교폭력 가이드북·교육청 안내서 운영 기준임","직위해제 조문은 국공립 교원 기준(국가공무원법). 사립학교 교직원은 사립학교법·정관에 따르며 확인 못 함","경기도교육청 안내서는 재발방지대책 미제출 시 성폭력방지법 제38조 과태료 가능성을 적었으나, 현행 제38조 조문에서는 해당 규정을 확인하지 못해 적지 않음","경북 해바라기센터 전화번호는 공식 원문으로 확인 못 해 적지 않음","성폭력방지법 제7조제2항(치료·상담 결석의 출석 인정, 2025.12.30. 신설)의 시행일과 학교 적용 방식은 확인 못 함"],"related":["school-violence","cyber-deepfake","child-abuse"]},{"id":"cyber-deepfake","title":"사이버폭력·불법촬영·딥페이크","aka":["딥페이크","합성사진","지인능욕","불법촬영","몰카","몰래 찍었어요","사진 유포","단톡방 성희롱","단톡방 괴롭힘","사이버폭력","영상 퍼졌어요","유포 협박","몸캠","성착취물","허위영상물"],"category":"학생 간 사안","urgency":"즉시","roles":["처음 알게 된 교직원","담임","학교폭력 책임교사","전문상담교사","학교장·교감"],"summary":"학생 얼굴·몸을 성적으로 합성한 딥페이크, 몰래 찍은 사진·영상, 그 유포·협박·소지·시청은 모두 성범죄이면서 학교폭력(사이버폭력)이다. 학생이 피해자이면 학교는 피해자 의사와 관계없이 즉시 수사기관에 신고하고, 학교폭력 절차를 함께 밟는다. 교사는 영상물을 직접 받거나 보관·전달하지 말고, 증거는 피해자 쪽 원본·URL·캡처로 확보해 경찰과 삭제지원기관에 넘긴다.","first":["피해 학생을 안심시킨다: '너의 잘못이 아니야'","학교장에게 보고하고 112 또는 117에 신고한다(학생 대상 성범죄는 피해자 의사와 무관)","영상·사진을 교사 휴대폰으로 받거나 저장·전달하지 않는다. 게시 주소(URL)·대화방 이름·시간만 적어 둔다","피해 학생 쪽 원본·URL·캡처는 지우지 말고 보존하게 한다","가해 관련 학생과 분리하고, 소문 확산을 막는다(피해자 특정 금지)"],"steps":[{"when":"인지 즉시","who":"알게 된 교직원","what":"피해 학생을 개별로 만나 안정시키고, 학교장·책임교사에게 보고","detail":"궁금한 점을 캐묻지 않는다. 진술이 오염돼 증거 가치가 떨어질 수 있으니 상황만 정리해 전문가에게 넘긴다. 제3자를 통해 알았으면 제보자에게 고맙다고 하고 다른 사람에게 말하지 않도록 당부한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"when":"인지 즉시","who":"학교장(또는 알게 된 교직원)","what":"수사기관 신고","detail":"학생이 피해자인 불법촬영·허위영상물(딥페이크)·유포·협박은 아동·청소년대상 성범죄이므로 피해 학생·보호자가 원하지 않아도 112 또는 117에 즉시 신고한다. 117에는 '신고'라고 분명히 밝힌다. SPO 상담은 신고가 아니다.","basis":"청소년성보호법 제34조제2항"},{"when":"신고와 함께","who":"책임교사","what":"학교폭력 사안으로 접수(신고접수대장), 보호자 통보, 48시간 이내 교육(지원)청 보고","detail":"가해자가 학생이면 사이버폭력으로 학교폭력 절차가 함께 진행된다. 성폭력·중대 사안은 유선으로 별도 보고. 공문은 비공개로 하고 피해자 인적사항은 최소화한다.","basis":"학교폭력예방법 제2조제1호의3, 제20조, 가이드북 양식 1-1·1-3"},{"when":"인지 후 24시간 이내","who":"학교장","what":"가해 관련 학생 분리와 제2호(접촉·협박·보복 금지) 조치","detail":"제2호는 온라인·휴대전화로 연락하는 것도 금지한다. 필요하면 긴급조치(피해 심리상담·일시보호, 가해 출석정지 등)를 검토한다.","basis":"학교폭력예방법 제16조제1항, 제17조제4항~제6항"},{"when":"초기","who":"담임·전문상담교사(보호자와 함께)","what":"증거 보존 안내","detail":"원본 사진·영상은 지우지 않고 피해 학생(보호자)이 보관한다. 게시된 사이트 주소(URL)와 유포 화면을 캡처하고, 협박 대화는 카카오톡·텔레그램 '대화 내보내기' 또는 캡처로 남긴다. 캡처 후에도 가능하면 대화방을 나가지 않고 알림만 끈다. 출처 모를 링크나 텔레그램 방에는 들어가지 않는다. 보호자가 쓰던 휴대폰을 증거로 관리하게 한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"when":"초기","who":"담임·보호자·피해 학생","what":"삭제·차단 지원 신청 연계","detail":"디지털성범죄피해자지원센터(02-735-8994, d4u.stop.or.kr)에 원본 또는 URL을 붙여 피해자 본인·보호자·위임 대리인이 신청한다. 원본·URL이 있으면 삭제·모니터링을 지원받고, 방송미디어통신심의위원회(1377, 3번)도 신고·접속차단을 지원한다. 경찰이 이미 영상물을 확보했으면 따로 첨부하지 않아도 된다. 교육감·교육장은 아동·청소년성착취물에 대해 피해 측 요청 없이도 삭제 지원을 요청할 수 있다.","basis":"성폭력방지법 제7조의3, 학교폭력예방법 제16조의4"},{"when":"초기","who":"전문상담교사·담임","what":"심리·의료·법률 지원 연계","detail":"위(Wee)클래스·위센터 상담, 1366·1388, 지역 디지털성범죄 피해자 지원센터(경북: 경북여성통합상담소 054-284-0404) 연계. 부모에게 알리기를 원치 않으면 설득하되, 미성년 피해자도 법정대리인 동의 없이 피해 신고·상담이 가능함을 안내한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"when":"소문이 퍼진 경우","who":"담임·학교","what":"전체 학생 대상 2차 피해 예방 교육","detail":"피해자가 특정되지 않게 한다. 영상을 보거나 갖고 있거나 다시 보내는 것도 범죄임을 알리고, 받은 파일은 퍼뜨리지 말고 신고하도록 지도한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용), 성폭력처벌법 제14조제4항·제14조의2제4항"},{"when":"사안조사","who":"학교폭력 전담조사관 또는 전담기구","what":"학교폭력 사안조사와 수사 협조","detail":"영상물 자체를 학교가 수집·열람하지 않고, 수사기관·삭제지원기관에 넘긴 사실과 URL·일시·유포 범위 등 정황으로 조사한다. 성 사안은 비밀유지와 신변보호에 특히 유의한다.","basis":"가이드북 사안조사 유의사항"},{"when":"조사 뒤","who":"학교장","what":"교육지원청 심의위원회 개최 요청","detail":"성폭력·보복 사안은 학교장 자체해결 요건(지속성·보복 여부 등)에 맞는지 전담기구가 엄격히 판단한다. 경찰 수사 중이라도 학교 절차는 따로 진행한다.","basis":"학교폭력예방법 제13조의2, 제13조"},{"when":"가해 학생 지도","who":"담임·상담교사","what":"재발 방지 교육·상담과 비밀 유지","detail":"장난·호기심이었어도 범죄임을 분명히 알게 한다. 가해 학생 보호자에게는 학생보다 먼저 상담하고, 관련 내용이 다른 학생에게 퍼지지 않게 한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"}],"deadlines":[{"what":"수사기관 신고(학생 피해 성범죄)","limit":"알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자-피해학생 분리 결정","limit":"인지 후 24시간 이내, 최대 7일","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"교육(지원)청 사안접수 보고","limit":"인지 후 48시간 이내(중대 사안은 유선 별도 보고)","basis":"가이드북(양식 1-3)"},{"what":"삭제지원","limit":"원본 또는 URL이 확보되면 지체 없이 신청(원본·URL 있으면 3년간, 연장 가능)","basis":"경기도교육청 학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026)"}],"dont":["교사 휴대폰으로 영상·사진을 받거나 내려받아 보관하지 않는다(소지·저장·시청도 처벌 대상)","확인하려고 동료·관리자·보호자에게 영상을 전달하거나 보여주지 않는다(제공·전시도 반포에 해당할 수 있음)","피해 학생에게 '왜 그런 사진을 찍었어/보냈어?'처럼 탓하거나 '보여주면 피해인지 알려줄게'라고 하지 않는다","증거를 확보하기 전에 먼저 삭제부터 하라고 하지 않는다","피해자 신원이 드러나는 방식으로 학급 전체에 공지하거나 캡처를 돌리지 않는다","출처 모를 링크나 텔레그램 방에 들어가 직접 찾아보지 않는다"],"contacts":[{"name":"경찰 긴급신고","tel":"112","note":"사이버범죄 신고시스템 ecrm.police.go.kr"},{"name":"학교폭력 신고센터","tel":"117","note":"24시간, 디지털 성폭력 지원기관 연결"},{"name":"디지털성범죄피해자지원센터(중앙)","tel":"02-735-8994","note":"365일, 삭제지원·유포 모니터링, 온라인 d4u.stop.or.kr"},{"name":"방송미디어통신심의위원회 디지털성범죄 신고","tel":"1377","note":"ARS 3번, 신고·삭제·접속차단"},{"name":"경북 지역 디지털성범죄 피해자 지원센터","tel":"054-284-0404","note":"(사)포항여성회 부설 경북여성통합상담소(교육부 SOS 가이드 부록 기준)"},{"name":"여성긴급전화","tel":"1366","note":"24시간 365일"},{"name":"청소년 상담","tel":"1388","note":"24시간 365일"},{"name":"대한법률구조공단","tel":"132","note":"무료 법률상담"}],"forms":["학교폭력 신고 접수 대장(가이드북 양식 1-1)","가해자와 피해학생 분리 의사 확인서(양식 1-2)","학교폭력 사안 접수 보고서(양식 1-3)","(피해·가해학생) 긴급조치 보고서(양식 2-3)","학교폭력 사안조사 보고서(양식 2-4)","디지털성범죄피해자지원센터 삭제지원 신청서(피해자 본인 확인 서류 포함)"],"law":[{"name":"학교폭력예방 및 대책에 관한 법률","article":"제2조제1호의3(사이버폭력)","point":"정보통신망을 이용한 따돌림, 학생의 얼굴·신체·음성을 성적으로 편집·합성한 딥페이크 영상 등의 제작·반포 등을 사이버폭력으로 정의"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제16조의4(사이버폭력의 피해자 지원)","point":"국가가 유포된 촬영물등 삭제를 지원, 피해학생·보호자·대리인이 요청. 아동·청소년성착취물은 교육감·교육장이 요청 없이도 삭제지원 요청 가능. 비용은 가해학생·보호자 부담"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조(카메라 등을 이용한 촬영)","point":"의사에 반한 촬영·반포 7년 이하 징역 또는 5천만원 이하 벌금, 촬영물 소지·구입·저장·시청 3년 이하 징역 또는 3천만원 이하 벌금(제4항)"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조의2(허위영상물 등의 반포등)","point":"2024.10.16. 개정: 반포 목적 없이 편집·합성만 해도 7년 이하 징역 또는 5천만원 이하 벌금, 소지·구입·저장·시청 3년 이하 징역 또는 3천만원 이하 벌금(제4항 신설)"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조의3(촬영물과 편집물 등을 이용한 협박·강요)","point":"협박 1년 이상 유기징역, 강요 3년 이상 유기징역"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제11조(아동·청소년성착취물의 제작·배포 등)","point":"제작 무기 또는 5년 이상, 배포·제공 3년 이상 유기징역, 구입·소지·시청 1년 이상 유기징역(제5항)"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제11조의2(성착취물을 이용한 협박·강요)","point":"2024.10.16. 신설: 협박 3년 이상, 강요 5년 이상 유기징역"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항, 제67조제4항","point":"학교의 장과 종사자는 직무상 알게 된 아동·청소년대상 성범죄를 즉시 수사기관에 신고, 미신고·거짓신고 시 300만원 이하 과태료"},{"name":"성폭력방지 및 피해자보호 등에 관한 법률","article":"제7조의3(불법촬영물등으로 인한 피해자에 대한 지원 등)","point":"불법촬영물·허위영상물·성착취물과 피해자 신상정보 삭제 지원, 피해자·가족·대리인 요청, 성착취물은 요청 없이도 삭제 지원"},{"name":"정보통신망 이용촉진 및 정보보호 등에 관한 법률","article":"제44조의2(정보의 삭제요청 등)","point":"권리 침해 정보는 서비스 제공자에게 삭제·반박 게재 요청 가능, 판단이 어려우면 30일 이내 임시조치"}],"faq":[{"q":"증거로 남겨야 하니 교사가 영상을 받아서 저장해 두면 안 되나요?","a":"하지 않는 것이 안전합니다. 현행법은 불법촬영물·허위영상물의 소지·구입·저장·시청(성폭력처벌법 제14조제4항, 제14조의2제4항)과 아동·청소년성착취물의 소지·시청(청소년성보호법 제11조제5항)을 처벌하고, 증거 보관에 대한 교사 예외 규정은 없습니다. 교육부 SOS 가이드도 증거는 피해 학생·보호자가 원본을 지우지 않고 보관하고, URL·캡처·대화 내보내기로 확보해 경찰과 삭제지원기관에 넘기도록 안내합니다. 교사는 게시 위치·시간·대화방 이름 같은 정황만 기록하세요."},{"q":"피해 학생이 '경찰은 싫다, 부모님께도 알리지 말아 달라'고 해요.","a":"학생이 피해자인 성범죄는 학교장과 교직원에게 즉시 신고 의무가 있어 피해자 의사와 관계없이 신고해야 합니다(청소년성보호법 제34조제2항, 미신고 시 300만원 이하 과태료). 신고 과정에서 피해 학생 측 의사를 수사기관에 충분히 전하고, 부모에게 알리는 것이 왜 필요한지 설득합니다. 경찰 조사 때는 가명 사용, 신뢰관계인 동석, 신변보호 요청이 가능하다고 알려 주면 도움이 됩니다."},{"q":"딥페이크를 만든 학생이 '올리지 않고 혼자만 갖고 있었다'고 해요. 그래도 범죄인가요?","a":"네. 2024.10.16. 개정으로 반포 목적이 없어도 의사에 반해 성적으로 편집·합성하면 7년 이하 징역 또는 5천만원 이하 벌금이고, 소지·저장·시청만 해도 3년 이하 징역 또는 3천만원 이하 벌금입니다(성폭력처벌법 제14조의2). 학교폭력예방법상 사이버폭력에도 해당합니다."},{"q":"삭제는 누가 신청하나요? 학교가 대신 할 수 있나요?","a":"디지털성범죄피해자지원센터 삭제지원은 피해자 본인, 가족(배우자·직계친족·형제자매), 피해자가 지정한 대리인이 원본이나 URL을 붙여 신청합니다. 학교는 연계와 안내를 돕고, 교육감·교육장은 아동·청소년성착취물에 대해 피해 측 요청 없이도 국가에 삭제 지원을 요청할 수 있습니다(학교폭력예방법 제16조의4제3항)."},{"q":"경찰에 신고했는데 학교폭력 절차도 따로 해야 하나요?","a":"네. 가해자가 학생이면 학교폭력(사이버폭력) 사안으로 접수·분리·보고·조사·심의를 그대로 진행합니다. 형사 절차와 학교폭력 절차는 별개입니다."},{"q":"다른 학생들이 영상을 돌려 봤다고 해요. 그 학생들도 문제가 되나요?","a":"다시 보내거나 보여주는 것은 반포(유포)에, 받아서 갖고 있거나 보는 것은 소지·시청에 해당할 수 있어 처벌 대상입니다. 소문이 퍼졌다면 피해자가 특정되지 않게 전체 학생에게 2차 피해 예방 교육을 하고, 받은 파일은 퍼뜨리지 말고 신고하도록 지도합니다."}],"record":"가해자가 학생이면 학교폭력 절차에 따라 심의위원회 조치결정 후 가해학생 조치사항을 학교생활기록부 '학교폭력 조치상황 관리'란에 기재한다(세부는 학교폭력 사안 항목 참조). 교육(지원)청 사안접수 보고는 48시간 이내, 성 사안은 유선으로 별도 보고한다. 보고 공문·조사 기록에 영상물 파일이나 캡처 이미지를 첨부하지 않고, 피해자 신상정보는 최소화하며 공문은 비공개로 설정한다.","sources":[{"title":"디지털 성폭력 SOS 가이드(교사용)","publisher":"교육부 양성평등정책담당관","year":2025,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=316&boardSeq=103235&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=0302&opType=N"},{"title":"학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026.2.1. 기준, 디지털 성폭력의 대응과 지원)","publisher":"경기도교육청","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/03/bffe0d25-c24a-4f6d-ab15-572e551528b3.pdf"},{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"성폭력범죄의 처벌 등에 관한 특례법 [시행 2025. 10. 1.]","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/성폭력범죄의처벌등에관한특례법"},{"title":"아동·청소년의 성보호에 관한 법률 [시행 2026. 5. 12.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동ㆍ청소년의성보호에관한법률"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 [시행 2026. 9. 11.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/성폭력방지및피해자보호등에관한법률"},{"title":"학교폭력예방 및 대책에 관한 법률 [시행 2026. 6. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률"},{"title":"학교 허위합성물(딥페이크) 대응 긴급 브리핑","publisher":"교육부(대한민국 정책브리핑)","year":2024,"url":"https://www.korea.kr/briefing/policyBriefingView.do?newsId=156647740"}],"verified":"2026-09-24","uncertain":["'교사가 영상을 내려받거나 전달하면 안 된다'는 문장을 그대로 적은 교육부 공식 지침은 찾지 못함. 소지·저장·시청·반포 처벌 조문과 SOS 가이드의 '피해물을 시청·소지·재전송하지 않기'·'직접 도와주겠다 하지 말고 전문기관에' 안내에서 도출한 내용임","방송통신심의위원회는 법률상 '방송미디어통신심의위원회'로 이름이 바뀜(정보통신망법 현행 조문 기준). 1377번(ARS 3번)은 2026.2. 경기도교육청 안내서 기준이며 명칭 변경 뒤에도 같은지 재확인 필요","경북 지역 디지털성범죄 피해자 지원센터 번호(054-284-0404)는 교육부 SOS 가이드(2025.1. 발행) 부록 기준으로, 이후 지정 기관 변경 여부는 확인 못 함","삭제지원 '3년(연장 가능)' 기간은 경기도교육청 안내서 기재 내용이며 성평등가족부 원문(시행규칙)으로는 확인 못 함","경북교육청의 딥페이크 사안 보고 서식·연락처(교육지원청 담당 부서)는 확인 못 함","교육부 SOS 가이드는 2024년 12월 인쇄·2025년 1월 발행(게시 2025.4.)임"],"related":["school-violence","sexual-violence","student-photo-sns"]},{"id":"safety-accident","title":"교내 안전사고(부상)","aka":["체육시간 부상","다쳤어요","넘어졌어요","골절","머리 부딪힘","뼈 부러짐","발목 접질림","쓰러졌어요","학교안전공제","안전공제회 청구","치료비 청구","사고통지","공제급여","학교에서 다침","치아 부러짐"],"category":"안전·보건","urgency":"즉시","roles":["최초 발견 교사(수업 교사)","보건교사","담임","교감","학교장","행정실(공제 담당)","보호자"],"summary":"수업·쉬는 시간·등하교·체험학습 등 교육활동 중 학생이 다치면 ‘학교안전사고’다(학교안전법 제2조). 순서는 ①생명 확인·119·응급처치 ②보호자 연락·병원 ③기록·학교장 보고 ④학교안전공제회 사고통지(학교장, 지체 없이) ⑤보호자에게 공제 청구 안내 ⑥보호자 청구(3년 시효) ⑦공제회 결정(14일) ⑧불복 시 심사청구(90일)→재심사청구(90일)→소송. 안전사고관리 지침에 따라 안전조치 의무를 다한 교직원은 민사·형사 책임을 지지 않는다(제10조 제5항).","first":["다친 학생 곁을 떠나지 말고 의식·호흡부터 본다 — 반응 없고 숨이 이상하면 즉시 119, 가슴압박, AED","머리·목·허리를 다쳤거나 의식이 흐리면 일으키거나 옮기지 말고 119를 부른다","주변 교사·학생에게 보건교사 호출과 119 신고를 이름 찍어 나눠 맡긴다","응급처치가 끝나면 담임을 통해 보호자에게 바로 알리고, 병원 이송 시 교직원이 동행한다","사고 시각·장소·경위·목격자·조치를 바로 메모해 둔다(사고통지·공제 청구의 기초)"],"steps":[{"stage":"알게 됨·신고","when":"사고 즉시","who":"최초 발견 교직원","what":"현장 안전 확인 → 반응·호흡 확인(Check)","detail":"교직원은 ①의식을 잃고 쓰러짐 ②깨워도 반응 없음 ③호흡이 없거나 헐떡이는 호흡, 3가지로 심장정지 여부를 본다. 두부·척추 손상 등 외상으로 의식이 계속 없으면 즉시 119 대상이다.","basis":"교육부 학교 응급상황 대응 가이드라인(2025) 제1장 표1-1, 제2장 Ⅲ"},{"stage":"알게 됨·신고","when":"사고 즉시","who":"최초 발견 교직원·주변 교직원","what":"119 신고와 보건교사 호출(Call)","detail":"심장정지·응급증상(의식장애, 구토·의식장애 동반 두부손상, 개방성·다발성 골절, 대퇴부·척추 골절, 지혈 안 되는 출혈 등)이면 119. 해당하지 않으면 보건교사에게 연락해 보건실 처치 또는 보호자 연락 후 병원 진료 안내. 주변 교직원에게 도움을 청한다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-2·표1-5; 응급의료법 시행규칙 별표1"},{"stage":"초기 대응","when":"119 도착 전","who":"최초 발견 교직원·보건교사","what":"응급처치(Care)","detail":"심장정지면 가슴압박(분당 100~120회, 가슴 아래쪽 절반)과 AED. 골절·염좌는 움직이지 않게 하고(Rest) 이동 전에 부목으로 고정, 변형된 팔다리는 되돌리려 하지 말고 그대로 고정. 머리·척추 손상 의심자는 머리 기울임-턱 들기 기도유지법을 쓰지 않는다. 출혈은 직접 압박.","basis":"학교 응급상황 대응 가이드라인(2025) 제2장 Ⅰ·Ⅲ·Ⅵ·ⅩⅠ"},{"stage":"초기 대응","when":"응급처치 직후","who":"담임(부재 시 이송담당 교직원)","what":"보호자 연락, 교감 보고","detail":"초기 대응이 끝나면 담임에게 상황을 알리고, 교감·학교장에게 보고하며, 보호자에게 연락한다. 응급처치로 끝나면 담임이 보호자에게 경위를 설명하고 학생을 인계한다.","basis":"학교 응급상황 대응 가이드라인(2025) 그림1-1 설명"},{"stage":"초기 대응","when":"이송 시","who":"담임 또는 이송담당 교직원","what":"병원 동행, 보호자 인계까지 보호","detail":"119 구급대가 오면 담임이나 이송담당 교직원이 동행한다. 119 이송이 불가해 학교 차량으로 옮기면 의료기관 정보를 보호자에게 알린다. 지속 관찰이 필요한 환자를 학교 차로 옮길 때 보건교사는 운전자에서 뺀다. 교감은 보건교사·담임의 공백 수업·보건실에 대체 교사를 배치한다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-4, 그림1-4 주"},{"stage":"초기 대응","when":"당일","who":"학교장·인솔교사","what":"교육청 보고","detail":"학교장과 인솔교사는 교육활동 중 사고·위급상황에 대해 안전사고관리 지침에 따라 즉시 안전조치를 한 뒤 교육부장관 또는 교육감에게 즉시 보고해야 한다. 경북의 구체 보고 기준·양식은 교육청 공문을 따른다.","basis":"학교안전법 제10조 제4항"},{"stage":"조사·확인","when":"당일~다음 날","who":"수업 교사·목격 교직원·보건교사","what":"사고 기록 남기기","detail":"일시·장소·활동 내용·경위(6하원칙)·목격자·응급처치 내용·이송 병원을 적는다. 보건교사는 응급환자 기록지/보건일지, 이송·사고 기록지를 작성한다. 경북학교안전공제회 서식자료에 사고경위서·목격자확인서·사고확인서 양식이 있다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-4; 경북학교안전공제회 서식자료(2025.4.17. 게시)"},{"stage":"조치·이행","when":"사고 후 지체 없이","who":"학교장(공제가입자) — 실무는 행정실·담당자","what":"학교안전공제회에 사고발생 통지","detail":"학교안전사고보상지원시스템(www.schoolsafe.or.kr)에 학교 ID로 로그인 → 사고통지서를 6하원칙으로 작성 → 학교장 결재(온라인 결재 시 자동 통보, 오프라인 결재 시 결재파일 첨부 후 통보 버튼) → 공제회 ‘접수’가 되어야 보호자가 공제급여를 청구할 수 있다. 통지하지 않거나 거짓 통지 시 50만원 이하 과태료.","basis":"학교안전법 제44조 제2항·제72조 제2항 제2호; 같은 법 시행규칙 제5조의2(별지 제2호서식); 경북학교안전공제회 보상절차 안내"},{"stage":"조치·이행","when":"사고 발생 시","who":"학교장(공제가입자)","what":"보호자에게 학교안전공제 안내","detail":"공제급여 청구 방법·처리 절차·지급 방법 등을 피공제자(미성년 학생이면 보호자에게도) 안내해야 한다. 방법은 서면 교부, 우편·전자우편, 전화·팩스, 휴대전화 문자 등 중 하나.","basis":"학교안전법 제41조의2(2025.7.22. 시행); 같은 법 시행령 제20조의3"},{"stage":"조치·이행","when":"치료 중·치료 후","who":"보호자(청구인)","what":"공제급여 청구","detail":"보호자가 PC·스마트폰에서 휴대폰 본인인증으로 schoolsafe.or.kr에 로그인해 사고통지서를 조회하고 청구서를 입력·출력해 해당 공제회에 보낸다. 서식은 공제급여청구서(시행규칙 별지 제1호서식)이고, 청구 이유를 증명하는 자료(진료비 영수증 등)를 붙인다. 청구서는 학교(공제가입자) 또는 공제회에 낼 수 있고, 학교가 받으면 지체 없이 공제회로 보낸다.","basis":"학교안전법 제41조 제1항; 같은 법 시행규칙 제3조; 경북학교안전공제회 공제급여 청구 안내"},{"stage":"심의·결정","when":"청구받은 날부터 14일 이내","who":"학교안전공제회","what":"지급 여부 결정","detail":"조사 필요 등 정당한 사유가 있으면 14일 연장할 수 있고, 연장 시 처음 기간이 끝나기 전 사유를 청구인에게 통지한다. 공제회는 사고 장소 방문 조사, 진료기록 열람을 할 수 있고, 학교·보호자는 정당한 사유 없이 조사를 방해하거나 자료 제출을 거부하면 안 된다.","basis":"학교안전법 제41조 제2항·제3항, 제42조"},{"stage":"조치·이행","when":"지급 결정 후","who":"학교안전공제회","what":"지급(필요하면 먼저 지급)","detail":"지급 결정 시 지체 없이 지급. 청구인이 신청하거나 공제회가 필요하다고 보면 결정 전에도 전부 또는 일부를 먼저 줄 수 있다. 결과는 학교에 결정통보서, 보호자에게 알림톡·SMS로 통보된다.","basis":"학교안전법 제41조 제4항; 시행규칙 제3조 제4항; 경북학교안전공제회 안내"},{"stage":"심의·결정","when":"부지급·일부 지급 결정 시","who":"학교안전공제회","what":"이유 통지와 불복 안내","detail":"전부·일부를 지급하지 않기로 하면 공제가입자(학교)와 청구인에게 지체 없이 이유를 알리고, 심사청구를 할 수 있다는 사실과 절차·기간을 알려야 한다.","basis":"학교안전법 제41조 제5항"},{"stage":"불복·구제","when":"결정이 있음을 안 날부터 90일 이내","who":"공제급여 결정에 불복하는 자(보호자 등)","what":"심사청구","detail":"청구처는 해당 공제회의 학교안전공제보상심사위원회. 천재지변 등 불가항력 기간은 빼고 센다. 심사위원회는 청구받은 날부터 60일 이내 결정(부득이하면 한 차례 1개월 이내 연장). 출석·의견진술, 증거 제출, 전문가 감정을 신청할 수 있다.","basis":"학교안전법 제57조, 제58조, 제59조"},{"stage":"불복·구제","when":"심사 결정서 정본이 송달된 날부터 90일 이내","who":"심사 결정에 불복하는 자","what":"재심사청구","detail":"청구처는 학교안전공제중앙회에 둔 학교안전공제보상재심사위원회. 결
