s://www.gbe.kr/kbssia/main.do"}],"verified":"2026-09-24","uncertain":["경북교육청의 재난 피해 보고 서식·보고 시한(예: 몇 시간 이내)은 매뉴얼에 '신속 보고'로만 되어 있어 확인 못 함","매뉴얼 파일은 인천 갈월초 게시본(파일명 2025)으로 받아 읽었고, 판권면 발행일은 2024년 12월 — 교육부 게시 원본 PDF 주소는 공공데이터포털 목록만 확인","시설 피해 공제(한국교육시설안전원)의 청구 기한·불복 절차는 확인하지 못함"],"related":["safety-accident","emergency-medical"]},{"id":"privacy-leak","title":"개인정보 유출(오발송·단톡방 게시·USB 분실)","aka":["개인정보 유출","성적표 잘못 보냄","명렬표 잘못 보냄","문자 오발송","메일 잘못 보냄","단톡방에 학생 정보","학부모 단톡방 명단","USB 분실","노트북 분실","생기부 유출","상담기록 유출","엑셀 숨김시트","홈페이지 첨부파일 개인정보","개인정보 신고","72시간"],"category":"행정·정보","urgency":"당일","roles":["유출을 낸 교직원","담임","분야별책임자(유출 부서의 장)","학교 개인정보 보호담당자","개인정보 보호책임자","교감","교장"],"summary":"학생·학부모·교직원 개인정보가 학교 통제를 벗어나 제3자가 볼 수 있게 된 순간 '유출등'이다. 1명이라도 유출되면 알게 된 때부터 72시간 안에 정보주체(학생·보호자)에게 통지하고, 상급기관을 거쳐 교육부에 신고한다(1천명 이상·민감정보·고유식별정보·해킹이면 개인정보보호위원회/한국인터넷진흥원에도 동시에). 회수·삭제를 먼저, 숨기지 않고 보고하는 것이 핵심이다.","first":["더 퍼지지 않게 막는다: 메일 회수, 단톡방 메시지 삭제, 게시물·첨부파일 내리기, 받은 사람에게 삭제 요청","받은 사람에게 삭제를 부탁하고 '삭제 전·후 화면'을 증빙으로 받아 둔다","무엇이(항목)·몇 명·언제·어떻게 나갔는지 메모하고 화면을 캡처해 둔다","즉시 부서장·학교 개인정보 보호담당자·교감에게 알린다 — 72시간 시계는 '알게 된 때'부터 돈다","혼자 조용히 해결하려 하지 않는다: 1명이라도 통지·신고 대상이다"],"steps":[{"stage":"알게 됨·신고","when":"유출을 알게 된 즉시","who":"알게 된 교직원","what":"유출 사실 확인 및 시각 기록","detail":"잘못 보낸 문자·메일·단톡방 게시, 분실한 USB·노트북·출력물, 홈페이지 첨부파일 노출 등. '알게 된 시각'을 적어 둔다(통지·신고 72시간의 기준점).","basis":"개인정보 보호법 시행령 제39조·제40조"},{"stage":"초기 대응","when":"즉시","who":"유출을 낸 교직원","what":"확산 차단·회수·삭제","detail":"메일은 회수 기능으로 즉시 회수, 불가능하면 수신자에게 삭제 요청하고 삭제 전·후 목록 화면을 증빙으로 받는다. 대용량 첨부 서버를 쓴 경우 그 파일도 삭제 요청. 게시판 첨부는 내리고 개인정보 부분을 삭제·마스킹해 필요하면 다시 게시한다.","basis":"개인정보 보호법 제34조제3항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 3.3·3.4"},{"stage":"초기 대응","when":"즉시","who":"유출을 낸 교직원","what":"관리자·보호담당자에게 보고","detail":"분야별책임자(유출 부서의 장)와 학교 개인정보 보호담당자, 교감·교장에게 알린다. 통지·신고는 개인 판단으로 미루지 않는다.","basis":"교육부 개인정보 보호지침 제13조"},{"stage":"조사·확인","when":"당일","who":"분야별책임자·보호담당자","what":"유출 범위 확인","detail":"유출된 항목(이름·연락처·성적·주민등록번호·건강정보 등), 인원 수, 시점과 경위, 받은 사람, 회수·삭제 여부를 정리한다. 민감정보(건강 등)·고유식별정보(주민등록번호 등) 포함 여부와 1천명 이상인지, 해킹 등 외부 불법접근인지를 확인한다 — 신고처가 달라진다.","basis":"개인정보 보호법 시행령 제40조제1항"},{"stage":"조사·확인","when":"당일","who":"분야별책임자","what":"엑셀 등 파일 숨은 정보 점검","detail":"엑셀은 숨김 행·열·시트, 피벗테이블, OLE 개체 등으로 보이지 않는 개인정보가 같이 나갈 수 있다. 원본 파일 전체를 열어 실제로 나간 범위를 확인한다.","basis":"서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 3.4"},{"stage":"조치·이행","when":"알게 된 때부터 72시간 이내","who":"분야별책임자(유출 부서의 장)","what":"정보주체(학생·보호자)에게 통지","detail":"서면·전자우편·문자 등으로 ①유출 항목 ②시점과 경위 ③피해를 줄이기 위해 할 수 있는 방법 ④학교의 대응조치와 피해구제 절차 ⑤피해 신고·상담 부서와 연락처 ⑥손해배상·분쟁조정 등 법적 권리와 행사 방법을 알린다. 구체 내용을 다 확인 못 했으면 유출 사실과 확인된 내용부터 먼저 알리고 추가로 확인되는 대로 즉시 알린다.","basis":"개인정보 보호법 제34조제1항, 시행령 제39조제1항·제2항"},{"stage":"조치·이행","when":"통지가 불가능할 때","who":"학교","what":"통지 갈음 게시","detail":"연락처를 모르는 등 정당한 사유가 있으면 통지 항목을 학교 홈페이지에 30일 이상 게시하는 것으로 갈음할 수 있다. 홈페이지가 없으면 보기 쉬운 장소에 30일 이상 게시.","basis":"개인정보 보호법 시행령 제39조제3항"},{"stage":"조치·이행","when":"72시간 이내","who":"학교(분야별책임자·보호담당자)","what":"상급기관을 경유해 교육부에 신고","detail":"1명이라도 유출되면 유출 내용과 조치 결과를 72시간 내에 상급기관을 거쳐 교육부에 신고한다. 신고서는 교육부 개인정보 보호지침 별지 제5호서식, 교육부 개인정보보호 포털(privacy.moe.go.kr)로 제출. 포털·전자우편으로 할 시간이 없으면 전화로 먼저 신고하고 신고서를 나중에 낸다.","basis":"교육부 개인정보 보호지침 제13조제1항·제3항·제4항"},{"stage":"조치·이행","when":"72시간 이내(해당 시)","who":"학교","what":"개인정보보호위원회 또는 한국인터넷진흥원에 동시 신고","detail":"①1천명 이상 ②민감정보·고유식별정보 유출 ③외부 불법접근(해킹 등)에 의한 유출 중 하나라도 해당하면 교육부 신고와 동시에 보호위원회 또는 한국인터넷진흥원에도 신고한다(개인정보 포털 privacy.go.kr).","basis":"개인정보 보호법 제34조제4항, 시행령 제40조제1항·제3항, 교육부 개인정보 보호지침 제13조제1항 단서"},{"stage":"조치·이행","when":"신고 여부 판단 시","who":"개인정보 보호책임자","what":"신고 예외 검토","detail":"유출 경로가 확인되고 해당 개인정보를 회수·삭제하는 등으로 정보주체의 권익 침해 가능성이 현저히 낮아졌다면 신고하지 않을 수 있다. 다만 이 예외는 '신고'에 관한 것이다. 통지는 긴급조치(회수·삭제 등)가 필요한 동안 늦출 수 있을 뿐, 사유가 해소되면 즉시 알려야 한다.","basis":"개인정보 보호법 시행령 제40조제1항 단서, 제39조제1항제1호, 교육부 개인정보 보호지침 제13조제2항"},{"stage":"조치·이행","when":"신고 후 추가 확인 시","who":"학교","what":"추가 신고·추가 통지","detail":"처음 신고 때 항목·경위를 다 확인 못 했으면 확인된 내용부터 신고하고, 추가로 확인되는 내용은 확인 즉시 신고한다.","basis":"개인정보 보호법 시행령 제40조제2항, 교육부 개인정보 보호지침 제13조제5항"},{"stage":"초기 대응","when":"통지 직후","who":"분야별책임자","what":"민원 창구 단일화","detail":"전화·메일 등 한 가지 이상 창구를 정해 학부모 문의를 한곳에서 받는다. 다른 교직원이 문의를 받으면 그 창구로 연결한다. 비밀번호가 나갔으면 변경 방법을, 다량 유출이면 보이스피싱 등 2차 피해 예방을 함께 안내한다.","basis":"서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 2.3~2.5"},{"stage":"조사·확인","when":"신고 후","who":"학교(개인정보 보호책임자)","what":"원인 조사와 재발방지 계획","detail":"유출 원인을 조사하고 ①원인 보완·재발방지 조치계획 수립·이행 ②전 직원 사례 전파·재발방지 교육 ③그 밖에 필요한 조치를 한다. 사례 전파 때 유출자 등 또 다른 개인정보가 드러나지 않게 한다.","basis":"교육부 개인정보 보호지침 제14조제1항"},{"stage":"조사·확인","when":"교육청이 필요하다고 볼 때","who":"교육감·교육부장관","what":"자료제출 요구·현장 조사","detail":"교육감·교육부장관은 신고를 받고 필요하면 자료 제출을 요구하거나 전문기관과 함께 조사할 수 있고, 학교는 특별한 사정이 없으면 따라야 한다. 조사는 익명처리 등으로 관련자 사생활 침해를 최소화한다.","basis":"교육부 개인정보 보호지침 제14조제2항·제3항"},{"stage":"조치·이행","when":"조치 완료 후","who":"학교","what":"조치확인서 제출·결과 보고","detail":"서울시교육청 매뉴얼은 조치 결과를 '개인정보 유출등 신고 조치확인서'로 작성해 제출하도록 안내한다. 경북교육청의 제출 경로·서식은 교육청 공문으로 확인한다.","basis":"교육부 개인정보 보호지침 제14조, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 2.2"},{"stage":"심의·결정","when":"위반 혐의가 있을 때","who":"개인정보보호위원회","what":"자료제출 요구·출입 검사","detail":"보호위원회는 법 위반 혐의를 알게 되거나 신고·민원을 받으면 관계 물품·서류 제출을 요구하고, 사무소에 출입해 검사할 수 있다. 자료를 숨기거나 거짓 제출하면 과태료·형사처벌 대상이다.","basis":"개인정보 보호법 제63조, 제73조제1항제4호·제5호, 제75조제2항제25호·제26호"},{"stage":"심의·결정","when":"조사 결과에 따라","who":"개인정보보호위원회","what":"시정조치·과징금·과태료·고발·징계권고·공표","detail":"보호위원회는 시정조치 명령(중앙행정기관·지자체 등은 권고), 과징금, 과태료, 수사기관 고발, 책임자 징계권고를 할 수 있고 그 내용을 공표할 수 있다. 통지를 안 하거나 신고를 안 하면 3천만원 이하 과태료 대상이다.","basis":"개인정보 보호법 제64조, 제64조의2, 제65조, 제66조, 제75조제2항제17호·제18호"},{"stage":"심의·결정","when":"징계권고·자체 감사 시","who":"교육청(징계권자)","what":"관련 교직원 징계 검토","detail":"보호위원회가 징계를 권고하면 권고받은 기관은 존중하고 결과를 통보해야 한다. 교원 징계는 교육공무원 징계 절차에 따른다.","basis":"개인정보 보호법 제65조제2항"},{"stage":"불복·구제","when":"정보주체가 원할 때","who":"학생·보호자","what":"개인정보 분쟁조정 신청","detail":"개인정보 분쟁조정위원회에 조정을 신청할 수 있다. 위원회는 신청일부터 60일 이내에 조정안을 작성하고, 조정안을 받은 날부터 15일 안에 수락 여부를 알리지 않으면 수락한 것으로 본다. 성립한 조정은 재판상 화해와 같은 효력. 같은 유형 피해가 여럿이면 집단분쟁조정도 있다. 학교는 통지를 받으면 특별한 사유가 없으면 조정에 응해야 한다.","basis":"개인정보 보호법 제43조, 제44조, 제47조, 제49조"},{"stage":"불복·구제","when":"정보주체가 원할 때","who":"학생·보호자","what":"손해배상 청구","detail":"법 위반으로 손해를 입으면 손해배상을 청구할 수 있고, 처리자가 고의·과실 없음을 입증해야 한다. 고의·과실로 유출된 경우 손해액 증명 없이 300만원 이하 법정손해배상을 청구할 수도 있다. 고의·중과실 유출은 손해액의 5배 이내 배상.","basis":"개인정보 보호법 제39조, 제39조의2"},{"stage":"불복·구제","when":"처분을 받은 경우","who":"처분을 받은 기관","what":"보호위원회 처분에 대한 불복","detail":"과징금 등 행정처분에 대한 일반 불복은 행정심판(처분이 있음을 알게 된 날부터 90일, 처분이 있었던 날부터 180일)·행정소송(안 날부터 90일, 있은 날부터 1년)으로 한다. 과태료 불복 절차는 여기서 확인하지 못했다.","basis":"행정심판법 제27조, 행정소송법 제20조"},{"stage":"종결·사후","when":"사안 종료 후","who":"학교 전체","what":"재발방지 이행 점검","detail":"개인정보 파일 전송 전 수신자 재확인, 엑셀은 PDF로 변환해 게시, USB·출력물 관리, 단체 채팅방에 명단 올리지 않기 등 원인별 대책을 학교 내부관리계획에 반영하고 전 직원 교육을 한다.","basis":"교육부 개인정보 보호지침 제14조제1항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 4장"}],"deadlines":[{"what":"정보주체(학생·보호자) 통지","limit":"유출등을 알게 된 때부터 72시간 이내(긴급 회수·삭제 조치 중이거나 천재지변 등은 사유 해소 후 즉시)","basis":"개인정보 보호법 시행령 제39조제1항"},{"what":"교육부 신고(상급기관 경유)","limit":"1명이라도 유출되면 알게 된 때부터 72시간 내","basis":"교육부 개인정보 보호지침 제13조제1항"},{"what":"개인정보보호위원회·한국인터넷진흥원 신고","limit":"1천명 이상·민감정보·고유식별정보·외부 불법접근이면 72시간 이내, 교육부 신고와 동시에","basis":"개인정보 보호법 시행령 제40조제1항, 교육부 개인정보 보호지침 제13조제1항 단서"},{"what":"통지 갈음 홈페이지 게시","limit":"30일 이상","basis":"개인정보 보호법 시행령 제39조제3항"},{"what":"분쟁조정위원회 조정안 작성","limit":"신청받은 날부터 60일 이내(연장 가능)","basis":"개인정보 보호법 제44조"},{"what":"조정안 수락 여부 회신","limit":"조정안을 받은 날부터 15일(무응답이면 수락 간주)","basis":"개인정보 보호법 제47조제3항"}],"dont":["회수·삭제만 하고 통지·신고를 빼먹지 않는다 — 교육부 지침은 1명이라도 신고 대상이다","72시간을 '근무일'로 세지 않는다 — 알게 된 시각부터 시간으로 센다","학급 단톡방·학부모 단톡방에 사과문과 함께 유출 내용을 다시 올리지 않는다 — 추가 유출이다","유출 결과를 전체 공지로 알리지 않는다 — 정보주체가 본인 것만 확인하게 한다","재발방지 사례 전파 때 유출자·피해자 이름을 쓰지 않는다","개인 폰·개인 메일로 수습 연락을 돌리지 않는다 — 창구를 하나로 정한다"],"contacts":[{"name":"교육부 개인정보보호 포털(유출 신고)","tel":"","note":"privacy.moe.go.kr 유출신고 메뉴"},{"name":"개인정보 포털(보호위원회·KISA 신고)","tel":"","note":"privacy.go.kr — 1천명 이상·민감·고유식별·해킹일 때"},{"name":"개인정보침해 신고센터(한국인터넷진흥원)","tel":"118","note":"privacy.kisa.or.kr 표기"}],"forms":["개인정보 유출등 신고서(교육부 개인정보 보호지침 별지 제5호서식)","정보주체 유출등 통지문(서울시교육청 매뉴얼 붙임2 표준 통지문 예시 참고)","개인정보 유출등 신고 조치확인서(서울시교육청 매뉴얼 붙임4 — 경북 서식은 공문 확인)","수신자 삭제 확인 증빙(삭제 전·후 화면 캡처)","원인 조사·재발방지 조치계획"],"law":[{"name":"개인정보 보호법","article":"제34조(개인정보 유출등의 통지ㆍ신고)","point":"알게 되면 지체 없이 정보주체에게 7개 항목 통지, 회수·삭제 등 피해 최소화 조치, 대통령령에 따라 보호위원회·전문기관 신고(2026.3.10. 개정, 2026.9.11. 시행)"},{"name":"개인정보 보호법 시행령","article":"제39조(개인정보 유출 등의 통지)","point":"서면등으로 72시간 이내 통지. 긴급조치 필요·천재지변은 해소 후 즉시. 연락처 모르면 홈페이지 30일 이상 게시로 갈음"},{"name":"개인정보 보호법 시행령","article":"제40조(개인정보 유출 등의 신고)","point":"1천명 이상·민감정보/고유식별정보·외부 불법접근이면 72시간 이내 보호위원회 또는 한국인터넷진흥원 신고. 회수·삭제로 침해 가능성이 현저히 낮아지면 신고하지 않을 수 있음"},{"name":"교육부 개인정보 보호지침(교육부훈령 제476호)","article":"제13조(개인정보 유출등의 신고)","point":"각급학교 포함 교육기관은 1명이라도 유출되면 72시간 내 상급기관 경유 교육부 신고, 요건 해당 시 보호위원회에 동시 신고"},{"name":"교육부 개인정보 보호지침","article":"제14조(개인정보의 유출등 조사)","point":"원인 조사, 재발방지 계획, 전 직원 사례 전파·교육. 교육감의 자료제출 요구·조사"},{"name":"개인정보 보호법","article":"제39조·제39조의2","point":"손해배상(입증책임 전환), 고의·과실 유출 시 300만원 이하 법정손해배상"},{"name":"개인정보 보호법","article":"제75조제2항제17호·제18호","point":"통지하지 않거나 신고하지 않으면 3천만원 이하 과태료"},{"name":"개인정보 보호법 시행령","article":"제32조제2항제1호사목","point":"각급 학교의 개인정보 보호책임자는 해당 학교의 행정사무를 총괄하는 사람"}],"faq":[{"q":"성적표를 다른 학부모 한 명에게 잘못 보냈고, 그 학부모가 바로 지웠다고 합니다. 그래도 신고해야 하나요?","a":"통지는 해야 합니다. 신고는 교육부 지침상 1명이라도 대상이지만, 유출 경로가 확인되고 회수·삭제로 권익 침해 가능성이 현저히 낮아졌다면 신고하지 않을 수 있다는 예외가 시행령 제40조와 교육부 지침 제13조제2항에 있습니다. 판단은 혼자 하지 말고 보호책임자와 하고, 삭제 증빙을 반드시 받아 두세요."},{"q":"72시간은 주말·공휴일을 빼고 세나요?","a":"시행령은 '알게 되었을 때에는 72시간 이내'로만 정하고 있어 시간으로 셉니다. 천재지변 등 부득이한 사유가 있을 때만 해소 후 즉시로 늦출 수 있습니다."},{"q":"학생 건강 정보(질병·장애)가 포함된 명단이 나갔어요.","a":"건강 정보는 민감정보입니다. 인원과 관계없이 교육부 신고와 동시에 개인정보보호위원회 또는 한국인터넷진흥원에도 72시간 이내 신고해야 합니다(시행령 제40조제1항제2호, 교육부 지침 제13조제1항제2호)."},{"q":"USB를 잃어버렸는데 누가 봤는지 모르겠어요.","a":"분실도 '유출등'에 포함됩니다(분실·도난·유출 등). 제3자가 볼 수 있는 상태가 되었는지, 암호화 여부를 확인하고 보고하세요. 서울시교육청 매뉴얼은 암호화된 정보가 유출돼도 유출에 해당한다고 안내합니다."},{"q":"통지문에 무엇을 적어야 하나요?","a":"법 제34조제1항: ①유출 항목 ②시점과 경위 ③피해 최소화를 위해 정보주체가 할 수 있는 방법 ④학교의 대응조치와 피해구제 절차 ⑤신고·상담 부서와 연락처 ⑥손해배상·분쟁조정 등 법적 권리와 행사 방법. 모르는 부분은 확인된 것부터 먼저 알리고 추가로 알리면 됩니다."},{"q":"교사 개인도 처벌받나요?","a":"실수로 인한 유출은 주로 기관 차원의 과태료·과징금·시정조치와 징계권고의 문제입니다. 업무상 알게 된 개인정보를 고의로 누설하거나 권한 없이 제공하면 5년 이하 징역 또는 5천만원 이하 벌금 대상입니다(제71조제9호). 개별 사안의 징계 수위는 이 자료로 단정할 수 없습니다."}],"record":"생활기록부 기재 사항 없음. 교육부 개인정보보호 포털에 유출등 신고서(별지 제5호서식) 제출, 상급기관(교육지원청·교육청) 보고 공문. 서울시교육청 매뉴얼은 유·초·중학교는 교육지원청을 거쳐 본청, 고등·특수학교는 본청에 보고하도록 안내한다(경북 경로는 공문 확인).","deep":[{"title":"'유출등'은 어디까지인가","body":["법은 분실·도난·유출·위조·변조·훼손을 묶어 '유출등'이라고 부른다. 잘못 보낸 문자·메일, 단톡방에 올린 명단, 잃어버린 USB·출력물, 홈페이지 첨부파일 노출이 모두 들어간다.","표준 개인정보 보호지침(서울시교육청 매뉴얼 인용)은 개인정보가 처리자의 관리·통제권을 벗어나 제3자가 그 내용을 알 수 있는 상태에 이른 것을 유출로 본다. 암호화된 정보가 나가도 유출에 해당한다고 매뉴얼은 안내한다."],"basis":"개인정보 보호법 제23조제2항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 1.3"},{"title":"통지와 신고는 다른 의무다","body":["통지는 피해 당사자(학생·보호자)에게 알리는 것, 신고는 기관(교육부·보호위원회)에 알리는 것이다. 둘 다 72시간이 기준이다.","회수·삭제로 침해 가능성이 현저히 낮아졌을 때의 '안 해도 되는' 예외는 신고에만 있다. 통지는 회수·삭제 같은 긴급조치가 필요한 동안만 늦출 수 있고, 사유가 해소되면 즉시 알려야 한다."],"basis":"개인정보 보호법 시행령 제39조·제40조"},{"title":"학교는 신고 문턱이 더 낮다","body":["일반 처리자는 1천명 이상·민감·고유식별·해킹일 때만 보호위원회 신고 대상이지만, 교육부 개인정보 보호지침은 각급학교를 포함한 교육기관에 '1명이라도' 유출되면 상급기관을 거쳐 교육부에 신고하도록 정한다.","위 네 가지 요건에 해당하면 교육부와 보호위원회(또는 한국인터넷진흥원)에 동시에 신고한다. 시간이 없으면 전화로 먼저 신고하고 신고서를 나중에 낸다."],"basis":"교육부 개인정보 보호지침 제13조"},{"title":"2026년 9월 11일부터 바뀐 것","body":["개정 개인정보 보호법(2026.3.10. 공포)과 시행령(2026.9.10. 개정)이 2026.9.11. 시행됐다. 통지 항목에 '손해배상·분쟁조정 등 법적 권리와 행사 방법'(제34조제1항제6호)이 추가됐다.","해킹 등으로 유출이 의심되지만 정보주체를 특정하기 어려운 경우 등 '유출 가능성'만 있어도 해당 정보주체 모두에게 알리는 규정(법 제34조제2항, 시행령 제39조의2·제39조의3)이 새로 생겼다. 이 경우 유출 가능성을 알게 된 때부터 72시간 이내 통지가 원칙이다.","개정 통지·신고 규정은 시행 이후 유출을 알게 된 경우부터 적용된다(부칙 제2조)."],"basis":"개인정보 보호법 제34조, 부칙(법률 제21445호) 제2조, 시행령 제39조의2·제39조의3"},{"title":"사고 뒤에 오는 것: 조사·제재·배상","body":["교육청은 신고를 받고 자료 제출을 요구하거나 조사할 수 있다. 보호위원회는 자료제출 요구·출입검사 뒤 시정조치(중앙행정기관·지자체 등에는 권고), 과징금, 과태료, 고발, 징계권고를 할 수 있고 결과를 공표할 수 있다.","피해 학생·보호자는 분쟁조정(60일 내 조정안, 15일 무응답 시 수락 간주, 재판상 화해 효력)이나 손해배상 소송(법정손해배상 300만원 이하 포함)을 택할 수 있다."],"basis":"교육부 개인정보 보호지침 제14조, 개인정보 보호법 제39조~제39조의2, 제43조~제47조, 제63조~제66조, 제75조"}],"tables":[{"title":"통지·신고 한눈에","head":["구분","대상","기한","예외·유의"],"rows":[["정보주체 통지","유출된 학생·보호자 전원(1명이라도)","알게 된 때부터 72시간 이내","긴급 회수·삭제 조치 중·천재지변은 사유 해소 후 즉시. 연락처 불명이면 홈페이지 30일 이상 게시"],["교육부 신고","1명이라도 유출(상급기관 경유)","72시간 내","회수·삭제로 침해 가능성 현저히 낮아지면 신고하지 않을 수 있음"],["보호위원회·KISA 신고","1천명 이상 / 민감·고유식별정보 / 외부 불법접근","72시간 이내, 교육부 신고와 동시","같은 예외 적용"],["유출 가능성 통지(2026.9.11.~)","해킹 등으로 의심되나 정보주체 특정 곤란 등","72시간 이내","시행령 제39조의2·제39조의3"]],"note":"개인정보 보호법 제34조, 시행령 제39조·제39조의3·제40조, 교육부 개인정보 보호지침 제13조"},{"title":"사고 뒤 제재·구제 수단","head":["수단","누가","내용","근거"],"rows":[["과태료","보호위원회","통지 안 함·신고 안 함: 3천만원 이하","제75조제2항제17호·제18호"],["과징금","보호위원회","유출 시 부과 가능(안전조치를 다한 경우 제외). 매출액 없으면 20억원 이하","제64조의2제1항제9호"],["시정조치·권고","보호위원회","침해 중지·처리 정지 등. 중앙행정기관·지자체 등은 권고","제64조"],["고발·징계권고","보호위원회","범죄 혐의 시 고발, 책임자 징계권고(결과 통보 의무)","제65조"],["분쟁조정","정보주체","60일 내 조정안, 15일 무응답 시 수락, 재판상 화해 효력","제43조~제47조"],["손해배상","정보주체","입증책임 전환, 법정손해배상 300만원 이하, 고의·중과실 5배 이내","제39조·제39조의2"]],"note":"공립학교(교육청 소속)에 과징금·시정명령이 실제 어떻게 적용되는지는 이 자료로 확인하지 못했다."}],"sources":[{"title":"개인정보 보호법 (시행 2026.9.11., 법률 제21445호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/개인정보보호법"},{"title":"개인정보 보호법 시행령 (시행 2026.9.11., 대통령령 제36671호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/개인정보보호법시행령"},{"title":"교육부 개인정보 보호지침 (교육부훈령 제476호, 2024.2.7. 전부개정)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육부개인정보보호지침"},{"title":"서울특별시교육청 개인정보 유출등 사고 대응 매뉴얼 (2025.3.)","publisher":"서울특별시교육청","year":2025,"url":"https://www.sen.go.kr/component/file/ND_fileDownload.do?q_fileSn=2191162&q_fileId=fe114b27-eeb7-489c-97c4-1073715a30c5"},{"title":"교육분야 개인정보 유출등사고 대응 매뉴얼 개정본 (교육부 개인정보보호포털 참고자료, 2026.5.28. 게시)","publisher":"교육부·한국교육학술정보원","year":2026,"url":"https://privacy.moe.go.kr/privacy/page.do?mnu_uid=93"},{"title":"행정심판법·행정소송법 (제소·청구 기간)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"}],"verified":"2026-09-24","uncertain":["교육분야 개인정보 유출등사고 대응 매뉴얼 개정본(2026) 본문은 포털 로그인이 필요해 직접 읽지 못함 — 서울시교육청 2025.3. 매뉴얼과 교육부 지침(2024)으로 대신 확인","경북교육청의 보고 경로(중학교→교육지원청→본청 여부)·조치확인서 서식·담당 부서 전화번호","학교 개인정보 보호책임자가 교장인지 교감·행정실장인지 — 시행령은 '학교의 행정사무를 총괄하는 사람', 학교 개인정보 처리방침에서 확인","공립학교에 보호위원회 과징금·시정명령이 적용되는 구체 범위, 과태료 불복 절차","유출 교직원 징계 양정(교육공무원 징계기준 별표)은 원문 별표를 확인하지 못함","교육부 지침(2024)이 2026.9.11. 법령 개정(유출 가능성 통지 등)을 아직 반영하지 않았을 수 있음"],"related":["student-photo-sns"]}],"contacts":[],"sources":[],"quick":[{"label":"학생끼리 때렸어요","id":"school-violence"},{"label":"아이 몸에 멍·방임 의심","id":"child-abuse"},{"label":"수업 중 다쳤어요","id":"safety-accident"},{"label":"학부모가 폭언해요","id":"teacher-rights"},{"label":"아동학대로 신고당했어요","id":"teacher-abuse-accusation"},{"label":"딥페이크·불법촬영","id":"cyber-deepfake"},{"label":"성추행을 털어놨어요","id":"sexual-violence"},{"label":"수업 방해가 심해요","id":"student-guidance"},{"label":"성적표를 잘못 보냈어요","id":"privacy-leak"}],"roleGroups":{"담임·교과 교사":["담임","교사","교원","알게 된","목격","인솔","교직원"],"업무 담당·부장":["책임교사","담당","부장","전담기구","생활지도","보건교사","상담"],"교감·교장":["교감","교장","학교장","관리자"]}};

<script>
(function(){
const CASES = DATA.cases, CONTACTS = DATA.contacts || [], SOURCES = DATA.sources || [];
CASES.forEach((c, i) => { c.no = String(i + 1).padStart(2, '0'); });
const BYID = Object.fromEntries(CASES.map(c => [c.id, c]));
const CAT_ORDER = ["학생 간 사안","학생 보호·위기","교원 보호","안전·보건","행정·정보"];
const URG_ORDER = ["즉시","당일","며칠 안"];
const QUICK = DATA.quick || [];
const $app = document.getElementById('app');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  sget(k, d){ try{ const v = sessionStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  sset(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} },
  sdel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2500); }
const u1 = u => String(u || '').split(' ')[0];
const telHref = tel => 'tel:' + String(tel).replace(/[^0-9+]/g, '');
const isDialable = tel => /^[0-9+][0-9\- ]{1,15}$/.test(String(tel || '').trim());
const isMobile = () => window.matchMedia('(max-width:860px)').matches;

/* ---------- 흐름도: 누가(레인) · 언제(단계) ---------- */
const LANES = [
  { k: 'teacher', name: '교사', re: /담임|교과|목격|알게 된|최초|인솔|발견한|교사(?!.*(책임|상담|보건))/ },
  { k: 'staff', name: '담당 교사·전담기구', re: /책임교사|전담기구|보건교사|상담교사|전문상담|Wee ?클래스|담당|부장|성고충|위원회\(학교\)|학교 ?안전|영양|급식/ },
  { k: 'admin', name: '교감·교장', re: /교감|교장|학교장|관리자/ },
  { k: 'office', name: '교육지원청·교육청', re: /교육지원청|교육청|교육감|심의위원회|교권보호위원회|전담조사관|교육장/ },
  { k: 'outside', name: '외부 기관', re: /경찰|112|119|아동보호|보건소|수사|법원|공제회|정신건강|센터|병원|구급|지자체|시·군|질병관리|개인정보보호위원회|검사/ },
  { k: 'family', name: '보호자·학생', re: /보호자|학부모|부모|학생|피해|가해|본인/ }
];
function laneOf(who){
  const w = String(who || '');
  // 여러 주체가 섞이면 앞에 적힌 쪽을 따른다
  let best = null, pos = 1e9;
  for (const L of LANES){ const m = w.match(L.re); if (m && m.index < pos){ pos = m.index; best = L.k; } }
  return best || 'teacher';
}
const PHASES = [
  { k: '알게 됨·신고', sub: '발견·신고·접수', re: /인지|발견|알게|신고|접수|최초|즉시 보고/ },
  { k: '초기 대응', sub: '보호·분리·응급', re: /분리|보호|응급|긴급|안정|119|격리|대피|귀가/ },
  { k: '조사·확인', sub: '조사·면담·수사', re: /조사|확인|면담|진술|증거|수사|역학/ },
  { k: '심의·결정', sub: '위원회·결정', re: /심의|위원회|결정|의결|자체해결|판정/ },
  { k: '조치·이행', sub: '조치·기록·지급', re: /이행|특별교육|기재|통보|지급|보상|조치/ },
  { k: '불복·구제', sub: '행정심판·소송', re: /행정심판|행정소송|집행정지|이의|재심|불복|청구/ },
  { k: '종결·사후', sub: '회복·삭제·관리', re: /종결|사후|삭제|졸업|관계회복|복귀|모니터링|추수|재발/ }
];
PHASES.forEach(p => { p.name = p.k; });
function phaseOf(s, prev){
  const want = String(s.stage || '').replace(/\s/g, '');
  let idx = PHASES.findIndex(p => p.k.replace(/\s/g, '') === want);
  if (idx < 0){
    const t = (s.what || '') + ' ' + (s.when || '');
    idx = PHASES.findIndex(p => p.re.test(t));
    if (idx < 0 || idx < prev) idx = prev;   // 모르면 앞 단계를 이어 간다
  }
  return idx;
}
function layoutSteps(c){
  let prev = 0;
  return (c.steps || []).map((s, i) => {
    const p = phaseOf(s, prev);
    prev = p;
    return { i, s, lane: s.lane || laneOf(s.who), phase: p };
  });
}

/* ---------- 검색 ---------- */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function prep(c){
  if (c._txt) return;
  const parts = [c.summary, (c.first||[]).join(' '), (c.steps||[]).map(s => [s.what, s.detail, s.who].join(' ')).join(' '),
    (c.dont||[]).join(' '), (c.faq||[]).map(f => f.q + ' ' + f.a).join(' '), (c.law||[]).map(l => l.name + l.article).join(' '), c.record];
  c._txt = norm(parts.join(' '));
  c._t = norm(c.title); c._aka = (c.aka||[]).map(norm);
}
function score(c, q){
  const words = q.split(/\s+/).filter(Boolean).map(norm);
  if (!words.length) return 1;
  prep(c);
  let s = 0;
  for (const w of words){
    if (c._t.includes(w)) s += 12;
    else if (c._aka.some(a => a.includes(w) || (a.length >= 2 && w.includes(a)))) s += 9;
    else if (c._txt.includes(w)) s += 3;
    else if (w.length >= 3 && (c._t + c._aka.join('')).includes(w.slice(0, 2))) s += 1;
    else return 0;
  }
  return s;
}
function snippet(c, q){
  const w = norm(q.split(/\s+/)[0] || '');
  if (!w || c._t.includes(w) || c._aka.some(a => a.includes(w))) return '';
  const pool = [...(c.first||[]), ...(c.steps||[]).map(s => s.what + (s.detail ? ' — ' + s.detail : '')), ...(c.faq||[]).map(f => 'Q. ' + f.q), ...(c.dont||[])];
  const hit = pool.find(t => norm(t).includes(w));
  return hit ? (hit.length > 80 ? hit.slice(0, 80) + '…' : hit) : '';
}

function roleMatch(c, r){
  if (r === '전체') return true;
  const keys = ROLE_GROUPS[r] || [r];
  const all = [...(c.roles||[]), ...(c.steps||[]).map(s => s.who || '')].join(' ');
  return keys.some(k => all.includes(k));
}

  arr = arr.filter(x => (state.cat === '전체' || x.c.category === state.cat) && (state.urg === '전체' || x.c.urgency === state.urg) && roleMatch(x.c, state.role));

  arr.sort(state.q ? (a, b) => b.s - a.s || byUrg(a, b) : state.sort === 'name' ? byName : byUrg);
  return arr;
}

/* ---------- 기한 계산 ---------- */
function parseLimit(t){
  const s = String(t || '');
  let m;
  if ((m = s.match(/(\d+)\s*시간/))) return { h: +m[1] };
  if ((m = s.match(/(\d+)\s*(영업일|근무일|평일)/))) return { bd: +m[1] };
  if ((m = s.match(/(\d+)\s*일\s*(이내|안|까지|내|전)/))) return { d: +m[1] };
  if ((m = s.match(/(\d+)\s*주\s*(이내|안|까지|내)/))) return { d: +m[1] * 7 };
  if (/즉시|지체 ?없이|바로|당장/.test(s)) return { now: true };
  if (/당일/.test(s)) return { today: true };
  return null;
}
const DOW = '일월화수목금토';
function fmt(d, withTime){
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})` + (withTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : '');
}
function dueText(lim, base){
  const L = parseLimit(lim);
  if (!L || !base) return '';
  if (L.now) return '<span style="color:var(--err)">바로</span>';
  if (L.today) return fmt(base) + ' 안';
  if (L.h) return fmt(new Date(base.getTime() + L.h * 3600e3), true) + '까지';
  if (L.d){ const d = new Date(base); d.setDate(d.getDate() + L.d); return fmt(d) + '까지<small>달력일 기준 · 첫날 셈법은 원문 확인</small>'; }
  if (L.bd){ const d = new Date(base); let n = L.bd; while (n > 0){ d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return fmt(d) + '까지<small>주말 뺌 · 공휴일은 따로 빼세요</small>'; }
  return '';
}

      ${(c.uncertain||[]).length ? `<div class="kpi w"><b class="num">${c.uncertain.length}</b><span>현장 확인 필요</span></div>` : ''}
    </div>
    ${c.first && c.first.length ? `<div class="now" id="s-now"><div class="h">지금 당장<small>흐름도보다 먼저</small></div><ol>${c.first.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : ''}
    ${flowSec}
    <div class="cols">
      <div>${main.join('')}</div>
      <aside class="rside"><div class="sticky">${side.join('')}
        <nav class="toc">${tocItems.filter(([k]) => [flowSec, ...main].some(m => m.includes(`id="s-${k}"`))).map(([k, t]) => `<a href="#s-${k}" data-jump="s-${k}">${t}</a>`).join('')}</nav>
      </div></aside>
    </div>
  </div>`;

  // 흐름도 상태
  const getDone = () => store.get(ck, {});
  flowState = { c, L, sel: null };
  function status(i, done){
    if (done[i]) return 'done';
    const firstOpen = L.findIndex(x => !done[x.i]);
    return firstOpen === i ? 'now' : 'wait';
  }
  function paint(){
    const done = getDone();
    const nDone = Object.keys(done).filter(k => done[k]).length;
    document.getElementById('kdone').textContent = nDone;
    $app.querySelectorAll('.node').forEach(n => {
      const i = +n.dataset.n, st = status(i, done);
      n.classList.remove('done', 'now', 'wait'); n.classList.add(st);
      n.classList.toggle('sel', flowState.sel === i);
      n.querySelector('.st').textContent = st === 'done' ? '한 일' : st === 'now' ? '지금' : '';
    });
    drawSteplist(done);
    drawNodeDetail(done);
  }
  function setDone(i, v){ const d = getDone(); if (v) d[i] = true; else delete d[i]; store.set(ck, d); paint(); }
  function drawNodeDetail(done){
    const box = document.getElementById('ndetail'); if (!box) return;
    let i = flowState.sel;
    if (i == null){ i = L.findIndex(x => !done[x.i]); if (i < 0) i = 0; }
    const x = L[i]; if (!x) { box.innerHTML = ''; return; }
    const s = x.s;
    box.innerHTML = `<div class="nd-l"><div class="k">S${String(i + 1).padStart(2, '0')} · ${esc(PHASES[x.phase].name)}${flowState.sel == null ? ' · 지금 할 일' : ''}</div><h3>${esc(s.what)}</h3>${s.detail ? `<p class="det">${esc(s.detail)}</p>` : ''}
      <label class="chk"><input type="checkbox" id="ndchk" ${done[i] ? 'checked' : ''}> 이 단계를 마쳤습니다</label></div>
      <div class="nd-r"><dl><dt>언제</dt><dd>${esc(s.when || '-')}</dd><dt>누가</dt><dd>${esc(s.who || '-')}</dd><dt>근거</dt><dd>${esc(s.basis || '매뉴얼 절차')}</dd></dl></div>`;
    document.getElementById('ndchk').addEventListener('change', e => setDone(i, e.target.checked));
  }
  function drawSteplist(done){
    const ol = document.getElementById('steplist'); if (!ol) return;
    let lastP = -1, html = '';
    const firstOpen = L.findIndex(x => !done[x.i]);
    L.forEach(x => {
      if (x.phase !== lastP){ html += `<li class="pgrp">${PHASES[x.phase].name} · ${PHASES[x.phase].sub}</li>`; lastP = x.phase; }
      const s = x.s;
      html += `<li class="step ${done[x.i] ? 'done' : ''} ${firstOpen === x.i ? 'now' : ''}"><input type="checkbox" data-i="${x.i}" ${done[x.i] ? 'checked' : ''} aria-label="${x.i + 1}단계 완료"><div><span class="sn">S${String(x.i + 1).padStart(2, '0')}${firstOpen === x.i ? ' · 지금' : ''}</span>${s.who ? `<span class="who">${esc(s.who)}</span>` : ''}<div class="what">${esc(s.what)}</div>${s.detail ? `<div class="det">${esc(s.detail)}</div>` : ''}<div class="bs">${esc(s.when || '')}${s.basis ? ' · 근거 ' + esc(s.basis) : ''}</div></div></li>`;
    });
    ol.innerHTML = html;
    ol.querySelectorAll('input').forEach(el => el.addEventListener('change', () => setDone(+el.dataset.i, el.checked)));
  }
  $app.querySelectorAll('.node').forEach(n => { const go = () => { const i = +n.dataset.n; flowState.sel = flowState.sel === i ? null : i; paint(); }; n.addEventListener('click', go); n.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  // 보기 전환
  const setView = v => {
    const fb = document.getElementById('flowbox'), sl = document.getElementById('steplist');
    if (!fb) return;
    fb.style.display = v === 'flow' ? '' : 'none'; sl.style.display = v === 'list' ? '' : 'none';
    $app.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    store.set('view', v);
    if (v === 'flow') requestAnimationFrame(drawArrows);
  };
  $app.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  paint();
  setView(store.get('view', null) || (isMobile() ? 'list' : 'flow'));

  // 기한 계산
  const base = document.getElementById('base');
  if (base){
    const bk = 'base:' + c.id;
    base.value = store.sget(bk, '');
    const calc = () => {
      store.sset(bk, base.value);
      const b = base.value ? new Date(base.value) : null;
      $app.querySelectorAll('td.due').forEach(td => { td.innerHTML = b ? (dueText(c.deadlines[+td.dataset.d].limit, b) || '<small>원문 기준 확인</small>') : ''; });
    };
    base.addEventListener('input', calc); calc();
  }
  // 이동·도구
  document.getElementById('jump').addEventListener('change', e => { location.hash = '#/c/' + e.target.value; });
  document.getElementById('bprev').addEventListener('click', () => prevC && (location.hash = '#/c/' + prevC.id));
  document.getElementById('bnext').addEventListener('click', () => nextC && (location.hash = '#/c/' + nextC.id));
  document.getElementById('breset').addEventListener('click', () => { store.set(ck, {}); flowState.sel = null; paint(); toast('체크를 지웠습니다.'); });
  document.getElementById('bcopy').addEventListener('click', () => copy(location.href.split('#')[0] + '#/c/' + c.id, '링크를 복사했습니다.'));
  document.getElementById('bprint').addEventListener('click', () => { $app.querySelectorAll('details').forEach(d => d.open = true); window.print(); });
  $app.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth' }); }));
  // 메모
  const mk = 'memo:' + c.id, ta = document.getElementById('memo');
  ta.value = store.sget(mk, '');
  ta.addEventListener('input', () => store.sset(mk, ta.value));
  document.getElementById('mtpl').addEventListener('click', () => { ta.value = (ta.value ? ta.value + '\n\n' : '') + memoTemplate(); store.sset(mk, ta.value); ta.focus(); });
  document.getElementById('mstamp').addEventListener('click', () => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const s = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} `;
    const at = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    ta.value = ta.value.slice(0, at) + (at && ta.value[at - 1] !== '\n' ? '\n' : '') + s + ta.value.slice(at);
    store.sset(mk, ta.value); ta.focus();
  });
  document.getElementById('mcopy').addEventListener('click', () => ta.value ? copy(ta.value, '메모를 복사했습니다.') : toast('메모가 비어 있습니다.'));
  document.getElementById('mclear').addEventListener('click', () => { ta.value = ''; store.sdel(mk); toast('메모를 지웠습니다.'); });
  window.scrollTo(0, 0);
  requestAnimationFrame(drawArrows);
}
// 흐름도 화살표: 단계 번호 순서대로 잇는다
function drawArrows(){
  const flow = document.getElementById('flow'), svg = document.getElementById('arrows');
  if (!flow || !svg || !flowState || flow.offsetParent === null) return;
  const fr = flow.getBoundingClientRect();
  const R = i => { const n = flow.querySelector(`.node[data-n="${i}"]`); if (!n) return null; const r = n.getBoundingClientRect(); return { l: r.left - fr.left, r: r.right - fr.left, t: r.top - fr.top, b: r.bottom - fr.top, cx: (r.left + r.right) / 2 - fr.left, cy: (r.top + r.bottom) / 2 - fr.top }; };
  svg.setAttribute('width', fr.width); svg.setAttribute('height', fr.height);
  svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
  let d = '';
  const n = flowState.L.length;
  const cellL = i => { const nd = flow.querySelector(`.node[data-n="${i}"]`); return nd.parentElement.getBoundingClientRect().left - fr.left; };
  for (let i = 0; i < n - 1; i++){
    const a = R(i), b = R(i + 1); if (!a || !b) continue;
    const gx = cellL(i + 1) + 8;           // 다음 단계 칸의 왼쪽 여백
    if (cellL(i + 1) > cellL(i) + 2){      // 다음 칸(오른쪽)으로
      d += `M${a.r} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    } else {                               // 같은 열: 왼쪽 여백을 타고 위아래
      d += `M${a.l} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    }
  }
  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L8 5 L0 9z" fill="#8FA3BF"/></marker></defs>` +
    d.split('M').filter(Boolean).map(p => `<path d="M${p}" fill="none" stroke="#A9B8CC" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah)"/>`).join('');
}
window.addEventListener('resize', () => { clearTimeout(drawArrows._t); drawArrows._t = setTimeout(drawArrows, 80); });

function memoTemplate(){
  return '일시:\n장소:\n관련 학생(이니셜):\n알게 된 경위:\n학생이 한 말(들은 그대로):\n본 것:\n한 조치와 시각:\n연락한 곳·사람:';
}
function ctRow(x){
  const tel = x.tel || '';
  const note = [x.for, x.hours, x.note].filter(Boolean).join(' · ');
  return `<div class="ct"><div><div class="nm">${esc(x.name)}</div>${note ? `<div class="nt">${esc(note)}</div>` : ''}</div>${isDialable(tel) ? `<a class="tel num" href="${telHref(tel)}">${esc(tel)}</a>` : (tel ? `<span class="nt">${esc(tel)}</span>` : '')}</div>`;
}
function copy(text, msg){
  const done = () => toast(msg);
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ---------- 연락처·안내 ---------- */
function renderContacts(){
  const groups = {};

  $app.innerHTML = `<div class="wrap page">
    <h1>연락처</h1>
    <p class="lead">번호를 누르면 바로 전화가 걸립니다. 공식 누리집에서 확인한 번호만 실었습니다(확인일 ${esc(DATA.updated)}).</p>
    ${Object.entries(groups).map(([g, arr]) => `<h2>${esc(g)}</h2><div class="card">${arr.map(ctRow).join('')}</div>`).join('')}
    <h2>학교에서 미리 적어 둘 번호</h2>
    <div class="card plain"><ul><li>소속 교육지원청 학교폭력 담당(전담조사관 요청)</li><li>소속 교육지원청 교육활동 보호 담당·Wee센터</li><li>관할 경찰서 학교전담경찰관(SPO)</li><li>관할 아동보호전문기관·정신건강복지센터·보건소</li><li>가까운 응급실이 있는 병원</li></ul></div>
  </div>`;
  window.scrollTo(0, 0);
}
function renderAbout(){
  const bySrc = {};
  SOURCES.forEach(s => { const g = s.topic || '기타'; (bySrc[g] = bySrc[g] || []).push(s); });
  $app.innerHTML = `<div class="wrap page">
    <h1>출처와 안내</h1>
    <p class="lead">학교에서 사안이 생겼을 때 처음 몇 시간 동안 할 일을 빠르게 찾도록 만든 참고 자료입니다.</p>
    <div class="note"><b>꼭 읽어 주세요</b><ul>
      <li>법령과 교육부·교육청 매뉴얼 원문을 요약한 참고용입니다. 최종 판단은 원문과 소속 교육청 안내를 따르세요.</li>
      <li>법령과 지침은 자주 바뀝니다. 각 사안의 출처와 확인일을 함께 보세요. 이 판의 기준일은 ${esc(DATA.updated)}입니다.</li>
      <li>경상북도 기준으로 정리했습니다. 시·도마다 담당 기관과 절차가 조금씩 다를 수 있습니다.</li>
      <li>2021년 이후 발행된 자료만 근거로 썼습니다.</li>
      <li>이 사이트는 아무것도 서버에 보내지 않습니다. 체크 표시는 이 기기 브라우저에만 남고, 기록 메모는 창을 닫으면 지워집니다.</li>
    </ul></div>
    <h2>수록 사안 ${CASES.length}가지</h2>
    <div class="card plain"><ul>${CAT_ORDER.map(k => { const a = CASES.filter(c => c.category === k); return a.length ? `<li><b>${esc(k)}</b> — ${a.map(c => `<a href="#/c/${c.id}">${esc(c.title)}</a>`).join(', ')}</li>` : ''; }).join('')}</ul></div>
    ${SOURCES.length ? `<h2>주요 원문 자료</h2>${Object.entries(bySrc).map(([g, arr]) => `<p style="font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 6px">${esc(g)}</p><div class="card"><ul class="src">${arr.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)} <span class="y">${esc(s.publisher || '')}${s.year ? ' · ' + esc(s.year) : ''}</span></li>`).join('')}</ul></div>`).join('')}` : ''}
  </div>`;
  window.scrollTo(0, 0);
}

/* ---------- 길 ---------- */
function route(){
  const h = location.hash || '#/';
  let nav = 'home';
  if (h.startsWith('#/c/')) { renderCase(decodeURIComponent(h.slice(4))); nav = ''; }
  else if (h === '#/contacts') { renderContacts(); nav = 'contacts'; }
  else if (h === '#/about') { renderAbout(); nav = 'about'; }
  else if (h === '#' || h.startsWith('#/')) { renderHome(); }
  else return; // #s-… 본문 안 이동
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  const c = h.startsWith('#/c/') && BYID[decodeURIComponent(h.slice(4))];
  document.title = c ? c.title + ' · 학교 사안 처리 길잡이' : '학교 사안 처리 길잡이';
}
document.getElementById('foot').innerHTML = `법령·교육부 매뉴얼 원문을 요약한 참고 자료입니다. 최종 판단은 원문과 소속 교육청 안내를 따르세요. · 기준일 ${esc(DATA.updated)} · <a href="#/about">출처와 안내</a>`;
window.addEventListener('hashchange', route);
route();
})();
