<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#EFF3FB;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#1B2A41;position:relative;word-break:keep-all}
img{position:absolute;right:-230px;top:50%;transform:translateY(-50%);height:104%}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#EFF3FB 0%,#EFF3FB 38%,rgba(239,243,251,.85) 50%,rgba(239,243,251,0) 66%)}
.t{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:600px}
.brand{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:34px}
h1{font-size:64px;line-height:1.16;letter-spacing:-.045em;font-weight:800;margin-bottom:22px}
p{font-size:24px;line-height:1.5;color:#334155;letter-spacing:-.01em}
.chips{display:flex;gap:8px;margin-top:30px;flex-wrap:wrap;width:600px}
.chips span{font-size:17px;font-weight:700;color:#2456A6;background:#fff;border:1px solid #C8D6EC;border-radius:999px;padding:6px 14px}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:#2456A6}
</style></head><body>
<img src="hero.jpg" alt="">
<div class="fade"></div>
<div class="t">
  <div class="brand"><svg width="44" height="48" viewBox="0 0 40 44" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 2.5 35 8v12.2c0 10.2-6.3 17.6-15 21.3C11.3 37.8 5 30.4 5 20.2V8z" fill="#2456A6"/><path d="M20 2.5 35 8v12.2c0 10.2-6.3 17.6-15 21.3z" fill="#1C4487"/><path d="M13 13.5h7.5a4 4 0 0 1 0 8H17a4 4 0 0 0 0 8h1" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/><circle cx="12.6" cy="13.5" r="2.7" fill="#F28B74"/><path d="m19.5 29.5 3 3 6.5-7.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>학교 사안 처리 <span style="color:#2456A6">길잡이</span></div>
  <h1>사안이 생겼을 때,<br>지금 할 일부터</h1>
  <p>신고부터 조사·심의·불복·종결까지<br>법령·교육부 매뉴얼 원문 기준 업무 흐름도</p>
  <div class="chips"><span>학교폭력</span><span>아동학대</span><span>교육활동 침해</span><span>자해 위기</span><span>안전사고</span></div>
</div>
<div class="bar"></div>
</body></html>
